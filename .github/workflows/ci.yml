name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build, vet, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        # Runners have Docker, so a skipped PostgreSQL test means a broken
        # fixture, not a missing database.
        env:
          IPAM_TEST_REQUIRE_POSTGRES: "1"
        run: go test -timeout 5m ./pkg/... ./internal/... ./test/fixtures/... -count=1

      - name: Verify no forbidden imports
        run: |
          if grep -rE "datum-cloud/(milo|quota)" --include='*.go' . ; then
            echo "FAIL: unwanted imports of datum-cloud/milo or datum-cloud/quota"
            exit 1
          fi
          echo "OK: no forbidden imports"

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12

  kustomize:
    name: Validate kustomize overlays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install kustomize
        run: |
          curl -sLo /tmp/kustomize.tgz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tgz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/

      - name: Build dev overlay
        run: kustomize build config/overlays/dev/ > /dev/null

      - name: Build test-infra overlay
        run: kustomize build config/overlays/test-infra/ > /dev/null

      - name: Build k6 component
        run: kustomize build config/components/k6-performance-tests/ > /dev/null

      # The install path for the IAM manifests, rendered by the infra Flux
      # Kustomization rather than by either overlay above.
      - name: Build Milo IAM bundle
        run: kustomize build config/milo/ > /dev/null

  k6-validate:
    name: Validate k6 scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: k6 inspect each script
        run: |
          set -e
          for f in test/load/src/*.js; do
            k6 inspect "$f" >/dev/null
            echo "  ok  $f"
          done

  e2e:
    name: End-to-end tests (Chainsaw)
    runs-on: ubuntu-latest
    env:
      TASK_X_REMOTE_TASKFILES: "1"
      # test-infra writes kubeconfig here when running outside the test-infra repo
      KUBECONFIG: .test-infra/kubeconfig
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install kind
        run: |
          KIND_VERSION="v0.30.0"
          curl -fsSL -o kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          KUBECTL_VERSION="$(curl -sL https://dl.k8s.io/release/stable.txt)"
          curl -fsSL -o kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install kustomize
        run: |
          curl -sLo /tmp/kustomize.tgz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tgz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Install Flux CLI
        run: |
          curl -fsSL https://fluxcd.io/install.sh | sudo bash

      - name: Install Chainsaw
        run: |
          CHAINSAW_VERSION="v0.2.15"
          curl -fsSL -o /tmp/chainsaw.tgz \
            "https://github.com/kyverno/chainsaw/releases/download/${CHAINSAW_VERSION}/chainsaw_linux_amd64.tar.gz"
          tar -xzf /tmp/chainsaw.tgz -C /tmp chainsaw
          sudo mv /tmp/chainsaw /usr/local/bin/chainsaw

      - name: Spin up kind cluster (test-infra)
        run: task --yes test-infra:cluster-up

      - name: Build IPAM container image
        run: task --yes dev:build

      - name: Load image into kind
        run: task --yes dev:load

      - name: Create control-plane-ca configmap
        run: |
          # The aggregated apiserver uses --requestheader-client-ca-file to verify
          # the front proxy identity. In kind the cert lives in the
          # extension-apiserver-authentication ConfigMap in kube-system.
          kubectl create namespace ipam-system --dry-run=client -o yaml | kubectl apply -f -
          kubectl get configmap extension-apiserver-authentication -n kube-system \
            -o jsonpath='{.data.requestheader-client-ca-file}' > /tmp/requestheader-ca.crt
          kubectl create configmap control-plane-ca \
            -n ipam-system \
            --from-file=ca.crt=/tmp/requestheader-ca.crt \
            --dry-run=client -o yaml | kubectl apply -f -

      # Deploy ONLY Tempo (not the full observability stack) so the
      # test/e2e/tracing suite has a real collector to assert against. The full
      # stack (Victoria Metrics + Loki + Grafana) is unnecessary here and too
      # heavy for the single-node runner — Loki in particular times out. The
      # manifests live in the test-infra clone that cluster-up created.
      #
      # Tempo MUST be Ready BEFORE the IPAM apiserver starts: the apiserver's
      # OTLP gRPC exporter dials telemetry-system-tempo on startup, and if the
      # endpoint is absent the gRPC client enters a reconnect backoff (up to
      # ~120s) — long enough that the first allocation span never lands in Tempo
      # within the tracing suite's poll window. Deploying Tempo first lets the
      # exporter connect to a live collector immediately.
      - name: Deploy Tempo (tracing e2e collector)
        run: |
          kubectl apply -f .test-infra/components/observability/namespace.yaml
          kubectl apply -f .test-infra/components/observability/helm-repositories.yaml
          kubectl apply -f .test-infra/components/observability/tempo-hr.yaml
          kubectl -n flux-system wait helmrelease/tempo --for=condition=Ready --timeout=300s
          kubectl -n telemetry-system rollout status statefulset/telemetry-system-tempo --timeout=180s

      - name: Deploy IPAM service
        run: |
          kubectl apply -k config/overlays/test-infra
          # Wait for cert-manager to issue the TLS secret before the apiserver pods can mount it.
          kubectl -n ipam-system wait certificate/ipam-tls \
            --for=condition=Ready --timeout=120s
          kubectl -n ipam-system wait helmrelease/postgres \
            --for=condition=Ready --timeout=300s
          kubectl -n ipam-system wait pod \
            -l app.kubernetes.io/name=postgresql \
            --for=condition=Ready --timeout=180s
          kubectl wait --for=condition=Ready pod \
            -l app=ipam-apiserver -n ipam-system --timeout=180s
          kubectl wait --for=condition=Available \
            apiservice/v1alpha1.ipam.miloapis.com --timeout=180s

      - name: Seed tenant impersonation kubeconfig and RBAC
        # Every claim resolves its class, and resolving a class needs a project,
        # so the suites drive the apiserver as a project tenant. Chainsaw
        # resolves each suite's `clusters:` kubeconfig path when it loads the
        # suite, so this has to run before `chainsaw test`.
        run: |
          sh test/e2e/lib/gen-impersonation-kubeconfig.sh test/e2e/.tenant-impersonation.kubeconfig
          kubectl apply -f test/e2e/lib/tenant-rbac.yaml
          sh test/e2e/lib/clear-tenant-fixtures.sh

      - name: Run Chainsaw e2e suites
        run: chainsaw test test/e2e/

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods -A
          echo "=== IPAM pod describe ==="
          kubectl describe pods -n ipam-system -l app=ipam-apiserver || true
          echo "=== IPAM apiserver logs ==="
          kubectl logs -n ipam-system -l app=ipam-apiserver --all-containers --tail=100 || true
          echo "=== CertificateRequests ==="
          kubectl get certificaterequests -n ipam-system -o wide || true
          echo "=== Events ==="
          kubectl get events -n ipam-system --sort-by='.lastTimestamp' | tail -60 || true
          echo "=== APIService ==="
          kubectl get apiservice v1alpha1.ipam.miloapis.com -o yaml || true

      - name: Tear down kind cluster
        if: always()
        run: task --yes test-infra:cluster-down

  observability:
    name: Verify observability artifacts
    runs-on: ubuntu-latest
    env:
      TASK_X_REMOTE_TASKFILES: "1"
    steps:
      - uses: actions/checkout@v6

      # go-jsonnet, jb (jsonnet-bundler), kubeconform are installed via
      # `go install` from the observability Taskfile's install-tooling
      # target — Go is needed even though the verify step is not Go code.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install kustomize
        run: |
          curl -sLo /tmp/kustomize.tgz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tgz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/

      # `task observability:verify-dashboards` depends on `init`, which depends
      # on `install-tooling` — that chain runs `jb install` against the
      # committed jsonnetfile.lock.json to vendor Grafonnet under
      # config/components/observability/dashboards/jsonnet/vendor/. The init
      # task is idempotent (status check skips if vendor/grafonnet-vX.Y.Z
      # already exists), so re-runs are a no-op.
      - name: Verify dashboards (jsonnet → JSON in sync)
        run: task --yes observability:verify-dashboards

      - name: Verify alerts (promtool check rules)
        run: task --yes observability:verify-alerts

      - name: Verify rendered manifests (kubeconform)
        run: task --yes observability:verify-manifests
