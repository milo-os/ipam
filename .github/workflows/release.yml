name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  release:
    types: ["published"]

jobs:
  validate-kustomize:
    uses: datum-cloud/actions/.github/workflows/validate-kustomize.yaml@v1.14.0

  publish-container-image:
    needs:
      - validate-kustomize
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.14.0
    with:
      image-name: ipam
      registry-organization: milo-os
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  publish-kustomize-bundle:
    needs:
      - validate-kustomize
      - publish-container-image
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@v1.14.0
    with:
      bundle-name: ghcr.io/milo-os/ipam-kustomize
      bundle-path: config
      image-overlays: config/base
      image-name: ghcr.io/milo-os/ipam
    secrets: inherit

  # Build and publish the milo-ipam datumctl plugin as per-platform archives +
  # checksums.txt, attached as GitHub release assets. The produced asset names
  # are consumed by the datumctl plugin catalog entry in milo-os/cli-plugins
  # (plugins/ipam.yaml).
  #
  # Runs ONLY on `release: published`. Publishing a release via the GitHub UI
  # creates the tag, which fires BOTH `push: tags` and `release: published`; if
  # this job keyed off the tag ref it would run twice concurrently and two
  # goreleaser processes would race to upload the same assets. Gating on the
  # release event makes it run exactly once and gives us a real release for
  # goreleaser to attach artifacts to.
  publish-plugin:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Syft CLI
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Mint a short-lived token for the cross-repo catalog PR. The built-in
  # GITHUB_TOKEN only reaches this repo, so we exchange the milo-os GitHub App's
  # credentials for an installation token scoped to the catalog repo. The App's
  # ID and private key are stored as secrets (ideally org-level, shared by every
  # milo plugin repo); the minted token is repo-scoped and expires in ~1 hour.
  generate-index-token:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      token: ${{ steps.app-token.outputs.token }}
    steps:
      - name: Mint catalog token from the milo-os GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PLUGIN_INDEX_APP_ID }}
          private-key: ${{ secrets.PLUGIN_INDEX_APP_PRIVATE_KEY }}
          owner: milo-os
          repositories: cli-plugins

  # After goreleaser attaches the archives + checksums.txt to the release, open
  # a PR against the datumctl plugin catalog (milo-os/cli-plugins) bumping
  # plugins/ipam.yaml to this release: new version, per-platform download URLs,
  # and refreshed sha256s pulled from checksums.txt. Gated on the release event
  # (matching publish-plugin) so it runs exactly once, and depends on
  # publish-plugin so checksums.txt exists before it reads it.
  #
  # NOTE: pinned to the datum-cloud/actions branch that introduces this workflow
  # until it ships in a tagged release; switch this ref to a version tag (e.g.
  # @v1.15.0) once that release is cut.
  update-plugin-index:
    needs:
      - publish-plugin
      - generate-index-token
    if: github.event_name == 'release'
    permissions:
      contents: read
    uses: datum-cloud/actions/.github/workflows/update-plugin-index.yaml@feat/update-plugin-index
    with:
      index-repo: milo-os/cli-plugins
      plugin-name: ipam
      version: ${{ github.event.release.tag_name }}
    secrets:
      # Cross-repo PR auth: a repo-scoped installation token minted above from
      # the milo-os GitHub App. The built-in GITHUB_TOKEN cannot push to
      # milo-os/cli-plugins, and this avoids a long-lived PAT.
      PLUGIN_INDEX_TOKEN: ${{ needs.generate-index-token.outputs.token }}
