apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ipam-ca
  namespace: ipam-system
spec:
  isCA: true
  secretName: ipam-ca-secret
  duration: 87600h   # 10 years
  renewBefore: 8760h # 1 year before expiration
  subject:
    organizations:
      - datum-technology
  commonName: IPAM Internal CA
  issuerRef:
    name: selfsigned-cluster-issuer
    kind: ClusterIssuer
  privateKey:
    algorithm: RSA
    size: 4096
