apiVersion: iam.miloapis.com/v1alpha1
kind: ProtectedResource
metadata:
  name: ipam.miloapis.com-ipallocation
spec:
  serviceRef:
    name: "ipam.miloapis.com"
  kind: IPAllocation
  plural: ipallocations
  singular: ipallocation
  permissions:
    - list
    - get
    - watch
    - create
    - update
    - patch
    - delete
    # "release-unleased" is checked by the IPAllocation delete path (see
    # internal/access/release.go) when the allocation being released is
    # retained with no lease deadline. delete alone releases one whose lease
    # will run out anyway; one held with no deadline is held on purpose, often
    # by something still using it, so freeing it also needs this permission,
    # which only ipam-admin grants. The IPClaim create path checks it too, for
    # a claim that would reclaim such an allocation under reclaimPolicy Delete.
    # The server also accepts deletecollection, held by the namespace
    # controller through Kubernetes RBAC, so deleting a namespace still frees
    # its addresses. Do not declare deletecollection here: a role could then
    # grant it, and with it the release of an address held on purpose.
    - release-unleased
  subresources:
    - name: status
      permissions:
        - get
        - update
        - patch
  parentResources:
    - apiGroup: resourcemanager.miloapis.com
      kind: Project
