apiVersion: iam.miloapis.com/v1alpha1
kind: ProtectedResource
metadata:
  name: ipam.miloapis.com-ipclass
spec:
  serviceRef:
    name: "ipam.miloapis.com"
  kind: IPClass
  plural: ipclasses
  singular: ipclass
  permissions:
    - list
    - get
    - watch
    - create
    - update
    - patch
    - delete
    - updateStatus
    # "use" is checked when an IPClass in another project is created with
    # spec.source naming this class (see internal/access/class.go). Granting it
    # admits that project's claims into this class's address space.
    - use
  parentResources:
    - apiGroup: resourcemanager.miloapis.com
      kind: Project
