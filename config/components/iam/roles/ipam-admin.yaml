apiVersion: iam.miloapis.com/v1alpha1
kind: Role
metadata:
  name: ipam.miloapis.com-admin
  annotations:
    kubernetes.io/display-name: IPAM Admin
    kubernetes.io/description: "Full access to all IPAM resources, including releasing a retained address that has no lease deadline"
spec:
  launchStage: Beta
  # Admin is the union of provider (pool CRUD + use) and consumer (claim CRUD
  # and releasing a retained IPAllocation that has a lease deadline), both of
  # which inherit viewer (reads). Allocations are written only by the claim
  # that makes them, so there is no create, update or patch to grant: their
  # spec is immutable, and status remains system-managed.
  #
  # Admin alone may also release a retained IPAllocation with no lease
  # deadline: one whose class retains by default with no retentionLease, in a
  # pool with no maxRetentionLease, such as a VPC or subnet block. Nothing
  # would ever free it, because whatever owned it may still be using it, so
  # the server checks release-unleased itself when the row has no deadline.
  # Deleting the namespace frees it too, through the namespace controller's
  # deletecollection, which the server accepts in place of release-unleased.
  inheritedRoles:
    - name: ipam.miloapis.com-provider
    - name: ipam.miloapis.com-consumer
  includedPermissions:
    - ipam.miloapis.com/ipallocations.release-unleased
