# The identity the in-cluster k6 runner authenticates as.
#
# The runner never calls IPAM as itself. Every IPAM request is made as the
# impersonated user ipam-perf-tester (tenant-rbac.yaml), carrying a project in
# the iam.miloapis.com/parent-* user extras: IPAM scopes every read and write to
# a project, and resolving a claim's class needs one. So the runner needs only
# the right to impersonate that user and those extras, plus namespace create
# and delete for the claim namespaces setup-pools.js and cleanup.js manage.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ipam-k6-runner
  namespace: ipam-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ipam-k6-runner
rules:
  - apiGroups: [""]
    resources: ["users"]
    verbs: ["impersonate"]
    resourceNames: ["ipam-perf-tester"]
  - apiGroups: ["authentication.k8s.io"]
    resources:
      - "userextras/iam.miloapis.com/parent-name"
      - "userextras/iam.miloapis.com/parent-type"
      - "userextras/iam.miloapis.com/parent-api-group"
    verbs: ["impersonate"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ipam-k6-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ipam-k6-runner
subjects:
  - kind: ServiceAccount
    name: ipam-k6-runner
    namespace: ipam-system
