apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: ipam-perf-ipv6-throughput
  namespace: ipam-system
spec:
  parallelism: 1
  separate: false
  cleanup: post
  script:
    configMap:
      name: ipam-k6-test-scripts
      file: ipv6-claim-throughput.js
  runner:
    image: grafana/k6:latest
    serviceAccountName: ipam-k6-runner
    # IPv6 is the platform's primary address family, so the runner gets a
    # heavier resource budget than the IPv4 throughput run.
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 1Gi
    env:
      - name: IPAM_API_URL
        value: "https://kubernetes.default.svc.cluster.local:443"
      - name: K6_INSECURE_SKIP_TLS_VERIFY
        value: "true"
      - name: NAMESPACE_COUNT
        value: "10"
      - name: PROJECT_COUNT
        value: "5"
      - name: VUS
        value: "50"
      - name: DURATION
        value: "2m"
      - name: CROSS_RATIO
        value: "0.1"
      - name: CLAIM_PREFIX_LENGTH
        value: "48"
