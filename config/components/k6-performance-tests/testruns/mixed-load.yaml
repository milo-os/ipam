apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: ipam-perf-mixed-load
  namespace: ipam-system
spec:
  parallelism: 1
  separate: false
  # cleanup: post intentionally omitted so pod logs remain accessible after the run
  script:
    configMap:
      name: ipam-k6-test-scripts
      file: mixed-load.js
  runner:
    image: grafana/k6:latest
    serviceAccountName: ipam-k6-runner
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2Gi
    env:
      - name: IPAM_API_URL
        value: "https://kubernetes.default.svc.cluster.local:443"
      - name: K6_INSECURE_SKIP_TLS_VERIFY
        value: "true"
      - name: NAMESPACE_COUNT
        value: "10"
      - name: PROJECT_COUNT
        value: "5"
