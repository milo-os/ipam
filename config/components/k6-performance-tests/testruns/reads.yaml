apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: ipam-perf-reads
  namespace: ipam-system
spec:
  parallelism: 1
  separate: false
  cleanup: post
  script:
    configMap:
      name: ipam-k6-test-scripts
      file: read-latency.js
  runner:
    image: grafana/k6:latest
    serviceAccountName: ipam-k6-runner
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 1Gi
    env:
      - name: IPAM_API_URL
        value: "https://kubernetes.default.svc.cluster.local:443"
      - name: K6_INSECURE_SKIP_TLS_VERIFY
        value: "true"
      - name: IPAM_TENANCY
        value: "impersonate"
      - name: PROJECT_COUNT
        value: "5"
      - name: NAMESPACE_COUNT
        value: "4"
      - name: DURATION
        value: "3m"
