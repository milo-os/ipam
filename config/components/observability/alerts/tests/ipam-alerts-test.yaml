# promtool unit tests for alerts/ipam-alerts.yaml, run by
# `task observability:verify-alerts` against the rules extracted from the
# PrometheusRule. Every series is scraped once a minute; the sweep interval is
# 60s unless a case says otherwise.
rule_files: [ipam-alerts.rules.yaml]
evaluation_interval: 1m
tests:
  # IPAMRetentionReleasesStalled: five rows stuck past the grace, passes completing. Late from the start: the floors are comparable from 15m, so it fires from 45m.
  - interval: 1m
    input_series:
      - series: ipam_retention_sweep_enforcing{pod="a"}
        values: 1x120
      - series: ipam_retention_sweep_interval_seconds{pod="a"}
        values: 60x120
      - series: ipam_retention_sweep_last_success_timestamp_seconds{pod="a"}
        values: 0+60x120
      - series: ipam_retained_gauges_last_success_timestamp_seconds{pod="a"}
        values: 0+60x120
      - series: ipam_retained_late_allocations{pod="a",ip_family="IPv4"}
        values: 5x120
      - series: ipam_retained_overdue_allocations{pod="a",ip_family="IPv4"}
        values: 5x120
      - series: ipam_retained_oldest_overdue_seconds{pod="a",ip_family="IPv4"}
        values: 600+60x120
      - series: ipam_retained_late_allocations{pod="a",ip_family="IPv6"}
        values: 0x120
      - series: ipam_retained_oldest_overdue_seconds{pod="a",ip_family="IPv6"}
        values: 0x120
    alert_rule_test:
      - {eval_time: 40m, alertname: IPAMRetentionReleasesStalled, exp_alerts: []}
      - eval_time: 50m
        alertname: IPAMRetentionReleasesStalled
        exp_alerts:
          - exp_labels: {ip_family: IPv4, severity: warning, service: ipam, slo: retention}
            exp_annotations:
              summary: "IPAM IPv4 retained allocations are not being released (1h 0m 0s past their deadline)"
              description: "The retention sweeper is in enforce mode and its passes complete, but retained\nIPv4 allocations have been more than five sweep intervals past\ntheir lease deadline for at least 45 minutes, and their number has not fallen.\nThose addresses stay held instead of returning to their pools.\n"
              runbook_url: "https://github.com/miloapis/ipam/blob/main/docs/runbooks/ipam-retention-releases-stalled.md"

  # One stuck row among normal churn: the overdue count is noisy, the late count stays at one with brief spikes, and the floors hold.
  - interval: 1m
    input_series:
      - series: ipam_retention_sweep_enforcing{pod="a"}
        values: 1x180
      - series: ipam_retention_sweep_interval_seconds{pod="a"}
        values: 60x180
      - series: ipam_retention_sweep_last_success_timestamp_seconds{pod="a"}
        values: 0+60x180
      - series: ipam_retained_gauges_last_success_timestamp_seconds{pod="a"}
        values: 0+60x180
      - series: ipam_retained_overdue_allocations{pod="a",ip_family="IPv4"}
        values: 1 3 2 1 4 2 1 2 3 1 1 2 3 4 1 2 1 3 2 2 1 2 4 3 1 2 1 1 3 2 1 4 2 1 2 3 1 1 2 3 4 1 2 1 3 2 2 1 2 4 3 1 2 1 1 3 2 1 4 2 1 3 2 1 4 2 1 2 3 1 1 2 3 4 1 2 1 3 2 2 1 2 4 3 1 2 1 1 3 2 1 4 2 1 2 3 1 1 2 3 4 1 2 1 3 2 2 1 2 4 3 1 2 1 1 3 2 1 4 2 1 3 2 1 4 2 1 2 3 1 1 2 3 4 1 2 1 3 2 2 1 2 4 3 1 2 1 1 3 2 1 4 2 1 2 3 1 1 2 3 4 1 2 1 3 2 2 1 2 4 3 1 2 1 1 3 2 1 4 2 1
      - series: ipam_retained_late_allocations{pod="a",ip_family="IPv4"}
        values: 1 1 2 1 1 1 1 3 1 1 1 2 1 1 1 1 1 2 1 1 1 1 3 1 1 1 2 1 1 1 1 1 2 1 1 1 1 3 1 1 1 2 1 1 1 1 1 2 1 1 1 1 3 1 1 1 2 1 1 1 1 1 2 1 1 1 1 3 1 1 1 2 1 1 1 1 1 2 1 1 1 1 3 1 1 1 2 1 1 1 1 1 2 1 1 1 1 3 1 1 1 2 1 1 1 1 1 2 1 1 1 1 3 1 1 1 2 1 1 1 1 1 2 1 1 1 1 3 1 1 1 2 1 1 1 1 1 2 1 1 1 1 3 1 1 1 2 1 1 1 1 1 2 1 1 1 1 3 1 1 1 2 1 1 1 1 1 2 1 1 1 1 3 1 1 1 2 1 1 1 1
      - series: ipam_retained_oldest_overdue_seconds{pod="a",ip_family="IPv4"}
        values: 600+60x180
    alert_rule_test:
      - eval_time: 120m
        alertname: IPAMRetentionReleasesStalled
        exp_alerts:
          - exp_labels: {ip_family: IPv4, severity: warning, service: ipam, slo: retention}
            exp_annotations:
              summary: "IPAM IPv4 retained allocations are not being released (2h 10m 0s past their deadline)"
              description: "The retention sweeper is in enforce mode and its passes complete, but retained\nIPv4 allocations have been more than five sweep intervals past\ntheir lease deadline for at least 45 minutes, and their number has not fallen.\nThose addresses stay held instead of returning to their pools.\n"
              runbook_url: "https://github.com/miloapis/ipam/blob/main/docs/runbooks/ipam-retention-releases-stalled.md"

  # The same stuck rows in observe mode: never.
  - interval: 1m
    input_series:
      - series: ipam_retention_sweep_enforcing{pod="a"}
        values: 0x120
      - series: ipam_retention_sweep_interval_seconds{pod="a"}
        values: 60x120
      - series: ipam_retention_sweep_last_success_timestamp_seconds{pod="a"}
        values: 0+60x120
      - series: ipam_retained_gauges_last_success_timestamp_seconds{pod="a"}
        values: 0+60x120
      - series: ipam_retained_late_allocations{pod="a",ip_family="IPv4"}
        values: 5x120
      - series: ipam_retained_oldest_overdue_seconds{pod="a",ip_family="IPv4"}
        values: 600+60x120
    alert_rule_test:
      - {eval_time: 90m, alertname: IPAMRetentionReleasesStalled, exp_alerts: []}

  # Sweeper disabled: interval 0, enforcing 0, no passes.
  - interval: 1m
    input_series:
      - series: ipam_retention_sweep_enforcing{pod="a"}
        values: 0x120
      - series: ipam_retention_sweep_interval_seconds{pod="a"}
        values: 0x120
      - series: ipam_retention_sweep_last_success_timestamp_seconds{pod="a"}
        values: 0x120
      - series: ipam_retained_gauges_last_success_timestamp_seconds{pod="a"}
        values: 0+60x120
      - series: ipam_retained_late_allocations{pod="a",ip_family="IPv4"}
        values: 5x120
      - series: ipam_retained_oldest_overdue_seconds{pod="a",ip_family="IPv4"}
        values: 600+60x120
    alert_rule_test:
      - {eval_time: 90m, alertname: IPAMRetentionReleasesStalled, exp_alerts: []}

  # Post-switch drain of 150k rows sharing one deadline, three days overdue, at 2000 a pass for 75 passes: quiet throughout. Three rows are left behind; it fires once the earlier window has left the drain (90m) and the 30m hold has passed.
  - interval: 1m
    input_series:
      - series: ipam_retention_sweep_enforcing{pod="a"}
        values: 1x200
      - series: ipam_retention_sweep_interval_seconds{pod="a"}
        values: 60x200
      - series: ipam_retention_sweep_last_success_timestamp_seconds{pod="a"}
        values: 0+60x200
      - series: ipam_retained_gauges_last_success_timestamp_seconds{pod="a"}
        values: 0+60x200
      - series: ipam_retained_late_allocations{pod="a",ip_family="IPv4"}
        values: 150003-2000x75 3x125
      - series: ipam_retained_oldest_overdue_seconds{pod="a",ip_family="IPv4"}
        values: 259200+60x200
    alert_rule_test:
      - {eval_time: 30m, alertname: IPAMRetentionReleasesStalled, exp_alerts: []}
      - {eval_time: 74m, alertname: IPAMRetentionReleasesStalled, exp_alerts: []}
      - {eval_time: 100m, alertname: IPAMRetentionReleasesStalled, exp_alerts: []}
      - eval_time: 125m
        alertname: IPAMRetentionReleasesStalled
        exp_alerts:
          - exp_labels: {ip_family: IPv4, severity: warning, service: ipam, slo: retention}
            exp_annotations:
              summary: "IPAM IPv4 retained allocations are not being released (3d 2h 5m 0s past their deadline)"
              description: "The retention sweeper is in enforce mode and its passes complete, but retained\nIPv4 allocations have been more than five sweep intervals past\ntheir lease deadline for at least 45 minutes, and their number has not fallen.\nThose addresses stay held instead of returning to their pools.\n"
              runbook_url: "https://github.com/miloapis/ipam/blob/main/docs/runbooks/ipam-retention-releases-stalled.md"

  # Two replicas mid-drain; b's read fails from the start, so its gauges and freshness stamp freeze. b is dropped and a's drain holds the alert off.
  - interval: 1m
    input_series:
      - series: ipam_retention_sweep_enforcing{pod="a"}
        values: 1x120
      - series: ipam_retention_sweep_interval_seconds{pod="a"}
        values: 60x120
      - series: ipam_retention_sweep_last_success_timestamp_seconds{pod="a"}
        values: 0+60x120
      - series: ipam_retained_gauges_last_success_timestamp_seconds{pod="a"}
        values: 0+60x120
      - series: ipam_retention_sweep_enforcing{pod="b"}
        values: 1x120
      - series: ipam_retention_sweep_interval_seconds{pod="b"}
        values: 60x120
      - series: ipam_retention_sweep_last_success_timestamp_seconds{pod="b"}
        values: 0+60x120
      - series: ipam_retained_gauges_last_success_timestamp_seconds{pod="b"}
        values: 0x120
      - series: ipam_retained_late_allocations{pod="a",ip_family="IPv4"}
        values: 300000-2000x120
      - series: ipam_retained_late_allocations{pod="b",ip_family="IPv4"}
        values: 300000x120
      - series: ipam_retained_oldest_overdue_seconds{pod="a",ip_family="IPv4"}
        values: 259200+60x120
      - series: ipam_retained_oldest_overdue_seconds{pod="b",ip_family="IPv4"}
        values: 259200x120
    alert_rule_test:
      - {eval_time: 100m, alertname: IPAMRetentionReleasesStalled, exp_alerts: []}

  # Passes not completing: IPAMRetentionSweeperStalled's case, not this one.
  - interval: 1m
    input_series:
      - series: ipam_retention_sweep_enforcing{pod="a"}
        values: 1x120
      - series: ipam_retention_sweep_interval_seconds{pod="a"}
        values: 60x120
      - series: ipam_retention_sweep_last_success_timestamp_seconds{pod="a"}
        values: 0x120
      - series: ipam_retained_gauges_last_success_timestamp_seconds{pod="a"}
        values: 0+60x120
      - series: ipam_retained_late_allocations{pod="a",ip_family="IPv4"}
        values: 5x120
      - series: ipam_retained_oldest_overdue_seconds{pod="a",ip_family="IPv4"}
        values: 600+60x120
    alert_rule_test:
      - {eval_time: 60m, alertname: IPAMRetentionReleasesStalled, exp_alerts: []}

  # A replica frozen with rows late while the healthy one reads zero: the frozen one is dropped, so a healthy fleet does not fire.
  - interval: 1m
    input_series:
      - series: ipam_retention_sweep_enforcing{pod="a"}
        values: 1x120
      - series: ipam_retention_sweep_interval_seconds{pod="a"}
        values: 60x120
      - series: ipam_retention_sweep_last_success_timestamp_seconds{pod="a"}
        values: 0x120
      - series: ipam_retained_gauges_last_success_timestamp_seconds{pod="a"}
        values: 0x120
      - series: ipam_retention_sweep_enforcing{pod="b"}
        values: 1x120
      - series: ipam_retention_sweep_interval_seconds{pod="b"}
        values: 60x120
      - series: ipam_retention_sweep_last_success_timestamp_seconds{pod="b"}
        values: 0+60x120
      - series: ipam_retained_gauges_last_success_timestamp_seconds{pod="b"}
        values: 0+60x120
      - series: ipam_retained_late_allocations{pod="a",ip_family="IPv4"}
        values: 5x120
      - series: ipam_retained_late_allocations{pod="b",ip_family="IPv4"}
        values: 0x120
      - series: ipam_retained_overdue_allocations{pod="a",ip_family="IPv4"}
        values: 5x120
      - series: ipam_retained_overdue_allocations{pod="b",ip_family="IPv4"}
        values: 0x120
      - series: ipam_retained_oldest_overdue_seconds{pod="a",ip_family="IPv4"}
        values: 3600x120
      - series: ipam_retained_oldest_overdue_seconds{pod="b",ip_family="IPv4"}
        values: 0x120
    alert_rule_test:
      - {eval_time: 100m, alertname: IPAMRetentionReleasesStalled, exp_alerts: []}

  # A replica frozen at zero while the healthy one sees rows stuck: the frozen one cannot hide the stall.
  - interval: 1m
    input_series:
      - series: ipam_retention_sweep_enforcing{pod="a"}
        values: 1x120
      - series: ipam_retention_sweep_interval_seconds{pod="a"}
        values: 60x120
      - series: ipam_retention_sweep_last_success_timestamp_seconds{pod="a"}
        values: 0x120
      - series: ipam_retained_gauges_last_success_timestamp_seconds{pod="a"}
        values: 0x120
      - series: ipam_retention_sweep_enforcing{pod="b"}
        values: 1x120
      - series: ipam_retention_sweep_interval_seconds{pod="b"}
        values: 60x120
      - series: ipam_retention_sweep_last_success_timestamp_seconds{pod="b"}
        values: 0+60x120
      - series: ipam_retained_gauges_last_success_timestamp_seconds{pod="b"}
        values: 0+60x120
      - series: ipam_retained_late_allocations{pod="a",ip_family="IPv4"}
        values: 0x120
      - series: ipam_retained_late_allocations{pod="b",ip_family="IPv4"}
        values: 5x120
      - series: ipam_retained_oldest_overdue_seconds{pod="a",ip_family="IPv4"}
        values: 0x120
      - series: ipam_retained_oldest_overdue_seconds{pod="b",ip_family="IPv4"}
        values: 600+60x120
    alert_rule_test:
      - eval_time: 50m
        alertname: IPAMRetentionReleasesStalled
        exp_alerts:
          - exp_labels: {ip_family: IPv4, severity: warning, service: ipam, slo: retention}
            exp_annotations:
              summary: "IPAM IPv4 retained allocations are not being released (1h 0m 0s past their deadline)"
              description: "The retention sweeper is in enforce mode and its passes complete, but retained\nIPv4 allocations have been more than five sweep intervals past\ntheir lease deadline for at least 45 minutes, and their number has not fallen.\nThose addresses stay held instead of returning to their pools.\n"
              runbook_url: "https://github.com/miloapis/ipam/blob/main/docs/runbooks/ipam-retention-releases-stalled.md"

  # IPAMRetainedSetUnread: both replicas' reads fail from 10m while passes keep completing. Stale after 5m, then 15m for: fires from 31m. Releases-stalled has no fresh replica to judge and stays quiet.
  - interval: 1m
    input_series:
      - series: ipam_retention_sweep_enforcing{pod="a"}
        values: 1x60
      - series: ipam_retention_sweep_interval_seconds{pod="a"}
        values: 60x60
      - series: ipam_retention_sweep_interval_seconds{pod="b"}
        values: 60x60
      - series: ipam_retention_sweep_last_success_timestamp_seconds{pod="a"}
        values: 0+60x60
      - series: ipam_retained_gauges_last_success_timestamp_seconds{pod="a"}
        values: 0+60x10 600x50
      - series: ipam_retained_gauges_last_success_timestamp_seconds{pod="b"}
        values: 0+60x9 540x51
      - series: ipam_retained_late_allocations{pod="a",ip_family="IPv4"}
        values: 5x60
      - series: ipam_retained_oldest_overdue_seconds{pod="a",ip_family="IPv4"}
        values: 600x60
    alert_rule_test:
      - {eval_time: 30m, alertname: IPAMRetainedSetUnread, exp_alerts: []}
      - eval_time: 35m
        alertname: IPAMRetainedSetUnread
        exp_alerts:
          - exp_labels: {severity: warning, service: ipam, team: connect, slo: retention}
            exp_annotations:
              summary: "No IPAM replica has read the retained set for 25m 0s"
              description: "No apiserver replica has read the retained set for more than three sweep intervals\n(five minutes at least), though sweep passes still complete. The retained-allocation\ngauges are frozen at their last values, so IPAMRetentionReleasesStalled and\nIPAMRetainedWithoutLeaseRising cannot fire, and the Retention dashboard row is out\nof date. Releases may still be happening.\n"
              runbook_url: "https://github.com/miloapis/ipam/blob/main/docs/runbooks/ipam-retained-set-unread.md"
      - {eval_time: 35m, alertname: IPAMRetentionReleasesStalled, exp_alerts: []}

  # One replica's read fails and the other's keeps working: the fleet still has fresh gauges, so never.
  - interval: 1m
    input_series:
      - series: ipam_retention_sweep_interval_seconds{pod="a"}
        values: 60x60
      - series: ipam_retained_gauges_last_success_timestamp_seconds{pod="a"}
        values: 0+60x60
      - series: ipam_retained_gauges_last_success_timestamp_seconds{pod="b"}
        values: 0+60x10 600x50
    alert_rule_test:
      - {eval_time: 50m, alertname: IPAMRetainedSetUnread, exp_alerts: []}

  # A disabled sweeper (interval 0) reads nothing, and is not alerted on.
  - interval: 1m
    input_series:
      - series: ipam_retention_sweep_interval_seconds{pod="a"}
        values: 0x60
      - series: ipam_retained_gauges_last_success_timestamp_seconds{pod="a"}
        values: 0x60
    alert_rule_test:
      - {eval_time: 50m, alertname: IPAMRetainedSetUnread, exp_alerts: []}

  # A fleet whose read has failed since it started reports 0 and fires. promtool's clock starts at 0, so $value is the test's elapsed time.
  - interval: 1m
    input_series:
      - series: ipam_retention_sweep_interval_seconds{pod="a"}
        values: 60x60
      - series: ipam_retention_sweep_last_success_timestamp_seconds{pod="a"}
        values: 0+60x60
      - series: ipam_retained_gauges_last_success_timestamp_seconds{pod="a"}
        values: 0x60
    alert_rule_test:
      - {eval_time: 10m, alertname: IPAMRetainedSetUnread, exp_alerts: []}
      - eval_time: 25m
        alertname: IPAMRetainedSetUnread
        exp_alerts:
          - exp_labels: {severity: warning, service: ipam, team: connect, slo: retention}
            exp_annotations:
              summary: "No IPAM replica has read the retained set for 25m 0s"
              description: "No apiserver replica has read the retained set for more than three sweep intervals\n(five minutes at least), though sweep passes still complete. The retained-allocation\ngauges are frozen at their last values, so IPAMRetentionReleasesStalled and\nIPAMRetainedWithoutLeaseRising cannot fire, and the Retention dashboard row is out\nof date. Releases may still be happening.\n"
              runbook_url: "https://github.com/miloapis/ipam/blob/main/docs/runbooks/ipam-retained-set-unread.md"

  # A fleet that exports no read timestamp, such as an image from before the gauge, counts as never read and fires.
  - interval: 1m
    input_series:
      - series: ipam_retention_sweep_interval_seconds{pod="a"}
        values: 60x60
      - series: ipam_retention_sweep_last_success_timestamp_seconds{pod="a"}
        values: 0+60x60
    alert_rule_test:
      - {eval_time: 14m, alertname: IPAMRetainedSetUnread, exp_alerts: []}
      - eval_time: 16m
        alertname: IPAMRetainedSetUnread
        exp_alerts:
          - exp_labels: {severity: warning, service: ipam, team: connect, slo: retention}
            exp_annotations:
              summary: "No IPAM replica has read the retained set for 16m 0s"
              description: "No apiserver replica has read the retained set for more than three sweep intervals\n(five minutes at least), though sweep passes still complete. The retained-allocation\ngauges are frozen at their last values, so IPAMRetentionReleasesStalled and\nIPAMRetainedWithoutLeaseRising cannot fire, and the Retention dashboard row is out\nof date. Releases may still be happening.\n"
              runbook_url: "https://github.com/miloapis/ipam/blob/main/docs/runbooks/ipam-retained-set-unread.md"

  # A whole-database outage: passes and reads stop together. IPAMRetentionSweeperStalled fires (its condition is what holds this one off), and this alert stands down.
  - interval: 1m
    input_series:
      - series: ipam_retention_sweep_interval_seconds{pod="a"}
        values: 60x60
      - series: ipam_retention_sweep_last_success_timestamp_seconds{pod="a"}
        values: 0+60x10 600x50
      - series: ipam_retained_gauges_last_success_timestamp_seconds{pod="a"}
        values: 0+60x10 600x50
    alert_rule_test:
      - {eval_time: 50m, alertname: IPAMRetainedSetUnread, exp_alerts: []}

  # Mixed fleet: one replica has the sweeper disabled and never reads, one restarted and reads 0 until its first pass, one is healthy. Never.
  - interval: 1m
    input_series:
      - series: ipam_retention_sweep_interval_seconds{pod="off"}
        values: 0x60
      - series: ipam_retained_gauges_last_success_timestamp_seconds{pod="off"}
        values: 0x60
      - series: ipam_retention_sweep_interval_seconds{pod="ok"}
        values: 60x60
      - series: ipam_retention_sweep_last_success_timestamp_seconds{pod="ok"}
        values: 0+60x60
      - series: ipam_retained_gauges_last_success_timestamp_seconds{pod="ok"}
        values: 0+60x60
      - series: ipam_retention_sweep_interval_seconds{pod="new"}
        values: _x30 60x30
      - series: ipam_retained_gauges_last_success_timestamp_seconds{pod="new"}
        values: _x30 0 1860+60x29
    alert_rule_test:
      - {eval_time: 50m, alertname: IPAMRetainedSetUnread, exp_alerts: []}

  # IPAMQuotaClaimWaitsHigh: 150 open waits on IPAM pod a, held: firing from 10m. IPAM pod b holds 50, and a Milo API server pod holds 500 under its own job; neither fires.
  - interval: 1m
    input_series:
      - series: milo_quota_admission_waiters_current{job="ipam-apiserver",pod="a"}
        values: 150x20
      - series: milo_quota_admission_waiters_current{job="ipam-apiserver",pod="b"}
        values: 50x20
      - series: milo_quota_admission_waiters_current{job="milo-apiserver",pod="m"}
        values: 500x20
    alert_rule_test:
      - {eval_time: 9m, alertname: IPAMQuotaClaimWaitsHigh, exp_alerts: []}
      - eval_time: 11m
        alertname: IPAMQuotaClaimWaitsHigh
        exp_alerts:
          - exp_labels: {pod: a, severity: warning, service: ipam, team: connect, slo: claim_latency}
            exp_annotations:
              summary: "IPAM apiserver a has held more than 100 open quota claim waits for 10 minutes"
              description: "This pod holds 150 open quota claim waits, and a wait\nnormally ends in about a second. Milo is judging claims slowly, or a caller\ncreates quota-tracked IPAM resources in bulk faster than they are judged.\nThose creates are slow, and fail when their wait runs out.\n"
              runbook_url: "https://github.com/miloapis/ipam/blob/main/docs/runbooks/ipam-quota-claim-waits.md"

  # A burst of 500 waits for 5 minutes, then back to 5: shorter than the 10 minutes, so nothing fires.
  - interval: 1m
    input_series:
      - series: milo_quota_admission_waiters_current{job="ipam-apiserver",pod="a"}
        values: 500x5 5x15
    alert_rule_test:
      - {eval_time: 12m, alertname: IPAMQuotaClaimWaitsHigh, exp_alerts: []}

  # IPAMQuotaClaimWaitGetsAfterGone: one read after a 410 a minute against 60 waits a minute, 15 reads and 900 waits in 15 minutes, past both bounds. The same series under Milo's job does not fire.
  - interval: 1m
    input_series:
      - series: milo_quota_admission_claim_wait_gets_after_gone_total{job="ipam-apiserver",pod="a"}
        values: 0+1x30
      - series: milo_quota_admission_waiter_registrations_total{job="ipam-apiserver",pod="a"}
        values: 0+60x30
      - series: milo_quota_admission_claim_wait_gets_after_gone_total{job="milo-apiserver",pod="m"}
        values: 0+1x30
      - series: milo_quota_admission_waiter_registrations_total{job="milo-apiserver",pod="m"}
        values: 0+60x30
    alert_rule_test:
      - eval_time: 25m
        alertname: IPAMQuotaClaimWaitGetsAfterGone
        exp_alerts:
          - exp_labels: {pod: a, severity: warning, service: ipam, team: connect}
            exp_annotations:
              summary: "Quota claim waits on IPAM apiserver a often meet 410 Gone"
              description: "Quota claim waits on this pod read their claim after a 410 15\ntimes in 15 minutes: Milo's claim cache lost the versions they watch from, for\nexample after a Milo API server started again.\n"
              runbook_url: "https://github.com/miloapis/ipam/blob/main/docs/runbooks/ipam-quota-claim-waits.md"

  # The same reads against 1,000 waits a minute: fewer than one in 100 waits, so 410s are still rare.
  - interval: 1m
    input_series:
      - series: milo_quota_admission_claim_wait_gets_after_gone_total{job="ipam-apiserver",pod="a"}
        values: 0+1x30
      - series: milo_quota_admission_waiter_registrations_total{job="ipam-apiserver",pod="a"}
        values: 0+1000x30
    alert_rule_test:
      - {eval_time: 25m, alertname: IPAMQuotaClaimWaitGetsAfterGone, exp_alerts: []}

  # Three reads in the window against 10 waits a minute: past one in 100, but under 5 reads, so it does not fire.
  - interval: 1m
    input_series:
      - series: milo_quota_admission_claim_wait_gets_after_gone_total{job="ipam-apiserver",pod="a"}
        values: 0x10 3x20
      - series: milo_quota_admission_waiter_registrations_total{job="ipam-apiserver",pod="a"}
        values: 0+10x30
    alert_rule_test:
      - {eval_time: 20m, alertname: IPAMQuotaClaimWaitGetsAfterGone, exp_alerts: []}

  # IPAMWatcherStuck: allocations succeed but the watcher dispatches nothing. Fires once the condition has held for 5m.
  - interval: 1m
    input_series:
      - series: ipam_watch_events_total{pod="a",kind="ipclaims",event_type="ADDED"}
        values: 0x30
      - series: ipam_allocation_attempts_total{pod="a",resource="ipclaim",ip_family="IPv4",project="p",org=""}
        values: 0+2x30
      - series: ipam_allocation_failures_total{pod="a",resource="ipclaim",reason="pool_exhausted",ip_family="IPv4",project="p",org=""}
        values: 0+1x30
    alert_rule_test:
      - {eval_time: 5m, alertname: IPAMWatcherStuck, exp_alerts: []}
      - eval_time: 15m
        alertname: IPAMWatcherStuck
        exp_alerts:
          - exp_labels: {severity: warning, service: ipam, team: connect, slo: watch_freshness}
            exp_annotations:
              summary: "IPAM watcher dispatched no events for 5m despite successful allocations"
              description: "`ipam_watch_events_total` has been flat for 5 minutes while\nallocations are succeeding (attempts minus failures) — the apiserver is\nwriting changelog rows but the LISTEN/NOTIFY watcher is not\ndispatching them. Watch consumers (e.g. controllers, kubectl -w)\nare silently stale.\n"
              runbook_url: "https://github.com/miloapis/ipam/blob/main/docs/runbooks/ipam-watcher-stuck.md"

  # IPAMWatcherStuck: successes with no failure series at all still count as traffic.
  - interval: 1m
    input_series:
      - series: ipam_watch_events_total{pod="a",kind="ipclaims",event_type="ADDED"}
        values: 0x30
      - series: ipam_allocation_attempts_total{pod="a",resource="ipclaim",ip_family="IPv4",project="p",org=""}
        values: 0+1x30
    alert_rule_test:
      - eval_time: 15m
        alertname: IPAMWatcherStuck
        exp_alerts:
          - exp_labels: {severity: warning, service: ipam, team: connect, slo: watch_freshness}
            exp_annotations:
              summary: "IPAM watcher dispatched no events for 5m despite successful allocations"
              description: "`ipam_watch_events_total` has been flat for 5 minutes while\nallocations are succeeding (attempts minus failures) — the apiserver is\nwriting changelog rows but the LISTEN/NOTIFY watcher is not\ndispatching them. Watch consumers (e.g. controllers, kubectl -w)\nare silently stale.\n"
              runbook_url: "https://github.com/miloapis/ipam/blob/main/docs/runbooks/ipam-watcher-stuck.md"

  # IPAMWatcherStuck: a client retrying a claim that keeps being refused. Every attempt fails and writes no changelog row, so the flat watch counter is expected.
  - interval: 1m
    input_series:
      - series: ipam_watch_events_total{pod="a",kind="ipclaims",event_type="ADDED"}
        values: 0x30
      - series: ipam_allocation_attempts_total{pod="a",resource="ipclaim",ip_family="",project="p",org=""}
        values: 0+2x30
      - series: ipam_allocation_failures_total{pod="a",resource="ipclaim",reason="class_not_found",ip_family="",project="p",org=""}
        values: 0+2x30
    alert_rule_test:
      - {eval_time: 20m, alertname: IPAMWatcherStuck, exp_alerts: []}

  # IPAMWatcherStuck: allocations succeed and the watcher keeps dispatching.
  - interval: 1m
    input_series:
      - series: ipam_watch_events_total{pod="a",kind="ipclaims",event_type="ADDED"}
        values: 0+1x30
      - series: ipam_allocation_attempts_total{pod="a",resource="ipclaim",ip_family="IPv4",project="p",org=""}
        values: 0+1x30
    alert_rule_test:
      - {eval_time: 20m, alertname: IPAMWatcherStuck, exp_alerts: []}
