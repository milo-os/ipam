---
# Grants the ipam-apiserver ServiceAccount the `system:auth-delegator` role.
#
# The apiserver needs `system:auth-delegator` to send TokenReview and
# SubjectAccessReview requests for the callers of its API. It is not needed for
# the /metrics scrape, which is unauthenticated (see servicemonitor.yaml).
#
# config/base/rbac-cluster.yaml already grants the same role, so this binding
# is redundant and could be dropped in a follow-up.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ipam-apiserver-auth-delegator
  labels:
    app.kubernetes.io/name: ipam
    app.kubernetes.io/component: apiserver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: ipam-apiserver
    namespace: ipam-system
