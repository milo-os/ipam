---
# GrafanaDashboard CR — Consumer (workload owner / project admin) view of IPAM.
# JSON source of truth: dashboards/generated/ipam-consumer.json (compiled
# from dashboards/jsonnet/ipam-consumer.jsonnet).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ipam-consumer
  labels:
    app.kubernetes.io/name: ipam
    app.kubernetes.io/component: dashboard
    ipam.miloapis.com/audience: consumer
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  # The Grafana instance lives in the `monitoring` namespace; this CR lives in
  # `ipam-system`. Without `allowCrossNamespaceImport: true` the operator
  # silently skips the dashboard during reconciliation.
  allowCrossNamespaceImport: true
  folder: "Platform / IPAM"
  resyncPeriod: 5m
  configMapRef:
    name: ipam-consumer-dashboard
    key: dashboard.json
