apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ipam-apiserver
  namespace: ipam-system
  labels:
    app.kubernetes.io/name: ipam
    app.kubernetes.io/component: apiserver
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ipam
      app.kubernetes.io/component: apiserver
  namespaceSelector:
    matchNames:
      - ipam-system
  endpoints:
    - port: https
      scheme: https
      path: /metrics
      interval: 30s
      tlsConfig:
        insecureSkipVerify: true
      # No bearer token, on purpose. The apiserver delegates authentication to
      # Milo, which does not recognise the scraper's in-cluster service-account
      # token, and a token that fails TokenReview is a 401 even on a path that
      # is allowed anonymously. The scrape therefore goes unauthenticated and
      # relies on the deployment listing /metrics in
      # AUTHORIZATION_ALWAYS_ALLOW_PATHS (activity and openmeter do the same).
