apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Postgres migrations Job for the IPAM service.
#
# The migrations/ directory at repo root is the SOURCE OF TRUTH; the
# ConfigMap below is hand-synced (or future: regenerated by `task generate`).
# The Job runs migrate.sh idempotently and ttlSecondsAfterFinished cleans up.

resources:
  - configmap.yaml
  - job.yaml
