apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres
  namespace: ipam-system
spec:
  interval: 5m
  timeout: 10m

  chart:
    spec:
      chart: postgresql
      version: 16.x
      sourceRef:
        kind: HelmRepository
        name: bitnami-postgres
        namespace: ipam-system
      interval: 1h

  values:
    architecture: standalone

    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql
      tag: 17.0.0-debian-12-r5
      pullPolicy: IfNotPresent

    auth:
      username: ipam
      database: ipam
      existingSecret: postgres-credentials
      secretKeys:
        adminPasswordKey: password
        userPasswordKey: password

    primary:
      persistence:
        enabled: true
        size: 1Gi

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 2000m
          memory: 512Mi

      extendedConfiguration: |
        synchronous_commit = off
        wal_writer_delay = 200ms
        shared_buffers = 192MB
        effective_cache_size = 384MB
        max_wal_size = 1GB
        min_wal_size = 256MB
        max_connections = 200

    service:
      type: ClusterIP
      ports:
        postgresql: 5432

  install:
    crds: CreateReplace
    createNamespace: false

  upgrade:
    crds: CreateReplace

  uninstall:
    keepHistory: false
