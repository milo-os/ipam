apiVersion: services.miloapis.com/v1alpha1
kind: Service
metadata:
  name: ipam-miloapis-com
spec:
  serviceName: ipam.miloapis.com
  displayName: IP Address Management
  description: >-
    Kubernetes-native IP Address Management. Allocate and manage IP prefixes,
    individual IP addresses, and AS numbers across the platform with atomic,
    synchronous allocation from project-scoped pools.
  phase: Published
  owner:
    producerProjectRef:
      name: platform-producer-project
  enablementPolicy:
    mode: GatedByProvider
