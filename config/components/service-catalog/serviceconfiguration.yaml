apiVersion: services.miloapis.com/v1alpha1
kind: ServiceConfiguration
metadata:
  name: ipam-miloapis-com
spec:
  serviceRef:
    name: ipam-miloapis-com
  phase: Published
  version: v1alpha1
  metrics:
    - name: ipam.miloapis.com/ipclaims
      displayName: IP Claims
      description: >-
        Number of IPClaim objects a project holds. Each IPClaim represents one
        outstanding allocation request or reservation against an IPAM pool.
      kind: Gauge
      unit: "1"
    - name: ipam.miloapis.com/public-ipv4claims
      displayName: Public IPv4 Claims
      description: >-
        Number of public IPv4 IPClaim objects a project holds. Each counts once
        against this metric in addition to the IP Claims metric.
      kind: Gauge
      unit: "1"
    - name: ipam.miloapis.com/ippools
      displayName: IP Pools
      description: >-
        Number of IPPool objects a project holds. Each IPPool is a block of
        address space carved from a parent pool — a subnet allocation.
      kind: Gauge
      unit: "1"
  quota:
    limits:
      - name: ipclaims-per-project
        metric: ipam.miloapis.com/ipclaims
        consumerType:
          apiGroup: resourcemanager.miloapis.com
          kind: Project
        unit: "1/{project}"
        defaultLimit: 100
        maxLimit: 10000
      - name: public-ipv4claims-per-project
        metric: ipam.miloapis.com/public-ipv4claims
        consumerType:
          apiGroup: resourcemanager.miloapis.com
          kind: Project
        unit: "1/{project}"
        defaultLimit: 2
        maxLimit: 256
      - name: ippools-per-project
        metric: ipam.miloapis.com/ippools
        consumerType:
          apiGroup: resourcemanager.miloapis.com
          kind: Project
        unit: "1/{project}"
        defaultLimit: 25
        maxLimit: 1000
    metricRules:
      - selector:
          apiGroup: ipam.miloapis.com
          kind: IPClaim
        metricCosts:
          ipam.miloapis.com/ipclaims: 1
          ipam.miloapis.com/public-ipv4claims: 1
        metricCostConditions:
          ipam.miloapis.com/public-ipv4claims: "has(trigger.spec.ipFamily) && trigger.spec.ipFamily == 'IPv4' && has(trigger.spec.addressScope) && trigger.spec.addressScope == 'Public'"
      - selector:
          apiGroup: ipam.miloapis.com
          kind: IPPool
        metricCosts:
          ipam.miloapis.com/ippools: 1
