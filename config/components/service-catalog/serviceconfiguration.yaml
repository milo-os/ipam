apiVersion: services.miloapis.com/v1alpha1
kind: ServiceConfiguration
metadata:
  name: ipam-miloapis-com
spec:
  serviceRef:
    name: ipam-miloapis-com
  phase: Published
  version: v1alpha1
  metrics:
    - name: ipam.miloapis.com/ipclaims
      displayName: IP Claims
      description: >-
        Number of IPClaim objects a project holds. Each IPClaim represents one
        outstanding allocation request or reservation against an IPAM pool.
      kind: Gauge
      unit: "1"
    - name: ipam.miloapis.com/ippools
      displayName: IP Pools
      description: >-
        Number of IPPool objects a project holds. Each IPPool is a block of
        address space carved from a parent pool — a subnet allocation.
      kind: Gauge
      unit: "1"
  quota:
    limits:
      # A fabric identity is claimed per network and retained forever, because
      # reissuing one would merge a new network into a dead one's routes. So a
      # project's claim count only ever rises, and the platform project that
      # holds the tenant address pools carries a claim for every network in the
      # environment rather than its own. A limit sized for one project's own
      # claims is reached in days there, and reaching it fails every address
      # allocation for every tenant.
      - name: ipclaims-per-project
        metric: ipam.miloapis.com/ipclaims
        consumerType:
          apiGroup: resourcemanager.miloapis.com
          kind: Project
        unit: "1/{project}"
        defaultLimit: 10000
        maxLimit: 1000000
      # Pools accrue the same way, one per network per location.
      - name: ippools-per-project
        metric: ipam.miloapis.com/ippools
        consumerType:
          apiGroup: resourcemanager.miloapis.com
          kind: Project
        unit: "1/{project}"
        defaultLimit: 2500
        maxLimit: 250000
    metricRules:
      - selector:
          apiGroup: ipam.miloapis.com
          kind: IPClaim
        metricCosts:
          ipam.miloapis.com/ipclaims: 1
      - selector:
          apiGroup: ipam.miloapis.com
          kind: IPPool
        metricCosts:
          ipam.miloapis.com/ippools: 1
