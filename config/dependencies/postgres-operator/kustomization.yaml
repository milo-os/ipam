apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Bitnami PostgreSQL is installed inline as a HelmRelease in
# config/components/postgres. This dependency directory is reserved for
# environments that prefer running CloudNativePG as a cluster-wide operator.
#
# To enable: include this directory under a dependencies kustomization.

resources:
  - cnpg-helmrepository.yaml
  - cnpg-helmrelease.yaml
