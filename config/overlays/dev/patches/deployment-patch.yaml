---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipam-apiserver
  namespace: ipam-system
spec:
  template:
    spec:
      containers:
        - name: apiserver
          imagePullPolicy: Never
          env:
            - name: LOG_LEVEL
              value: "4"
            # No Milo quota backend in the kind/dev cluster; disable quota so the
            # quota plugin's informers don't block readyz on missing CRDs.
            - name: ENABLE_QUOTA
              value: "false"
