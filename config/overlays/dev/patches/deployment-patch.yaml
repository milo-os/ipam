---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipam-apiserver
  namespace: ipam-system
spec:
  template:
    spec:
      containers:
        - name: apiserver
          imagePullPolicy: Never
          env:
            - name: LOG_LEVEL
              value: "4"
            # No Milo quota backend in the kind/dev cluster; disable quota so the
            # quota plugin's informers don't block readyz on missing CRDs.
            - name: ENABLE_QUOTA
              value: "false"
            # Mirror staging: /metrics is served without authentication so the
            # scraper needs no token Milo would have to recognise. Nothing else
            # beyond the probe paths is exempt from authn/authz.
            - name: AUTHORIZATION_ALWAYS_ALLOW_PATHS
              value: "/healthz,/readyz,/livez,/metrics"
            # A short sweep so the class-lease e2e suite sees a lease of a few
            # seconds released within its timeout. Enforce is the base default;
            # it is stated here so the suite does not depend on it.
            - name: RETENTION_SWEEP_INTERVAL
              value: "2s"
            - name: RETENTION_SWEEP_MODE
              value: "enforce"
