# TEST-ONLY. Kubeconfig IPAM uses to reach milo-apiserver in the kind cluster.
# The token is the system:masters token Milo's own test-infra overlay seeds
# (milo config/overlays/test-infra/components/auth); it exists nowhere outside
# a throwaway kind cluster. Production uses a cert-manager client certificate
# instead (datum-cloud/infra apps/ipam-system).
apiVersion: v1
kind: Secret
metadata:
  name: ipam-milo-kubeconfig
  namespace: ipam-system
type: Opaque
stringData:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: milo-apiserver
        cluster:
          server: https://milo-apiserver.milo-system.svc.cluster.local:6443
          insecure-skip-tls-verify: true
    users:
      - name: ipam-apiserver
        user:
          token: test-admin-token
    contexts:
      - name: milo
        context:
          cluster: milo-apiserver
          user: ipam-apiserver
    current-context: milo
