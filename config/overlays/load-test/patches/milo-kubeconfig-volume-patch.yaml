# Mount the milo-apiserver kubeconfig. Appended with JSON-patch `add /-` rather
# than a strategic merge, which would insert the volume at index 0 and be
# clobbered by tls-volume-patch.yaml (it replaces volumes/0). Listed after the
# TLS patch in kustomization.yaml for the same reason.
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: milo-kubeconfig
    mountPath: /etc/kubernetes/milo
    readOnly: true
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: milo-kubeconfig
    secret:
      secretName: ipam-milo-kubeconfig
