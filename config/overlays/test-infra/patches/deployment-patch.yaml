---
# In kind, images are loaded via `kind load docker-image` and are never
# pulled from a registry. Set Never to prevent Kyverno or other admission
# controllers from mutating imagePullPolicy to Always, which would fail
# because ipam-apiserver:dev doesn't exist on any public registry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipam-apiserver
spec:
  template:
    spec:
      initContainers:
        - name: migrate
          imagePullPolicy: Never
      containers:
        - name: apiserver
          imagePullPolicy: Never
          # No Milo quota backend in the kind/test-infra cluster — the
          # quota.miloapis.com CRDs don't exist, so the quota plugin's informers
          # would never sync and readyz would hang. Disable quota here.
          env:
            - name: ENABLE_QUOTA
              value: "false"
            # A short sweep so the class-lease e2e suite sees a lease of a few
            # seconds released within its timeout. Enforce is the base default;
            # it is stated here so the suite does not depend on it.
            - name: RETENTION_SWEEP_INTERVAL
              value: "2s"
            - name: RETENTION_SWEEP_MODE
              value: "enforce"
