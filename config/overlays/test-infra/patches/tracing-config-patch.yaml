# Point the apiserver's TracingConfiguration at the in-cluster e2e collector and
# sample at 100% so a single claim is deterministically recorded and exported.
# Strategic-merge replaces the `tracing.yaml` key wholesale (ConfigMap data has
# no merge key), which is exactly what we want here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ipam-tracing-config
  namespace: ipam-system
data:
  tracing.yaml: |
    apiVersion: apiserver.config.k8s.io/v1beta1
    kind: TracingConfiguration
    endpoint: ipam-trace-collector.ipam-system.svc.cluster.local:4317
    samplingRatePerMillion: 1000000
