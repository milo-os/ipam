---
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPrefixClass
metadata:
  name: consumer-private
spec:
  requiresVerification: false
  visibility: consumer
  defaultAllocation:
    minPrefixLength: 24
    maxPrefixLength: 28
    strategy: FirstFit
---
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPrefix
metadata:
  name: example-prefix
spec:
  cidr: 10.128.0.0/20
  ipFamily: IPv4
  classRef:
    name: consumer-private
  allocation:
    minPrefixLength: 24
    maxPrefixLength: 28
    strategy: FirstFit
