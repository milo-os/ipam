---
# A pool advertises the classes it is willing to back via spec.classNames. The
# pool owner — not the class author — decides whether a given range serves a
# class. A pool may back several classes, and a class may be backed by many
# pools. Consumers never see this object.
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPool
metadata:
  name: egress-us-east
spec:
  cidr: 203.0.113.0/24
  ipFamily: IPv4
  visibility: shared
  # This pool's capacity backs the "public-egress" class.
  classNames:
    - public-egress
