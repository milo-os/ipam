apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# IPClass example: define a platform-owned class, attach a pool to it via
# spec.classNames, then claim from the class by name — the consumer never
# names a pool.
#
# Apply with:
#   kubectl apply -k examples/ipclass/

resources:
  - ipclass.yaml
  - ippool.yaml
  - ipclaim.yaml
