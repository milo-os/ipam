apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: address-allocation
spec:
  description: |
    Synchronous IPAddressClaim allocation:
    - First claim binds with status.allocatedIP inside the pool CIDR.
    - Second claim binds with a distinct IP.
    - Filling the pool then attempting one more claim returns HTTP 507.
    - Releasing one bound claim makes the IP reusable.

    Pool sized as a /29 (8 addresses) instead of the spec's /28 (16). A /29 is
    still large enough to demonstrate distinct allocation, exhaustion and reuse
    while keeping the apply/wait loops short. The exhaustion suite uses /31 for
    the same reason; this preserves that "tight pool" idiom.

  steps:
    - name: setup-address-pool
      description: Create class + IPPrefix (10.50.0.0/29, /32 only) — 8 addresses
      try:
        - create:
            file: test-data/class.yaml
        - create:
            file: test-data/prefix.yaml
        - wait:
            apiVersion: ipam.miloapis.com/v1alpha1
            kind: IPPrefix
            name: addr-pool
            timeout: 30s
            for:
              condition:
                name: Ready
                value: 'True'

    - name: first-claim-bound
      description: |
        IPAddressClaim succeeds synchronously with status.phase=Bound and
        status.allocatedIP non-empty and inside 10.50.0.0/29.
      try:
        - create:
            file: test-data/claim-1.yaml
        - wait:
            apiVersion: ipam.miloapis.com/v1alpha1
            kind: IPAddressClaim
            name: addr-claim-1
            namespace: ($namespace)
            timeout: 30s
            for:
              jsonPath:
                path: '{.status.phase}'
                value: 'Bound'
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              ip=$(kubectl get ipaddressclaim -n "$NAMESPACE" addr-claim-1 -o jsonpath='{.status.allocatedIP}')
              if [ -z "$ip" ]; then
                echo "FAIL: empty allocatedIP"; exit 1
              fi
              # /29 covers 10.50.0.0 .. 10.50.0.7
              if ! echo "$ip" | grep -qE '^10\.50\.0\.[0-7]$'; then
                echo "FAIL: $ip not in 10.50.0.0/29"; exit 1
              fi
              echo "OK addr-claim-1 allocatedIP=$ip in 10.50.0.0/29"
            check:
              ($error == null): true
              (contains($stdout, 'OK addr-claim-1 allocatedIP=')): true

    - name: second-claim-distinct-ip
      description: Second claim binds with an IP different from claim-1.
      try:
        - create:
            file: test-data/claim-2.yaml
        - wait:
            apiVersion: ipam.miloapis.com/v1alpha1
            kind: IPAddressClaim
            name: addr-claim-2
            namespace: ($namespace)
            timeout: 30s
            for:
              jsonPath:
                path: '{.status.phase}'
                value: 'Bound'
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              ip1=$(kubectl get ipaddressclaim -n "$NAMESPACE" addr-claim-1 -o jsonpath='{.status.allocatedIP}')
              ip2=$(kubectl get ipaddressclaim -n "$NAMESPACE" addr-claim-2 -o jsonpath='{.status.allocatedIP}')
              if [ -z "$ip2" ]; then
                echo "FAIL: empty allocatedIP for addr-claim-2"; exit 1
              fi
              if ! echo "$ip2" | grep -qE '^10\.50\.0\.[0-7]$'; then
                echo "FAIL: $ip2 not in 10.50.0.0/29"; exit 1
              fi
              if [ "$ip1" = "$ip2" ]; then
                echo "FAIL: addr-claim-2 reused $ip1"; exit 1
              fi
              echo "OK addr-claim-1=$ip1 addr-claim-2=$ip2 distinct"
            check:
              ($error == null): true
              (contains($stdout, 'OK addr-claim-1=')): true

    - name: fill-and-overflow-rejected-507
      description: |
        Apply six more claims to fill the /29; the ninth overflow claim must
        fail HTTP 507 (Insufficient Storage).
      try:
        - create:
            file: test-data/claims-fill.yaml
        - wait:
            apiVersion: ipam.miloapis.com/v1alpha1
            kind: IPAddressClaim
            namespace: ($namespace)
            selector: addr-test=true
            timeout: 60s
            for:
              jsonPath:
                path: '{.status.phase}'
                value: 'Bound'
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              count=$(kubectl get ipaddressclaim -n "$NAMESPACE" -l addr-test=true \
                -o jsonpath='{.items[*].status.allocatedIP}' | tr ' ' '\n' | awk 'NF>0' | sort -u | awk 'END{print NR}')
              if [ "$count" != "8" ]; then
                echo "FAIL: expected 8 unique IPs, got $count"
                kubectl get ipaddressclaim -n "$NAMESPACE" -l addr-test=true \
                  -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.allocatedIP}{"\n"}{end}'
                exit 1
              fi
              echo "OK 8 unique IPs allocated across the /29"
            check:
              ($error == null): true
              (contains($stdout, 'OK 8 unique IPs')): true
        - create:
            file: test-data/claim-overflow.yaml
            expect:
              - check:
                  ($error != null): true
                  (contains($error, '507') || contains($error, 'Insufficient Storage') || contains($error, 'pool exhausted')): true

    - name: release-and-reallocate
      description: |
        Delete addr-claim-1 and confirm a fresh claim binds (released IP is
        reusable). The new claim must take the same IP that addr-claim-1 held,
        since that's the only free slot in the /29.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              freed=$(kubectl get ipaddressclaim -n "$NAMESPACE" addr-claim-1 -o jsonpath='{.status.allocatedIP}')
              if [ -z "$freed" ]; then
                echo "FAIL: addr-claim-1 has no allocatedIP to record"; exit 1
              fi
              echo "$freed" > /tmp/addr-freed-ip
              echo "recorded freed IP: $freed"
            check:
              ($error == null): true
        - delete:
            ref:
              apiVersion: ipam.miloapis.com/v1alpha1
              kind: IPAddressClaim
              name: addr-claim-1
              namespace: ($namespace)
        - error:
            file: assertions/assert-claim-1-deleted.yaml
        - create:
            file: test-data/claim-reuse.yaml
        - wait:
            apiVersion: ipam.miloapis.com/v1alpha1
            kind: IPAddressClaim
            name: addr-claim-reuse
            namespace: ($namespace)
            timeout: 30s
            for:
              jsonPath:
                path: '{.status.phase}'
                value: 'Bound'
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              new_ip=$(kubectl get ipaddressclaim -n "$NAMESPACE" addr-claim-reuse -o jsonpath='{.status.allocatedIP}')
              freed=$(cat /tmp/addr-freed-ip)
              if [ -z "$new_ip" ]; then
                echo "FAIL: empty allocatedIP for addr-claim-reuse"; exit 1
              fi
              if [ "$new_ip" != "$freed" ]; then
                echo "FAIL: reuse claim got $new_ip but expected freed slot $freed"
                exit 1
              fi
              echo "OK released IP $freed reused by addr-claim-reuse"
            check:
              ($error == null): true
              (contains($stdout, 'OK released IP')): true

      finally:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              kubectl delete ipaddressclaim -n "$NAMESPACE" \
                addr-claim-1 addr-claim-2 addr-claim-3 addr-claim-4 \
                addr-claim-5 addr-claim-6 addr-claim-7 addr-claim-8 \
                addr-claim-overflow addr-claim-reuse --ignore-not-found >/dev/null 2>&1 || true
              kubectl delete ipprefix addr-pool --ignore-not-found >/dev/null 2>&1 || true
              kubectl delete ipprefixclass addr-class --ignore-not-found >/dev/null 2>&1 || true
              echo "address-allocation cleanup done"
            check:
              ($error == null): true
