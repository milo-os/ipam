# Lets the consumer projects reference the platform class this suite shares
# between them. See nso-network-addressing/test-data/rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ari-platform-class-user
rules:
  - apiGroups: ["ipam.miloapis.com"]
    resources: ["ipclasses"]
    resourceNames:
      - ari-blocks
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ari-platform-class-user-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ari-platform-class-user
subjects:
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: e2e-tenant-tester
