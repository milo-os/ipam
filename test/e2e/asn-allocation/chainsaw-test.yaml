apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: asn-allocation
spec:
  description: |
    ASNClaim allocation and uniqueness:
    - Synchronous ASN in status
    - 10 simultaneous claims fill a 10-ASN pool
    - 11th claim returns HTTP 507
    - Released ASN is reusable

  steps:
    - name: setup-asn-pool
      description: ASNPoolClass + ASNPool with 10 ASNs (4200000000-4200000009)
      try:
        - create:
            file: test-data/class.yaml
        - create:
            file: test-data/pool.yaml
        - wait:
            apiVersion: ipam.miloapis.com/v1alpha1
            kind: ASNPool
            name: asn-pool
            timeout: 30s
            for:
              jsonPath:
                path: '{.status.capacity.total}'
                value: '10'

    - name: first-claim-bound
      description: ASNClaim succeeds with status.asn in [4200000000, 4200000009]
      try:
        - create:
            file: test-data/claim-1.yaml
        - wait:
            apiVersion: ipam.miloapis.com/v1alpha1
            kind: ASNClaim
            name: asn-claim-1
            namespace: ($namespace)
            timeout: 30s
            for:
              jsonPath:
                path: '{.status.phase}'
                value: 'Bound'
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              asn=$(kubectl get asnclaim -n "$NAMESPACE" asn-claim-1 -o jsonpath='{.status.asn}')
              if [ "$asn" -ge 4200000000 ] && [ "$asn" -le 4200000009 ]; then
                echo "OK"
              else
                echo "FAIL: asn=$asn outside expected range"; exit 1
              fi
            check:
              ($stdout): "OK\n"

    - name: claim-9-more-simultaneously
      description: 9 more ASNClaims fill the pool; all 10 status.asn must be unique
      try:
        - create:
            file: test-data/claims-9-more.yaml
        - wait:
            apiVersion: ipam.miloapis.com/v1alpha1
            kind: ASNClaim
            namespace: ($namespace)
            selector: asn-test=true
            timeout: 60s
            for:
              jsonPath:
                path: '{.status.phase}'
                value: 'Bound'
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              kubectl get asnclaim -n "$NAMESPACE" -l asn-test=true \
                -o jsonpath='{.items[*].status.asn}' | tr ' ' '\n' | sort -u | awk 'END{print NR}'
            check:
              ($stdout): "10\n"

    - name: eleventh-claim-rejected-507
      description: 11th ASNClaim must fail HTTP 507
      try:
        - create:
            file: test-data/claim-11.yaml
            expect:
              - check:
                  ($error != null): true
                  (contains($error, '507') || contains($error, 'Insufficient Storage') || contains($error, 'pool exhausted')): true

    - name: release-and-reuse
      description: Delete one ASNClaim; create a new one — Bound (released ASN reused)
      try:
        - delete:
            ref:
              apiVersion: ipam.miloapis.com/v1alpha1
              kind: ASNClaim
              name: asn-claim-1
              namespace: ($namespace)
        - error:
            file: assertions/assert-claim-1-deleted.yaml
        - create:
            file: test-data/claim-reuse.yaml
        - wait:
            apiVersion: ipam.miloapis.com/v1alpha1
            kind: ASNClaim
            name: asn-claim-reuse
            namespace: ($namespace)
            timeout: 30s
            for:
              jsonPath:
                path: '{.status.phase}'
                value: 'Bound'

      finally:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              kubectl delete asnclaim -n "$NAMESPACE" \
                asn-claim-1 asn-claim-2 asn-claim-3 asn-claim-4 asn-claim-5 \
                asn-claim-6 asn-claim-7 asn-claim-8 asn-claim-9 asn-claim-10 \
                asn-claim-11 asn-claim-reuse --ignore-not-found >/dev/null 2>&1 || true
              kubectl delete asnpool asn-pool --ignore-not-found >/dev/null 2>&1 || true
              kubectl delete asnpoolclass asn-private --ignore-not-found >/dev/null 2>&1 || true
              echo "asn-allocation cleanup done"
            check:
              ($error == null): true
