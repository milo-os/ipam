apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: asn-selector
spec:
  description: |
    Class-based ASN pool resolution (spec.classRef on ASNClaim):
    - Three ASNPools share a single ASNPoolClass with disjoint ranges:
      private 16-bit (64512-64520), public 16-bit (65000-65010), and
      private 32-bit (4200000000-4200000010).
    - A class-resolved ASNClaim binds with status.asn inside one of the three
      configured ranges.
    - Six concurrent class-resolved claims allocate unique ASNs.
    - A claim referencing a non-existent class returns HTTP 400 with
      "no ASNPool of class".

    Note: ASNClaim status uses spec.asn (`status.asn`), not the informal
    `allocatedASN` referenced in some docs. Step assertions use the API field.

  steps:
    - name: setup
      description: ASNPoolClass + 3 ASNPools (disjoint ranges) sharing the class.
      try:
        - create:
            file: test-data/class.yaml
        - create:
            file: test-data/pools.yaml
        - wait:
            apiVersion: ipam.miloapis.com/v1alpha1
            kind: ASNPool
            name: asn-selector-pool-private16
            timeout: 30s
            for:
              jsonPath:
                path: '{.status.capacity.total}'
                value: '9'
        - wait:
            apiVersion: ipam.miloapis.com/v1alpha1
            kind: ASNPool
            name: asn-selector-pool-public
            timeout: 30s
            for:
              jsonPath:
                path: '{.status.capacity.total}'
                value: '11'
        - wait:
            apiVersion: ipam.miloapis.com/v1alpha1
            kind: ASNPool
            name: asn-selector-pool-private32
            timeout: 30s
            for:
              jsonPath:
                path: '{.status.capacity.total}'
                value: '11'

    - name: claim-by-class-bound
      description: |
        ASNClaim with spec.classRef binds and status.asn falls inside one of
        the three configured ranges.
      try:
        - create:
            file: test-data/claim-by-class.yaml
        - wait:
            apiVersion: ipam.miloapis.com/v1alpha1
            kind: ASNClaim
            name: asn-sel-claim-1
            namespace: ($namespace)
            timeout: 30s
            for:
              jsonPath:
                path: '{.status.phase}'
                value: 'Bound'
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              asn=$(kubectl get asnclaim -n "$NAMESPACE" asn-sel-claim-1 -o jsonpath='{.status.asn}')
              if [ -z "$asn" ] || [ "$asn" = "0" ]; then
                echo "FAIL: empty/zero ASN"; exit 1
              fi
              # Disjoint ranges: 64512-64520 OR 65000-65010 OR 4200000000-4200000010.
              in_range=0
              if [ "$asn" -ge 64512 ] && [ "$asn" -le 64520 ]; then in_range=1; fi
              if [ "$asn" -ge 65000 ] && [ "$asn" -le 65010 ]; then in_range=1; fi
              if [ "$asn" -ge 4200000000 ] && [ "$asn" -le 4200000010 ]; then in_range=1; fi
              if [ "$in_range" != "1" ]; then
                echo "FAIL: asn=$asn outside all configured pool ranges"; exit 1
              fi
              # boundPoolRef must reference one of our pools.
              pool=$(kubectl get asnclaim -n "$NAMESPACE" asn-sel-claim-1 -o jsonpath='{.status.boundPoolRef.name}')
              case "$pool" in
                asn-selector-pool-private16|asn-selector-pool-public|asn-selector-pool-private32)
                  ;;
                *)
                  echo "FAIL: boundPoolRef=$pool not one of our 3 pools"; exit 1
                  ;;
              esac
              echo "OK class-resolved asn=$asn pool=$pool"
            check:
              ($error == null): true
              (contains($stdout, 'OK class-resolved asn=')): true

    - name: many-claims-unique
      description: |
        Five additional class-resolved ASNClaims; together with claim-1 the six
        allocations must be unique.
      try:
        - create:
            file: test-data/claims-by-class-more.yaml
        - wait:
            apiVersion: ipam.miloapis.com/v1alpha1
            kind: ASNClaim
            namespace: ($namespace)
            selector: asn-sel-test=true
            timeout: 60s
            for:
              jsonPath:
                path: '{.status.phase}'
                value: 'Bound'
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              total=$(kubectl get asnclaim -n "$NAMESPACE" -l asn-sel-test=true \
                -o jsonpath='{.items[*].status.asn}' | tr ' ' '\n' | awk 'NF>0' | awk 'END{print NR}')
              unique=$(kubectl get asnclaim -n "$NAMESPACE" -l asn-sel-test=true \
                -o jsonpath='{.items[*].status.asn}' | tr ' ' '\n' | awk 'NF>0' | sort -u | awk 'END{print NR}')
              if [ "$total" != "6" ]; then
                echo "FAIL: expected 6 claims, found $total"
                kubectl get asnclaim -n "$NAMESPACE" -l asn-sel-test=true \
                  -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.asn}{"\n"}{end}'
                exit 1
              fi
              if [ "$unique" != "6" ]; then
                echo "FAIL: expected 6 unique ASNs, got $unique"
                kubectl get asnclaim -n "$NAMESPACE" -l asn-sel-test=true \
                  -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.asn}{"\n"}{end}'
                exit 1
              fi
              echo "OK 6 class-resolved ASNClaims, all status.asn values unique"
            check:
              ($error == null): true
              (contains($stdout, 'OK 6 class-resolved')): true

    - name: claim-unknown-class-rejected-400
      description: |
        ASNClaim with spec.classRef pointing at a non-existent class returns
        HTTP 400. The server message is "no ASNPool of class \"<name>\"".
      try:
        - create:
            file: test-data/claim-no-class.yaml
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'no ASNPool of class') || contains($error, '400')): true

      finally:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              kubectl delete asnclaim -n "$NAMESPACE" \
                asn-sel-claim-1 asn-sel-claim-2 asn-sel-claim-3 \
                asn-sel-claim-4 asn-sel-claim-5 asn-sel-claim-6 \
                asn-sel-claim-no-class --ignore-not-found >/dev/null 2>&1 || true
              kubectl delete asnpool \
                asn-selector-pool-private16 asn-selector-pool-public \
                asn-selector-pool-private32 --ignore-not-found >/dev/null 2>&1 || true
              kubectl delete asnpoolclass asn-selector-class --ignore-not-found >/dev/null 2>&1 || true
              echo "asn-selector cleanup done"
            check:
              ($error == null): true
