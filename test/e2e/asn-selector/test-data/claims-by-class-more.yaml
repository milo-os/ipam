# Five additional class-resolved ASNClaims. Combined with claim-1 these prove
# uniqueness of allocations across the class-resolved pool set.
apiVersion: ipam.miloapis.com/v1alpha1
kind: ASNClaim
metadata:
  name: asn-sel-claim-2
  namespace: ($namespace)
  labels:
    asn-sel-test: "true"
spec:
  classRef:
    name: asn-selector-class
---
apiVersion: ipam.miloapis.com/v1alpha1
kind: ASNClaim
metadata:
  name: asn-sel-claim-3
  namespace: ($namespace)
