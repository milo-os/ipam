# The same address in the SAME network as the dns-a claim: refused.
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPClaim
metadata:
  name: csa-dns-dup
  labels:
    suite: claim-specific-address
spec:
  className: csa-host-v6
  ipFamily: IPv6
  prefixLength: 128
  address: "fd83:183::53"
  reclaimPolicy: Delete
  scope:
    network:
      apiGroup: networking.datumapis.com
      kind: Network
      name: csa-net-a
