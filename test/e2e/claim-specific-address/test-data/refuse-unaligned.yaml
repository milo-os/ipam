# .133 is not on a /28 boundary. Rounded down it would be 172.18.30.128/28,
# which is free, so a server that rounds instead of refusing binds it.
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPClaim
metadata:
  name: csa-unaligned
  labels:
    suite: claim-specific-address
spec:
  className: csa-block-v4
  prefixLength: 28
  address: 172.18.30.133
