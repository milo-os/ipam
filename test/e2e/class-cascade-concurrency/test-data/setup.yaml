apiVersion: ipam.miloapis.com/v1alpha1
kind: IPClass
metadata:
  name: cc-network
spec:
  ipFamily: IPv6
  poolPer:
    - network
  uniqueWithin: []
  allowedPrefixLengths:
    min: 48
    max: 48
  defaultPrefixLength: 48
  strategy: FirstFit
  reclaimPolicy: Retain
---
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPClass
metadata:
  name: cc-subnet
spec:
  ipFamily: IPv6
  parentClassName: cc-network
  poolPer:
    - network
    - location
  uniqueWithin: []
  allowedPrefixLengths:
    min: 64
    max: 64
  defaultPrefixLength: 64
  strategy: FirstFit
  reclaimPolicy: Retain
---
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPClass
metadata:
  name: cc-endpoint
spec:
  ipFamily: IPv6
  parentClassName: cc-subnet
  uniqueWithin:
    - network
  allowedPrefixLengths:
    min: 96
    max: 96
  defaultPrefixLength: 96
  strategy: FirstFit
  reclaimPolicy: Delete
---
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPool
metadata:
  name: cc-root
spec:
  cidr: fd32::/20
  ipFamily: IPv6
  visibility: platform
  classNames:
    - cc-network
  allocation:
    minPrefixLength: 48
    maxPrefixLength: 48
    strategy: FirstFit
