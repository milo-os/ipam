apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: class-lease
spec:
  description: |
    A claim deleted under reclaimPolicy Retain leaves an IPAllocation that says
    when it was retained and, if a lease applies, when that lease runs out
    (milo-os/ipam#107). The deadline is fixed at the delete, in the same
    transaction, so it is readable the moment the delete returns.

      a. a leased class in a capped pool: status.retainedAt, status.expiresAt
         the pool's 1h cap later (the shorter of the class's 2h and the cap,
         to the second), and Retained=True/LeaseActive
      b. no lease anywhere: status.retainedAt, no status.expiresAt, and
         Retained=True/NoLease
      c. recreating the claim reclaims the address: both timestamps go, and
         Retained=False/Reclaimed
      d. a 30s class lease: the allocation is held until its deadline, then
         the sweeper releases it, the IPAllocation is gone, and the next
         claim from that pool is given the same address
      e. the allocation from b, with no lease, is still held after the
         sweeper has released d: no lease means no release

    d needs the sweeper in enforce mode, the default, at a short interval.
    The dev and test-infra overlays sweep every 2s; against a deployment
    sweeping once a minute, d's wait for the release has to be raised.

  # Every claim resolves its class, and resolving a class needs a project, so
  # the suite drives the apiserver as a project tenant. `task e2e` generates the
  # kubeconfig and its RBAC first; chainsaw resolves this path at load time.
  cluster: tenant
  clusters:
    tenant:
      kubeconfig: ../.tenant-impersonation.kubeconfig
      context: tenant-project-alpha

  steps:
    - name: setup
      description: |
        Classes and pools are applied by script rather than by a chainsaw
        create, so chainsaw's own teardown does not try to delete a pool while
        the retained allocations inside it still hold addresses. The cleanup
        below runs when the test ends, whichever step it ended on.
      try:
        - script:
            timeout: 60s
            content: |
              . ../lib/ipam.sh
              kubectl apply -f test-data/setup.yaml >/dev/null
              wait_pool_ready cl-capped
              wait_pool_ready cl-open
              wait_pool_ready cl-short
              for p in cl-capped cl-open cl-short; do
                used=$(kubectl get ippool "$p" -o jsonpath='{.status.capacity.allocated}')
                if [ -n "$used" ] && [ "$used" != "0" ]; then
                  echo "FAIL: $p already holds $used address(es); clean up the earlier run first"
                  exit 1
                fi
              done
              echo "OK: pools Ready and empty"
            check:
              ($error == null): true
              "(contains($stdout, 'OK: pools Ready and empty'))": true
      cleanup:
        - script:
            # Explicit, like every script here: CI runs chainsaw without
            # test/e2e/chainsaw-config.yaml, so the default exec timeout is
            # 5s, and releasing retained allocations takes longer.
            timeout: 180s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              . ../lib/ipam.sh
              set +e
              # Claims first and synchronously: an allocation still bound to a
              # live claim is refused, by design.
              kubectl delete ipclaim -n "$NAMESPACE" -l suite=class-lease \
                --ignore-not-found --wait=true --timeout=60s >/dev/null 2>&1
              # Retained allocations survive their claims by design, so they
              # are released explicitly, and only then can their pools go.
              release_pool_allocations "$NAMESPACE" cl-capped
              release_pool_allocations "$NAMESPACE" cl-open
              release_pool_allocations "$NAMESPACE" cl-short
              kubectl delete ippool cl-capped cl-open cl-short --ignore-not-found >/dev/null 2>&1
              kubectl delete ipclass cl-leased cl-unleased cl-brief --ignore-not-found >/dev/null 2>&1

              # A leftover here is a leak into the project every suite shares,
              # so it fails the suite rather than passing quietly.
              left=$(kubectl get ipallocation -n "$NAMESPACE" -o json 2>/dev/null | jq -r \
                '.items[] | select(.spec.poolRef.name == "cl-capped" or .spec.poolRef.name == "cl-open" or .spec.poolRef.name == "cl-short") | .metadata.name')
              pools=$(kubectl get ippool cl-capped cl-open cl-short --ignore-not-found -o name 2>/dev/null)
              classes=$(kubectl get ipclass cl-leased cl-unleased cl-brief --ignore-not-found -o name 2>/dev/null)
              if [ -n "$left$pools$classes" ]; then
                echo "FAIL: class-lease cleanup left behind:" $left $pools $classes
                exit 1
              fi
              echo "class-lease cleanup done"
            check:
              ($error == null): true
              "(contains($stdout, 'class-lease cleanup done'))": true

    - name: a-leased-retention-shows-its-deadline
      description: |
        Delete a claim of the leased class and read its IPAllocation straight
        back: the deadline is the retention plus the pool's cap, which is
        shorter than the class's lease.
      try:
        - script:
            timeout: 120s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              . ../lib/ipam.sh
              kubectl create -n "$NAMESPACE" -f - >/dev/null <<EOF
              apiVersion: ipam.miloapis.com/v1alpha1
              kind: IPClaim
              metadata:
                name: cl-web
                namespace: $NAMESPACE
                labels:
                  suite: class-lease
              spec:
                className: cl-leased
              EOF
              wait_claim_bound "$NAMESPACE" cl-web 60
              alloc=$(kubectl get ipclaim -n "$NAMESPACE" cl-web -o jsonpath='{.status.boundAllocationRef.name}')
              json=$(kubectl get ipallocation -n "$NAMESPACE" "$alloc" -o json)
              if [ "$(printf '%s' "$json" | jq -r '[.status.retainedAt, .status.expiresAt] | map(select(. != null)) | length')" != "0" ]; then
                echo "FAIL: bound IPAllocation $alloc already reports a retention: $(printf '%s' "$json" | jq -c .status)"
                exit 1
              fi

              kubectl delete ipclaim -n "$NAMESPACE" cl-web --wait=true >/dev/null
              wait_gone ipclaim "$NAMESPACE" cl-web 60
              json=$(kubectl get ipallocation -n "$NAMESPACE" "$alloc" -o json)
              retained=$(printf '%s' "$json" | jq -r '.status.retainedAt // ""')
              expires=$(printf '%s' "$json" | jq -r '.status.expiresAt // ""')
              if [ -z "$retained" ] || [ -z "$expires" ]; then
                echo "FAIL: retained IPAllocation $alloc has retainedAt='$retained' expiresAt='$expires'; want both"
                exit 1
              fi
              lease=$(printf '%s' "$json" | jq -r '(.status.expiresAt | fromdateiso8601) - (.status.retainedAt | fromdateiso8601)')
              # retainedAt is shown truncated to the second and the deadline is
              # stored rounded up to it, so the gap is the lease or a second more.
              if [ "$lease" != "3600" ] && [ "$lease" != "3601" ]; then
                echo "FAIL: expiresAt - retainedAt = ${lease}s, want 3600 or 3601 (the pool's 1h cap under the class's 2h)"
                exit 1
              fi
              cond=$(printf '%s' "$json" | jq -r '.status.conditions[]? | select(.type == "Retained") | "\(.status)/\(.reason)"')
              if [ "$cond" != "True/LeaseActive" ]; then
                echo "FAIL: Retained condition is '$cond', want True/LeaseActive"
                exit 1
              fi
              echo "OK: $alloc retained at $retained, lease runs out at $expires"
            check:
              ($error == null): true
              "(contains($stdout, 'OK: '))": true

    - name: an-unleased-retention-shows-none
      description: |
        With no lease on the class or the pool, the allocation is retained
        with no deadline, and says why.
      try:
        - script:
            timeout: 120s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              . ../lib/ipam.sh
              kubectl create -n "$NAMESPACE" -f - >/dev/null <<EOF
              apiVersion: ipam.miloapis.com/v1alpha1
              kind: IPClaim
              metadata:
                name: cl-plain
                namespace: $NAMESPACE
                labels:
                  suite: class-lease
              spec:
                className: cl-unleased
              EOF
              wait_claim_bound "$NAMESPACE" cl-plain 60
              alloc=$(kubectl get ipclaim -n "$NAMESPACE" cl-plain -o jsonpath='{.status.boundAllocationRef.name}')
              kubectl delete ipclaim -n "$NAMESPACE" cl-plain --wait=true >/dev/null
              wait_gone ipclaim "$NAMESPACE" cl-plain 60

              json=$(kubectl get ipallocation -n "$NAMESPACE" "$alloc" -o json)
              if [ -z "$(printf '%s' "$json" | jq -r '.status.retainedAt // ""')" ]; then
                echo "FAIL: retained IPAllocation $alloc has no retainedAt"
                exit 1
              fi
              if [ -n "$(printf '%s' "$json" | jq -r '.status.expiresAt // ""')" ]; then
                echo "FAIL: IPAllocation $alloc shows a deadline with no lease set: $(printf '%s' "$json" | jq -r .status.expiresAt)"
                exit 1
              fi
              cond=$(printf '%s' "$json" | jq -r '.status.conditions[]? | select(.type == "Retained") | "\(.status)/\(.reason)"')
              if [ "$cond" != "True/NoLease" ]; then
                echo "FAIL: Retained condition is '$cond', want True/NoLease"
                exit 1
              fi
              echo "OK: $alloc retained with no lease"
            check:
              ($error == null): true
              "(contains($stdout, 'OK: '))": true

    - name: a-reclaim-ends-the-retention
      description: |
        The same name recreated takes the address back; the allocation drops
        its retention timestamps and records the reclaim.
      try:
        - script:
            timeout: 120s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              . ../lib/ipam.sh
              kubectl create -n "$NAMESPACE" -f - >/dev/null <<EOF
              apiVersion: ipam.miloapis.com/v1alpha1
              kind: IPClaim
              metadata:
                name: cl-web
                namespace: $NAMESPACE
                labels:
                  suite: class-lease
              spec:
                className: cl-leased
              EOF
              wait_claim_bound "$NAMESPACE" cl-web 60
              alloc=$(kubectl get ipclaim -n "$NAMESPACE" cl-web -o jsonpath='{.status.boundAllocationRef.name}')
              json=$(kubectl get ipallocation -n "$NAMESPACE" "$alloc" -o json)
              if [ "$(printf '%s' "$json" | jq -r '.spec.claimRef.name // ""')" != "cl-web" ]; then
                echo "FAIL: IPAllocation $alloc does not name the recreated claim"
                exit 1
              fi
              left=$(printf '%s' "$json" | jq -r '[.status.retainedAt, .status.expiresAt] | map(select(. != null)) | length')
              if [ "$left" != "0" ]; then
                echo "FAIL: reclaimed IPAllocation $alloc still reports a retention: $(printf '%s' "$json" | jq -c .status)"
                exit 1
              fi
              cond=$(printf '%s' "$json" | jq -r '.status.conditions[]? | select(.type == "Retained") | "\(.status)/\(.reason)"')
              if [ "$cond" != "False/Reclaimed" ]; then
                echo "FAIL: Retained condition is '$cond', want False/Reclaimed"
                exit 1
              fi
              echo "OK: cl-web reclaimed $alloc"
            check:
              ($error == null): true
              "(contains($stdout, 'OK: cl-web reclaimed'))": true

    - name: an-expired-lease-is-released
      description: |
        A claim of the 30s class is deleted. Its IPAllocation is checked about
        once a second and must be held for the lease, less a margin; after it,
        a sweeper pass deletes it and the address goes back to the pool. A
        claim of another name, so that a reclaim cannot be what returns it, is
        then given the same address: the first free one in an otherwise empty
        pool.

        Only the server's clock says how long the lease is (expiresAt minus
        retainedAt), and only the runner's elapsed time says how long the loop
        has waited, so clock skew between the two cannot fail the step. The
        runner's timer starts before the delete, so it runs ahead of the
        server's, and the loop stops early rather than late. A kubectl error
        other than NotFound, such as a 503 from the aggregated API, is neither
        held nor released and is retried.
      try:
        - script:
            # Worst case: bind 60s, delete 60s, the 30s hold, the 60s release
            # window, and the second bind 60s.
            timeout: 300s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              . ../lib/ipam.sh
              # alloc_state <name>: present, gone (NotFound) or error.
              alloc_state() {
                if err=$(kubectl get ipallocation -n "$NAMESPACE" "$1" -o name 2>&1 >/dev/null); then
                  echo present
                elif printf '%s' "$err" | grep -q '(NotFound)'; then
                  echo gone
                else
                  echo "kubectl get ipallocation $1: $err" >&2
                  echo error
                fi
              }

              kubectl create -n "$NAMESPACE" -f - >/dev/null <<EOF
              apiVersion: ipam.miloapis.com/v1alpha1
              kind: IPClaim
              metadata:
                name: cl-brief-a
                namespace: $NAMESPACE
                labels:
                  suite: class-lease
              spec:
                className: cl-brief
              EOF
              wait_claim_bound "$NAMESPACE" cl-brief-a 60
              addr=$(claim_cidr "$NAMESPACE" cl-brief-a)
              alloc=$(kubectl get ipclaim -n "$NAMESPACE" cl-brief-a -o jsonpath='{.status.boundAllocationRef.name}')
              if [ -z "$addr" ] || [ -z "$alloc" ]; then
                echo "FAIL: cl-brief-a is Bound but reports address='$addr' allocation='$alloc'"
                exit 1
              fi

              # Started before the delete, so at every point it has counted at
              # least as long as the server has since the retention.
              start=$(date +%s)
              kubectl delete ipclaim -n "$NAMESPACE" cl-brief-a --wait=true >/dev/null
              wait_gone ipclaim "$NAMESPACE" cl-brief-a 60
              if ! json=$(kubectl get ipallocation -n "$NAMESPACE" "$alloc" -o json 2>&1); then
                echo "FAIL: could not read IPAllocation $alloc straight after its claim was deleted: $json"
                exit 1
              fi
              expires=$(printf '%s' "$json" | jq -r '.status.expiresAt // ""')
              if [ -z "$expires" ]; then
                echo "FAIL: retained IPAllocation $alloc has no expiresAt under a 30s lease: $(printf '%s' "$json" | jq -c .status)"
                exit 1
              fi
              # Both timestamps are the server's. The deadline is rounded up
              # to the second and retainedAt shown truncated, so this is the
              # lease or a second more.
              lease=$(printf '%s' "$json" | jq -r '(.status.expiresAt | fromdateiso8601) - (.status.retainedAt | fromdateiso8601)')
              if [ "$lease" != "30" ] && [ "$lease" != "31" ]; then
                echo "FAIL: expiresAt - retainedAt = ${lease}s, want 30 or 31 (cl-brief's lease)"
                exit 1
              fi

              # Held for the lease, less a 5s margin for the sweeper pass
              # and the runner's timer starting slightly before the retention.
              held=0
              while [ $(( $(date +%s) - start )) -lt $((lease - 5)) ]; do
                case "$(alloc_state "$alloc")" in
                  present) held=$((held + 1)) ;;
                  gone)
                    echo "FAIL: IPAllocation $alloc was released $(( $(date +%s) - start ))s after its claim was deleted, under a ${lease}s lease (deadline $expires)"
                    exit 1
                    ;;
                esac
                sleep 1
              done
              if [ "$held" -lt 5 ]; then
                echo "FAIL: only $held successful check(s) of $alloc within its ${lease}s lease; too few to say it was held"
                exit 1
              fi

              # Released after it: a sweep interval (2s in the dev and
              # test-infra overlays) after the deadline, plus slack.
              released=""
              for _ in $(seq 1 60); do
                if [ "$(alloc_state "$alloc")" = gone ]; then
                  released=yes
                  break
                fi
                sleep 1
              done
              if [ -z "$released" ]; then
                echo "FAIL: IPAllocation $alloc not released within 60s of the hold ending (deadline $expires); is the sweeper in enforce mode at a short interval?"
                kubectl get ipallocation -n "$NAMESPACE" "$alloc" -o json 2>&1 | jq -c .status | sed 's/^/    /'
                exit 1
              fi
              used=$(kubectl get ippool cl-short -o jsonpath='{.status.capacity.allocated}')
              if [ -n "$used" ] && [ "$used" != "0" ]; then
                echo "FAIL: cl-short still counts $used allocated address(es) after $alloc was released"
                exit 1
              fi

              kubectl create -n "$NAMESPACE" -f - >/dev/null <<EOF
              apiVersion: ipam.miloapis.com/v1alpha1
              kind: IPClaim
              metadata:
                name: cl-brief-b
                namespace: $NAMESPACE
                labels:
                  suite: class-lease
              spec:
                className: cl-brief
              EOF
              wait_claim_bound "$NAMESPACE" cl-brief-b 60
              again=$(claim_cidr "$NAMESPACE" cl-brief-b)
              if [ "$again" != "$addr" ]; then
                echo "FAIL: cl-brief-b was given $again, want $addr, the address released from $alloc"
                exit 1
              fi
              echo "OK: $alloc held through $held checks of its ${lease}s lease, then released, and $addr handed to cl-brief-b"
            check:
              ($error == null): true
              "(contains($stdout, 'OK: '))": true

    - name: an-unleased-retention-is-not-released
      description: |
        The allocation cl-plain retained with no lease has been through every
        sweep pass since, including the one that released the leased
        allocation above. It is still held, and still says why.
      try:
        - script:
            timeout: 60s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              . ../lib/ipam.sh
              json=$(kubectl get ipallocation -n "$NAMESPACE" -o json | jq -c \
                '[.items[] | select(.spec.poolRef.name == "cl-open")]')
              if [ "$(printf '%s' "$json" | jq 'length')" != "1" ]; then
                echo "FAIL: cl-open holds $(printf '%s' "$json" | jq 'length') allocation(s), want the one cl-plain retained"
                exit 1
              fi
              alloc=$(printf '%s' "$json" | jq -r '.[0].metadata.name')
              if [ -n "$(printf '%s' "$json" | jq -r '.[0].spec.claimRef.name // ""')" ]; then
                echo "FAIL: IPAllocation $alloc is bound again; want it retained"
                exit 1
              fi
              cond=$(printf '%s' "$json" | jq -r '.[0].status.conditions[]? | select(.type == "Retained") | "\(.status)/\(.reason)"')
              if [ "$cond" != "True/NoLease" ]; then
                echo "FAIL: Retained condition on $alloc is '$cond', want True/NoLease"
                exit 1
              fi
              age=$(( $(date -u +%s) - $(printf '%s' "$json" | jq -r '.[0].status.retainedAt | fromdateiso8601') ))
              echo "OK: $alloc still retained with no lease, ${age}s after its claim was deleted"
            check:
              ($error == null): true
              "(contains($stdout, 'OK: '))": true
