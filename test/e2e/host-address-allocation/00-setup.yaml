apiVersion: ipam.miloapis.com/v1alpha1
kind: IPClass
metadata:
  name: host-class-v4
spec:
  ipFamily: IPv4
  allowedPrefixLengths:
    min: 32
    max: 32
---
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPClass
metadata:
  name: host-class-v6
spec:
  ipFamily: IPv6
  allowedPrefixLengths:
    min: 128
    max: 128
---
# IPv4 /29 parent pool: 10.50.1.0 – 10.50.1.7 (8 host addresses).
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPool
metadata:
  name: host-pool-v4
spec:
  cidr: 10.50.1.0/29
  ipFamily: IPv4
  classNames:
    - host-class-v4
  visibility: consumer
  allocation:
    minPrefixLength: 32
    maxPrefixLength: 32
    strategy: FirstFit
---
# IPv6 /126 parent pool: 2001:db8::/126 (4 host addresses).
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPool
metadata:
  name: host-pool-v6
spec:
  cidr: 2001:db8::/126
  ipFamily: IPv6
  classNames:
    - host-class-v6
  visibility: consumer
  allocation:
    minPrefixLength: 128
    maxPrefixLength: 128
    strategy: FirstFit
