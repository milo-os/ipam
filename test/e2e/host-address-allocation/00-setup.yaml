# IPv4 /32-only class for host-route allocation.
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPrefixClass
metadata:
  name: host-class-v4
spec:
  requiresVerification: false
  visibility: consumer
  defaultAllocation:
    minPrefixLength: 32
    maxPrefixLength: 32
    strategy: FirstFit
---
# IPv4 /29 parent pool: 10.50.1.0 – 10.50.1.7 (8 host addresses).
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPrefix
metadata:
  name: host-pool-v4
spec:
  cidr: 10.50.1.0/29
  ipFamily: IPv4
  classRef:
    name: host-class-v4
  allocation:
    minPrefixLength: 32
    maxPrefixLength: 32
    strategy: FirstFit
---
# IPv6 /128-only class for host-route allocation.
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPrefixClass
metadata:
  name: host-class-v6
spec:
  requiresVerification: false
  visibility: consumer
  defaultAllocation:
    minPrefixLength: 128
    maxPrefixLength: 128
    strategy: FirstFit
---
# IPv6 /126 parent pool: 2001:db8::/126 (4 host addresses).
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPrefix
metadata:
  name: host-pool-v6
spec:
  cidr: 2001:db8::/126
  ipFamily: IPv6
  classRef:
    name: host-class-v6
  allocation:
    minPrefixLength: 128
    maxPrefixLength: 128
    strategy: FirstFit
