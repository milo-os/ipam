# Claims host-claim-v4-3 through host-claim-v4-8.
# Combined with host-claim-v4-1 and host-claim-v4-2 these saturate the /29
# (8 addresses), leaving the pool fully allocated for the overflow check.
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPClaim
metadata:
  name: host-claim-v4-3
  namespace: ($namespace)
  labels:
    host-test: "true"
spec:
  ipFamily: IPv4
  prefixLength: 32
  poolRef:
    name: host-pool-v4
  reclaimPolicy: Delete
---
