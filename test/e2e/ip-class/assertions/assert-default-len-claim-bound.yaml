---
# prefixLength was omitted; the class default (/26) applies. Still drawn from
# the e2e-public-egress backing pool (10.140.0.0/20), non-overlapping with the
# earlier /26.
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPClaim
metadata:
  name: ipclass-default-len-claim
  namespace: ($namespace)
status:
  phase: Bound
  (boundAllocationRef.name != null): true
  (regex_match('^10\.140\.\d+\.\d+/26$', allocatedCIDR)): true
