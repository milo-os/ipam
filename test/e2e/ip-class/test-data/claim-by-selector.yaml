---
# Backward compatibility: the deprecated poolSelector path still resolves. No
# className is set; the label selector picks ipclass-pool-legacy
# (10.142.0.0/20). ipFamily is retained here to mirror a legacy claim exactly.
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPClaim
metadata:
  name: ipclass-legacy-selector-claim
  namespace: ($namespace)
spec:
  ipFamily: IPv4
  prefixLength: 24
  poolSelector:
    matchLabels:
      selection: ipclass-legacy
  reclaimPolicy: Delete
