---
# Backs e2e-public-egress. spec.classNames is how a pool opts its capacity in
# to a class (the pool owner decides, not the class author).
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPool
metadata:
  name: ipclass-pool-egress
spec:
  cidr: 10.140.0.0/20
  ipFamily: IPv4
  visibility: consumer
  classNames: [e2e-public-egress]
  allocation:
    minPrefixLength: 24
    maxPrefixLength: 28
    strategy: FirstFit
---
# Backs the default class e2e-internal-ipv4.
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPool
metadata:
  name: ipclass-pool-default
spec:
  cidr: 10.141.0.0/20
  ipFamily: IPv4
  visibility: consumer
  classNames: [e2e-internal-ipv4]
  allocation:
    minPrefixLength: 24
    maxPrefixLength: 28
    strategy: FirstFit
---
# Carries NO classNames but is labelled, so the deprecated poolSelector path
# still resolves onto it — the backward-compatibility case.
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPool
metadata:
  name: ipclass-pool-legacy
  labels:
    selection: ipclass-legacy
spec:
  cidr: 10.142.0.0/20
  ipFamily: IPv4
  visibility: consumer
  allocation:
    minPrefixLength: 24
    maxPrefixLength: 28
    strategy: FirstFit
