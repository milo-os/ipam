# Both concurrent alpha claims Bound with /24s inside 10.100.0.0/20.
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPClaim
metadata:
  name: mt-concurrent-alpha-1
  namespace: ($namespace)
status:
  phase: Bound
  (regex_match('^10\.100\.([0-9]|1[0-5])\.0/24$', allocatedCIDR)): true
---
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPClaim
metadata:
  name: mt-concurrent-alpha-2
  namespace: ($namespace)
status:
  phase: Bound
  (regex_match('^10\.100\.([0-9]|1[0-5])\.0/24$', allocatedCIDR)): true
