# Both concurrent beta claims Bound with /24s inside 10.101.0.0/20.
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPClaim
metadata:
  name: mt-concurrent-beta-1
  namespace: ($namespace)
status:
  phase: Bound
  (regex_match('^10\.101\.([0-9]|1[0-5])\.0/24$', allocatedCIDR)): true
---
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPClaim
metadata:
  name: mt-concurrent-beta-2
  namespace: ($namespace)
status:
  phase: Bound
  (regex_match('^10\.101\.([0-9]|1[0-5])\.0/24$', allocatedCIDR)): true
