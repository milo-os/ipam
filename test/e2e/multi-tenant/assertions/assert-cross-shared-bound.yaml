# mt-cross-claim: project-beta's cross-project claim against project-alpha's
# shared pool. The claim is owned by the caller (project-beta), so it is read
# back under project-beta scope; allocatedCIDR is a /24 inside 172.20.0.0/20.
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPClaim
metadata:
  name: mt-cross-claim
  namespace: ($namespace)
status:
  phase: Bound
  (regex_match('^172\.20\.([0-9]|1[0-5])\.0/24$', allocatedCIDR)): true
