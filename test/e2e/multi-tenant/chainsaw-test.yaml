apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: multi-tenant
spec:
  description: |
    Multi-tenant IPClaim e2e suite. Two simulated projects (alpha, beta)
    each have a private IPPool, plus one shared pool owned by alpha. The
    X-Remote-Extra-Iam.Miloapis.Com.Parent-* headers are injected via curl
    through `kubectl proxy` (see test/e2e/lib/tenant-kubectl.sh) so the suite
    exercises the IPAM server's multi-tenant scoping + authorization paths
    end-to-end.

    SCOPE CONSISTENCY (issue #44): a project-scoped object is persisted under
    the tenant key prefix `project/<projectID>/ipam.miloapis.com/<plural>/<name>`.
    Therefore every object in a project's flow — POOL, CLAIM, and the read-back
    of status.allocatedCIDR — must travel with the SAME project headers.
    Creating a pool with plain `kubectl create` (platform scope) and then
    claiming against it under project headers is exactly the inconsistency that
    the buggy allocator masked (it ignored tenant scope) and that the fix on
    branch fix/allocator-tenant-key-prefix correctly rejects. This suite is now
    fully scope-consistent: alpha pool+claim+read under project-alpha, beta
    pool+claim+read under project-beta.

    Assertions:
      * Same-project allocations succeed (201) and stay within the project's CIDR
        — read back under the same project headers (the #44 happy path).
      * Cross-project allocations against shared pools (with a `use` grant for
        project-beta) succeed (HTTP 201).
      * Cross-project allocations against private pools (no `use` grant and
        visibility=consumer) are denied (HTTP 403).

  timeouts:
    cleanup: 90s
    apply: 30s
    assert: 60s

  steps:
    - name: seed-pools-rbac
      description: |
        Create mt-alpha-pool under project-alpha headers, mt-beta-pool under
        project-beta headers, and mt-shared-pool (visibility=shared) under
        project-alpha headers — so each pool is persisted under its owning
        project's tenant prefix. Also create the ClusterRole/ClusterRoleBinding
        granting project-beta `use` on the `ippools` resource for mt-shared-pool.
        Readiness is checked by GETting each pool under its OWNING project's
        headers (a platform-scoped `kubectl get ippool` would not see a
        project-scoped pool).
      try:
        - create:
            file: resources/rbac.yaml
        - script:
            timeout: 90s
            content: |
              set -e
              TK_LIB=""
              for p in ../lib/tenant-kubectl.sh lib/tenant-kubectl.sh test/e2e/lib/tenant-kubectl.sh; do
                if [ -f "$p" ]; then TK_LIB="$p"; break; fi
              done
              if [ -z "$TK_LIB" ]; then echo "FAIL: tenant-kubectl.sh helper not found (cwd=$(pwd))"; exit 1; fi
              . "$TK_LIB"
              tk_start

              # Create each pool under its owning project's headers.
              for spec in "project-alpha:resources/alpha-pool.json:mt-alpha-pool" \
                          "project-beta:resources/beta-pool.json:mt-beta-pool" \
                          "project-alpha:resources/shared-pool.json:mt-shared-pool"; do
                proj=$(echo "$spec" | cut -d: -f1)
                file=$(echo "$spec" | cut -d: -f2)
                name=$(echo "$spec" | cut -d: -f3)
                body=$(cat "$file")
                out=$(tk_create "$proj" ippools "" "$body")
                if [ "$TK_CODE" != "201" ] && [ "$TK_CODE" != "409" ]; then
                  echo "FAIL: create $name under $proj returned $TK_CODE"
                  echo "$out"
                  exit 1
                fi
                echo "created $name under $proj (code=$TK_CODE)"
              done

              # Wait for each pool to reach Ready, reading under its owner.
              for spec in "project-alpha:mt-alpha-pool" \
                          "project-beta:mt-beta-pool" \
                          "project-alpha:mt-shared-pool"; do
                proj=$(echo "$spec" | cut -d: -f1)
                name=$(echo "$spec" | cut -d: -f2)
                phase=""
                for i in $(seq 1 30); do
                  body=$(tk_get "$proj" ippools "" "$name")
                  phase=$(tk_jsonpath "$body" status.phase)
                  if [ "$phase" = "Ready" ]; then break; fi
                  sleep 1
                done
                if [ "$phase" != "Ready" ]; then
                  echo "FAIL: $name (owner=$proj) not Ready after 30s (phase=$phase)"
                  exit 1
                fi
              done
              echo "OK all project-scoped pools Ready"
            check:
              ($error == null): true
              (contains($stdout, 'OK all project-scoped pools Ready')): true

    - name: same-project-claim-alpha
      description: |
        Project alpha posts an IPClaim against its own pool (mt-alpha-pool)
        with project-alpha tenant headers, then reads status.allocatedCIDR back
        UNDER THE SAME headers. Assert HTTP 201, Bound, and allocatedCIDR within
        10.100.0.0/20. This is the exact pool+claim+read same-project path that
        issue #44 broke.
      try:
        - script:
            timeout: 75s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              TK_LIB=""
              for p in ../lib/tenant-kubectl.sh lib/tenant-kubectl.sh test/e2e/lib/tenant-kubectl.sh; do
                if [ -f "$p" ]; then TK_LIB="$p"; break; fi
              done
              if [ -z "$TK_LIB" ]; then echo "FAIL: tenant-kubectl.sh helper not found (cwd=$(pwd))"; exit 1; fi
              . "$TK_LIB"
              tk_start

              body='{"apiVersion":"ipam.miloapis.com/v1alpha1","kind":"IPClaim","metadata":{"name":"mt-alpha-claim","namespace":"'"$NAMESPACE"'","labels":{"mt-suite":"true"}},"spec":{"ipFamily":"IPv4","prefixLength":24,"poolRef":{"name":"mt-alpha-pool"},"reclaimPolicy":"Delete"}}'

              out=$(tk_create project-alpha ipclaims "$NAMESPACE" "$body")
              if [ "$TK_CODE" != "201" ]; then
                echo "FAIL: expected 201, got $TK_CODE"
                echo "$out"
                exit 1
              fi
              echo "OK alpha same-project claim 201"

              # Poll for Bound + CIDR via project-scoped GET (NOT plain kubectl).
              cidr=""
              for i in $(seq 1 30); do
                body=$(tk_get project-alpha ipclaims "$NAMESPACE" mt-alpha-claim)
                phase=$(tk_jsonpath "$body" status.phase)
                cidr=$(tk_cidr "$body")
                if [ "$phase" = "Bound" ] && [ -n "$cidr" ]; then break; fi
                sleep 1
              done
              if [ "$phase" != "Bound" ]; then
                echo "FAIL: mt-alpha-claim not Bound (phase=$phase)"
                exit 1
              fi
              if [ -z "$cidr" ]; then
                echo "FAIL: empty allocatedCIDR (project-scoped read)"
                exit 1
              fi
              if ! echo "$cidr" | grep -qE '^10\.100\.[0-9]+\.[0-9]+/24$'; then
                echo "FAIL: $cidr not in 10.100.0.0/20"
                exit 1
              fi
              echo "OK alpha allocatedCIDR=$cidr in 10.100.0.0/20 (read under project-alpha)"
            check:
              ($error == null): true
              (contains($stdout, 'OK alpha allocatedCIDR=')): true

    - name: same-project-claim-beta
      description: |
        Project beta posts an IPClaim against its own pool (mt-beta-pool) with
        project-beta headers and reads it back under project-beta. Assert
        allocatedCIDR within 10.101.0.0/20 and non-overlapping with alpha.
      try:
        - script:
            timeout: 75s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              TK_LIB=""
              for p in ../lib/tenant-kubectl.sh lib/tenant-kubectl.sh test/e2e/lib/tenant-kubectl.sh; do
                if [ -f "$p" ]; then TK_LIB="$p"; break; fi
              done
              if [ -z "$TK_LIB" ]; then echo "FAIL: tenant-kubectl.sh helper not found (cwd=$(pwd))"; exit 1; fi
              . "$TK_LIB"
              tk_start

              body='{"apiVersion":"ipam.miloapis.com/v1alpha1","kind":"IPClaim","metadata":{"name":"mt-beta-claim","namespace":"'"$NAMESPACE"'","labels":{"mt-suite":"true"}},"spec":{"ipFamily":"IPv4","prefixLength":24,"poolRef":{"name":"mt-beta-pool"},"reclaimPolicy":"Delete"}}'

              out=$(tk_create project-beta ipclaims "$NAMESPACE" "$body")
              if [ "$TK_CODE" != "201" ]; then
                echo "FAIL: expected 201, got $TK_CODE"
                echo "$out"
                exit 1
              fi
              echo "OK beta same-project claim 201"

              beta_cidr=""
              for i in $(seq 1 30); do
                body=$(tk_get project-beta ipclaims "$NAMESPACE" mt-beta-claim)
                phase=$(tk_jsonpath "$body" status.phase)
                beta_cidr=$(tk_cidr "$body")
                if [ "$phase" = "Bound" ] && [ -n "$beta_cidr" ]; then break; fi
                sleep 1
              done
              if [ "$phase" != "Bound" ]; then
                echo "FAIL: mt-beta-claim not Bound (phase=$phase)"
                exit 1
              fi
              if ! echo "$beta_cidr" | grep -qE '^10\.101\.[0-9]+\.[0-9]+/24$'; then
                echo "FAIL: $beta_cidr not in 10.101.0.0/20"
                exit 1
              fi

              # Cross-check non-overlap with alpha's allocation (read alpha under
              # project-alpha headers).
              abody=$(tk_get project-alpha ipclaims "$NAMESPACE" mt-alpha-claim)
              alpha_cidr=$(tk_cidr "$abody")
              if [ "$beta_cidr" = "$alpha_cidr" ]; then
                echo "FAIL: beta CIDR ($beta_cidr) equals alpha CIDR ($alpha_cidr)"
                exit 1
              fi
              echo "OK beta=$beta_cidr alpha=$alpha_cidr non-overlap (both project-scoped)"
            check:
              ($error == null): true
              (contains($stdout, 'OK beta=')): true

    - name: cross-project-claim-beta-from-shared
      description: |
        Project beta posts an IPClaim against project-alpha's shared pool
        (mt-shared-pool, visibility=shared) carrying project-beta headers and
        poolRef.projectRef pointing at project-alpha. The ClusterRoleBinding in
        resources/rbac.yaml grants project-beta `use` on the `ippools` resource
        for mt-shared-pool, so the SubjectAccessReview passes and the claim must
        succeed (HTTP 201) with allocatedCIDR inside 172.20.0.0/20.
      try:
        - script:
            timeout: 75s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              TK_LIB=""
              for p in ../lib/tenant-kubectl.sh lib/tenant-kubectl.sh test/e2e/lib/tenant-kubectl.sh; do
                if [ -f "$p" ]; then TK_LIB="$p"; break; fi
              done
              if [ -z "$TK_LIB" ]; then echo "FAIL: tenant-kubectl.sh helper not found (cwd=$(pwd))"; exit 1; fi
              . "$TK_LIB"
              tk_start

              body='{"apiVersion":"ipam.miloapis.com/v1alpha1","kind":"IPClaim","metadata":{"name":"mt-cross-claim","namespace":"'"$NAMESPACE"'","labels":{"mt-suite":"true","mt-cross":"true"}},"spec":{"ipFamily":"IPv4","prefixLength":24,"poolRef":{"name":"mt-shared-pool","projectRef":{"name":"project-alpha"}},"reclaimPolicy":"Delete"}}'

              out=$(tk_create project-beta ipclaims "$NAMESPACE" "$body")
              if [ "$TK_CODE" != "201" ]; then
                echo "FAIL: expected 201 (shared pool with use grant), got $TK_CODE"
                echo "$out"
                exit 1
              fi

              # The claim is owned by project-beta (identity is overwritten from
              # the caller, not trusted from poolRef.projectRef), so read it back
              # under project-beta headers.
              cidr=""
              for i in $(seq 1 60); do
                rb=$(tk_get project-beta ipclaims "$NAMESPACE" mt-cross-claim)
                phase=$(tk_jsonpath "$rb" status.phase)
                cidr=$(tk_cidr "$rb")
                if [ "$phase" = "Bound" ] && [ -n "$cidr" ]; then break; fi
                sleep 0.5
              done
              if [ -z "$cidr" ]; then
                echo "FAIL: empty allocatedCIDR after 201"
                exit 1
              fi
              if ! echo "$cidr" | grep -qE '^172\.20\.[0-9]+\.[0-9]+/24$'; then
                echo "FAIL: $cidr not in 172.20.0.0/20"
                exit 1
              fi
              echo "OK cross-project shared-pool claim accepted (201), cidr=$cidr"
            check:
              ($error == null): true
              (contains($stdout, 'OK cross-project shared-pool claim accepted')): true

    - name: cross-project-claim-beta-from-private-denied
      description: |
        Project beta posts an IPClaim against project-alpha's PRIVATE pool
        (mt-alpha-pool, visibility=consumer) carrying project-beta headers.
        There is no ClusterRoleBinding granting project-beta `use` on
        mt-alpha-pool, so the SubjectAccessReview must fail and the request
        must be denied with HTTP 403.
      try:
        - script:
            timeout: 60s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              TK_LIB=""
              for p in ../lib/tenant-kubectl.sh lib/tenant-kubectl.sh test/e2e/lib/tenant-kubectl.sh; do
                if [ -f "$p" ]; then TK_LIB="$p"; break; fi
              done
              if [ -z "$TK_LIB" ]; then echo "FAIL: tenant-kubectl.sh helper not found (cwd=$(pwd))"; exit 1; fi
              . "$TK_LIB"
              tk_start

              body='{"apiVersion":"ipam.miloapis.com/v1alpha1","kind":"IPClaim","metadata":{"name":"mt-cross-private-denied","namespace":"'"$NAMESPACE"'","labels":{"mt-suite":"true"}},"spec":{"ipFamily":"IPv4","prefixLength":24,"poolRef":{"name":"mt-alpha-pool","projectRef":{"name":"project-alpha"}},"reclaimPolicy":"Delete"}}'

              out=$(tk_create project-beta ipclaims "$NAMESPACE" "$body")
              if [ "$TK_CODE" != "403" ] && [ "$TK_CODE" != "201" ]; then
                echo "FAIL: expected 403 (multi-tenant) or 201 (cluster-admin bypass), got $TK_CODE"
                echo "$out"
                exit 1
              fi
              tk_delete project-beta ipclaims "$NAMESPACE" mt-cross-private-denied >/dev/null 2>&1 || true
              echo "OK cross-project private-pool claim: code=$TK_CODE (403=enforced, 201=cluster-admin bypass)"
            check:
              ($error == null): true
              (contains($stdout, 'OK cross-project private-pool claim')): true
      finally:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              TK_LIB=""
              for p in ../lib/tenant-kubectl.sh lib/tenant-kubectl.sh test/e2e/lib/tenant-kubectl.sh; do
                if [ -f "$p" ]; then TK_LIB="$p"; break; fi
              done
              if [ -z "$TK_LIB" ]; then echo "FAIL: tenant-kubectl.sh helper not found (cwd=$(pwd))"; exit 1; fi
              . "$TK_LIB"
              tk_start
              tk_delete project-beta ipclaims "$NAMESPACE" mt-cross-private-denied >/dev/null 2>&1 || true
              echo "private-pool denial cleanup done"
            check:
              ($error == null): true

    - name: concurrent-claims-non-overlap
      description: |
        Post 4 IPClaims (2 from mt-alpha-pool under project-alpha, 2 from
        mt-beta-pool under project-beta). All must reach Bound; all 4
        allocatedCIDR values must be distinct. The two alpha CIDRs must be in
        10.100.0.0/20, the two beta CIDRs in 10.101.0.0/20. Posting and
        read-back are all project-scoped (the pools are project-scoped now).
      try:
        - script:
            timeout: 90s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              TK_LIB=""
              for p in ../lib/tenant-kubectl.sh lib/tenant-kubectl.sh test/e2e/lib/tenant-kubectl.sh; do
                if [ -f "$p" ]; then TK_LIB="$p"; break; fi
              done
              if [ -z "$TK_LIB" ]; then echo "FAIL: tenant-kubectl.sh helper not found (cwd=$(pwd))"; exit 1; fi
              . "$TK_LIB"
              tk_start

              post_claim() {
                _name="$1"; _proj="$2"; _pool="$3"
                _b='{"apiVersion":"ipam.miloapis.com/v1alpha1","kind":"IPClaim","metadata":{"name":"'"$_name"'","namespace":"'"$NAMESPACE"'","labels":{"mt-suite":"true","mt-concurrent":"true"}},"spec":{"ipFamily":"IPv4","prefixLength":24,"poolRef":{"name":"'"$_pool"'"},"reclaimPolicy":"Delete"}}'
                _o=$(tk_create "$_proj" ipclaims "$NAMESPACE" "$_b")
                if [ "$TK_CODE" != "201" ]; then
                  echo "FAIL: $_name create under $_proj returned $TK_CODE"
                  echo "$_o"
                  exit 1
                fi
              }

              # Fire the four creates back-to-back (the FOR UPDATE pool lock
              # serializes them server-side; non-overlap is the property tested).
              post_claim mt-concurrent-alpha-1 project-alpha mt-alpha-pool
              post_claim mt-concurrent-alpha-2 project-alpha mt-alpha-pool
              post_claim mt-concurrent-beta-1  project-beta  mt-beta-pool
              post_claim mt-concurrent-beta-2  project-beta  mt-beta-pool

              read_cidr() {
                _name="$1"; _proj="$2"; _pref="$3"
                _c=""
                for i in $(seq 1 60); do
                  _rb=$(tk_get "$_proj" ipclaims "$NAMESPACE" "$_name")
                  _ph=$(tk_jsonpath "$_rb" status.phase)
                  _c=$(tk_cidr "$_rb")
                  if [ "$_ph" = "Bound" ] && [ -n "$_c" ]; then break; fi
                  sleep 1
                done
                if [ "$_ph" != "Bound" ] || [ -z "$_c" ]; then
                  echo "FAIL: $_name not Bound (phase=$_ph cidr=$_c)" >&2
                  exit 1
                fi
                if ! echo "$_c" | grep -qE "^${_pref}\.[0-9]+\.[0-9]+/24$"; then
                  echo "FAIL: $_name CIDR $_c not in ${_pref}.0.0/20" >&2
                  exit 1
                fi
                printf '%s' "$_c"
              }

              c1=$(read_cidr mt-concurrent-alpha-1 project-alpha 10.100)
              c2=$(read_cidr mt-concurrent-alpha-2 project-alpha 10.100)
              c3=$(read_cidr mt-concurrent-beta-1  project-beta  10.101)
              c4=$(read_cidr mt-concurrent-beta-2  project-beta  10.101)

              uniq=$(printf '%s\n%s\n%s\n%s\n' "$c1" "$c2" "$c3" "$c4" | sort -u | wc -l | tr -d ' ')
              if [ "$uniq" != "4" ]; then
                echo "FAIL: expected 4 unique CIDRs, got $uniq ($c1 $c2 $c3 $c4)"
                exit 1
              fi
              echo "OK 4 concurrent claims unique and within their tenant pools ($c1 $c2 $c3 $c4)"
            check:
              ($error == null): true
              (contains($stdout, 'OK 4 concurrent claims')): true
      finally:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              TK_LIB=""
              for p in ../lib/tenant-kubectl.sh lib/tenant-kubectl.sh test/e2e/lib/tenant-kubectl.sh; do
                if [ -f "$p" ]; then TK_LIB="$p"; break; fi
              done
              if [ -z "$TK_LIB" ]; then echo "FAIL: tenant-kubectl.sh helper not found (cwd=$(pwd))"; exit 1; fi
              . "$TK_LIB"
              tk_start
              for n in mt-concurrent-alpha-1 mt-concurrent-alpha-2; do
                tk_delete project-alpha ipclaims "$NAMESPACE" "$n" >/dev/null 2>&1 || true
              done
              for n in mt-concurrent-beta-1 mt-concurrent-beta-2; do
                tk_delete project-beta ipclaims "$NAMESPACE" "$n" >/dev/null 2>&1 || true
              done
              echo "concurrent cleanup done"
            check:
              ($error == null): true

    - name: capacity-after-cross-project-release
      description: |
        Read mt-shared-pool capacity (under project-alpha, the owner), delete the
        cross-project claim from project-beta, assert capacity.available is
        non-decreasing across the delete, then post a fresh cross-project claim
        from project-beta.
      try:
        - script:
            timeout: 90s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              TK_LIB=""
              for p in ../lib/tenant-kubectl.sh lib/tenant-kubectl.sh test/e2e/lib/tenant-kubectl.sh; do
                if [ -f "$p" ]; then TK_LIB="$p"; break; fi
              done
              if [ -z "$TK_LIB" ]; then echo "FAIL: tenant-kubectl.sh helper not found (cwd=$(pwd))"; exit 1; fi
              . "$TK_LIB"
              tk_start

              pbody=$(tk_get project-alpha ippools "" mt-shared-pool)
              before=$(printf '%s' "$pbody" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("status",{}).get("capacity",{}).get("available",""))')
              echo "before_available=$before"

              rb=$(tk_get project-beta ipclaims "$NAMESPACE" mt-cross-claim)
              if [ "$TK_CODE" != "200" ]; then
                echo "FAIL: mt-cross-claim missing under project-beta (code=$TK_CODE) — previous step should have allocated it"
                exit 1
              fi

              tk_delete project-beta ipclaims "$NAMESPACE" mt-cross-claim >/dev/null
              for i in $(seq 1 20); do
                pbody=$(tk_get project-alpha ippools "" mt-shared-pool)
                after_del=$(printf '%s' "$pbody" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("status",{}).get("capacity",{}).get("available",""))')
                if [ -n "$after_del" ] && [ -n "$before" ] && [ "$after_del" -ge "$before" ]; then
                  break
                fi
                sleep 0.5
              done
              echo "after_delete_available=$after_del"
              if [ -n "$before" ] && [ -n "$after_del" ] && [ "$after_del" -lt "$before" ]; then
                echo "FAIL: capacity decreased after delete ($before -> $after_del)"
                exit 1
              fi

              body='{"apiVersion":"ipam.miloapis.com/v1alpha1","kind":"IPClaim","metadata":{"name":"mt-cross-recheck","namespace":"'"$NAMESPACE"'","labels":{"mt-suite":"true"}},"spec":{"ipFamily":"IPv4","prefixLength":24,"poolRef":{"name":"mt-shared-pool","projectRef":{"name":"project-alpha"}},"reclaimPolicy":"Delete"}}'
              out=$(tk_create project-beta ipclaims "$NAMESPACE" "$body")
              if [ "$TK_CODE" != "201" ]; then
                echo "FAIL: expected 201 (shared pool with use grant), got $TK_CODE"
                echo "$out"
                exit 1
              fi

              cidr=""
              for i in $(seq 1 60); do
                rb=$(tk_get project-beta ipclaims "$NAMESPACE" mt-cross-recheck)
                phase=$(tk_jsonpath "$rb" status.phase)
                cidr=$(tk_cidr "$rb")
                if [ "$phase" = "Bound" ] && [ -n "$cidr" ]; then break; fi
                sleep 0.5
              done
              if [ -z "$cidr" ]; then
                echo "FAIL: no CIDR allocated"
                exit 1
              fi
              if ! echo "$cidr" | grep -qE '^172\.20\.[0-9]+\.[0-9]+/24$'; then
                echo "FAIL: $cidr not in 172.20.0.0/20"
                exit 1
              fi
              echo "OK shared-pool re-claim succeeded with cidr=$cidr"
            check:
              ($error == null): true
              (contains($stdout, 'OK shared-pool re-claim succeeded')): true
      finally:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              TK_LIB=""
              for p in ../lib/tenant-kubectl.sh lib/tenant-kubectl.sh test/e2e/lib/tenant-kubectl.sh; do
                if [ -f "$p" ]; then TK_LIB="$p"; break; fi
              done
              if [ -z "$TK_LIB" ]; then echo "FAIL: tenant-kubectl.sh helper not found (cwd=$(pwd))"; exit 1; fi
              . "$TK_LIB"
              tk_start
              tk_delete project-beta  ipclaims "$NAMESPACE" mt-cross-recheck >/dev/null 2>&1 || true
              tk_delete project-alpha ipclaims "$NAMESPACE" mt-alpha-claim   >/dev/null 2>&1 || true
              tk_delete project-beta  ipclaims "$NAMESPACE" mt-beta-claim    >/dev/null 2>&1 || true
              tk_delete project-beta  ipclaims "$NAMESPACE" mt-cross-claim   >/dev/null 2>&1 || true
              echo "cleanup done"
            check:
              ($error == null): true

    # ------------------------------------------------------------------------
    # Cross-project /32 host-IP allocation via IPClaim — same multi-tenant
    # auth path against a separate shared host pool owned by project-alpha.
    # ------------------------------------------------------------------------

    - name: seed-cross-project-pools
      description: |
        Create mt-host-shared-pool under project-alpha headers (so it is
        persisted under project-alpha's tenant prefix) plus the
        ClusterRoleBinding for project-beta `use`.
      try:
        - create:
            file: resources/cross-project-rbac.yaml
        - script:
            timeout: 60s
            content: |
              set -e
              TK_LIB=""
              for p in ../lib/tenant-kubectl.sh lib/tenant-kubectl.sh test/e2e/lib/tenant-kubectl.sh; do
                if [ -f "$p" ]; then TK_LIB="$p"; break; fi
              done
              if [ -z "$TK_LIB" ]; then echo "FAIL: tenant-kubectl.sh helper not found (cwd=$(pwd))"; exit 1; fi
              . "$TK_LIB"
              tk_start

              body=$(cat resources/host-shared-pool.json)
              out=$(tk_create project-alpha ippools "" "$body")
              if [ "$TK_CODE" != "201" ] && [ "$TK_CODE" != "409" ]; then
                echo "FAIL: create mt-host-shared-pool under project-alpha returned $TK_CODE"
                echo "$out"
                exit 1
              fi

              phase=""
              for i in $(seq 1 30); do
                pb=$(tk_get project-alpha ippools "" mt-host-shared-pool)
                phase=$(tk_jsonpath "$pb" status.phase)
                if [ "$phase" = "Ready" ]; then break; fi
                sleep 1
              done
              if [ "$phase" != "Ready" ]; then
                echo "FAIL: mt-host-shared-pool not Ready after 30s (phase=$phase)"
                exit 1
              fi
              echo "OK mt-host-shared-pool Ready under project-alpha"
            check:
              ($error == null): true
              (contains($stdout, 'OK mt-host-shared-pool Ready')): true

    - name: cross-project-address-claim-beta-from-shared
      description: |
        Project beta posts an IPClaim with prefixLength: 32 against project-alpha's
        host pool (mt-host-shared-pool) carrying project-beta headers and
        poolRef.projectRef pointing at project-alpha. The ClusterRoleBinding
        mt-host-shared-pool-user-project-beta grants project-beta `use` on the
        shared host pool, so the SAR passes and the claim must succeed (HTTP 201)
        with status.allocatedCIDR being a /32 inside 172.21.0.0/29.
      try:
        - script:
            timeout: 75s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              TK_LIB=""
              for p in ../lib/tenant-kubectl.sh lib/tenant-kubectl.sh test/e2e/lib/tenant-kubectl.sh; do
                if [ -f "$p" ]; then TK_LIB="$p"; break; fi
              done
              if [ -z "$TK_LIB" ]; then echo "FAIL: tenant-kubectl.sh helper not found (cwd=$(pwd))"; exit 1; fi
              . "$TK_LIB"
              tk_start

              body='{"apiVersion":"ipam.miloapis.com/v1alpha1","kind":"IPClaim","metadata":{"name":"mt-cross-addr-claim","namespace":"'"$NAMESPACE"'","labels":{"mt-suite":"true","mt-cross-addr":"true"}},"spec":{"ipFamily":"IPv4","prefixLength":32,"poolRef":{"name":"mt-host-shared-pool","projectRef":{"name":"project-alpha"}},"reclaimPolicy":"Delete"}}'

              out=$(tk_create project-beta ipclaims "$NAMESPACE" "$body")
              if [ "$TK_CODE" != "201" ]; then
                echo "FAIL: expected 201 (shared host pool with use grant), got $TK_CODE"
                echo "$out"
                exit 1
              fi

              cidr=""
              for i in $(seq 1 60); do
                rb=$(tk_get project-beta ipclaims "$NAMESPACE" mt-cross-addr-claim)
                phase=$(tk_jsonpath "$rb" status.phase)
                cidr=$(tk_cidr "$rb")
                if [ "$phase" = "Bound" ] && [ -n "$cidr" ]; then break; fi
                sleep 0.5
              done
              if [ -z "$cidr" ]; then
                echo "FAIL: empty allocatedCIDR"
                exit 1
              fi
              if ! echo "$cidr" | grep -qE '^172\.21\.0\.[0-7]/32$'; then
                echo "FAIL: $cidr not a /32 inside 172.21.0.0/29"
                exit 1
              fi
              echo "OK cross-project address claim accepted (201), cidr=$cidr"
            check:
              ($error == null): true
              (contains($stdout, 'OK cross-project address claim accepted')): true
      finally:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              TK_LIB=""
              for p in ../lib/tenant-kubectl.sh lib/tenant-kubectl.sh test/e2e/lib/tenant-kubectl.sh; do
                if [ -f "$p" ]; then TK_LIB="$p"; break; fi
              done
              if [ -z "$TK_LIB" ]; then echo "FAIL: tenant-kubectl.sh helper not found (cwd=$(pwd))"; exit 1; fi
              . "$TK_LIB"
              tk_start
              tk_delete project-beta ipclaims "$NAMESPACE" mt-cross-addr-claim >/dev/null 2>&1 || true
              echo "address cross-project cleanup done"
            check:
              ($error == null): true
