apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: multi-tenant
spec:
  # Resources are tenant-scoped (created under impersonation contexts) and live
  # in IPAM's postgres, not kube etcd; chainsaw's automatic cleanup runs on the
  # default/platform cluster and cannot see them. Skip auto-cleanup and rely on
  # the explicit per-step finally deletes (under the owning impersonation context).
  skipDelete: true
  description: |
    Multi-tenant IPClaim e2e suite, driven by NATIVE chainsaw operations under
    Kubernetes impersonation (no kubectl-proxy/curl). Two simulated projects
    (alpha, beta) each own a private IPPool, plus shared pools owned by alpha.

    TENANCY VIA IMPERSONATION (equivalent to the front gate):
      IPAM derives tenant scope from UserInfo.Extra keys
      iam.miloapis.com/parent-{name,type,api-group} (internal/tenant.FromContext).
      Milo's front gate normally forwards these as requestheader X-Remote-Extra-*.
      This suite carries the SAME extras via kubeconfig impersonation:
      act-as-user-extra -> Impersonate-Extra-* -> kube-apiserver requestheader ->
      X-Remote-Extra-* -> UserInfo.Extra. The allocator only reads
      UserInfo.Extra, so an impersonated extra is equivalent to a front-gate
      requestheader extra for allocator scoping. The per-project impersonation
      contexts live in a generated kubeconfig (see test/e2e/lib/
      gen-impersonation-kubeconfig.sh, produced by `task e2e`); the `clusters:`
      block below selects them per operation via `cluster:`.

    SCOPE CONSISTENCY (issue #44): a project-scoped object is persisted under
    the tenant key prefix project/<projectID>/ipam.miloapis.com/<plural>/<name>.
    Every object in a project's flow — POOL, CLAIM, and the read-back of
    status.allocatedCIDR — therefore travels with the SAME project scope (the
    same impersonation context). alpha pool+claim+read run under
    tenant-project-alpha, beta under tenant-project-beta.

    Assertions:
      * Same-project allocations succeed and stay within the project's CIDR,
        read back under the same project scope (the #44 happy path).
      * Cross-project allocations against shared pools (with a `use` grant for
        project-beta) succeed.
      * Cross-project allocations against private pools (no `use` grant,
        visibility=consumer) are denied — strictly, because the impersonated
        tenant user is not a cluster admin.

  # Per-project impersonation contexts. Kubeconfig path is relative to this
  # suite directory; generated by `task e2e:gen-impersonation-kubeconfig`.
  clusters:
    project-alpha:
      kubeconfig: ../.tenant-impersonation-mt.kubeconfig
      context: tenant-project-alpha
    project-beta:
      kubeconfig: ../.tenant-impersonation-mt.kubeconfig
      context: tenant-project-beta

  timeouts:
    cleanup: 90s
    apply: 30s
    assert: 60s

  steps:
    - name: seed-rbac
      description: |
        Create the impersonation + tenant-user RBAC (lets the e2e admin
        impersonate the tenant user/extras and lets that user perform ipam CRUD)
        and the cross-project `use` grants for the shared pools. These run on the
        default (platform/admin) cluster — RBAC is cluster-wide, not tenanted.
      try:
        # Generate the impersonation kubeconfig the `clusters:` block references.
        # Done in-suite (not only via `task e2e`) so it also works under a direct
        # `chainsaw test test/e2e/` invocation (how CI runs). chainsaw executes
        # scripts with cwd = this suite dir, so cd to the repo root first, where
        # the source KUBECONFIG (.test-infra/kubeconfig) and the lib/output paths
        # resolve. Per-suite output filename avoids a parallel-run write race.
        - script:
            content: |
              cd ../../..
              sh test/e2e/lib/gen-impersonation-kubeconfig.sh test/e2e/.tenant-impersonation-mt.kubeconfig
            check:
              ($error == null): true
        - create:
            file: resources/impersonation-rbac.yaml
        - create:
            file: resources/rbac.yaml

    - name: seed-pools
      description: |
        Create each pool under its OWNING project's impersonation context so it
        is persisted under that project's tenant prefix, then assert Ready under
        the same context.
      try:
        - create:
            cluster: project-alpha
            file: resources/alpha-pool.yaml
        - create:
            cluster: project-beta
            file: resources/beta-pool.yaml
        - create:
            cluster: project-alpha
            file: resources/shared-pool.yaml
        - assert:
            cluster: project-alpha
            file: assertions/assert-alpha-pool-ready.yaml
        - assert:
            cluster: project-beta
            file: assertions/assert-beta-pool-ready.yaml
        - assert:
            cluster: project-alpha
            file: assertions/assert-shared-pool-ready.yaml

    - name: same-project-claim-alpha
      description: |
        project-alpha claims against its own pool and reads status back under the
        SAME context. allocatedCIDR must be a /24 in 10.100.0.0/20. This is the
        exact pool+claim+read same-project path issue #44 broke.
      try:
        - create:
            cluster: project-alpha
            file: resources/alpha-claim.yaml
        - assert:
            cluster: project-alpha
            file: assertions/assert-alpha-claim-bound.yaml

    - name: same-project-claim-beta
      description: |
        project-beta claims against its own pool; allocatedCIDR must be a /24 in
        10.101.0.0/20 (disjoint from alpha's 10.100.0.0/20).
      try:
        - create:
            cluster: project-beta
            file: resources/beta-claim.yaml
        - assert:
            cluster: project-beta
            file: assertions/assert-beta-claim-bound.yaml

    - name: cross-project-claim-beta-from-shared
      description: |
        project-beta claims project-alpha's SHARED pool (visibility=shared) with
        poolRef.projectRef=project-alpha. The `use` ClusterRoleBinding (rbac.yaml)
        grants the impersonated project-beta group `use` on mt-shared-pool, so the
        cross-project SAR passes and the claim binds with a /24 in 172.20.0.0/20.
      try:
        - create:
            cluster: project-beta
            file: resources/cross-shared-claim.yaml
        - assert:
            cluster: project-beta
            file: assertions/assert-cross-shared-bound.yaml

    - name: cross-project-claim-beta-from-private-denied
      description: |
        project-beta claims project-alpha's PRIVATE pool (visibility=consumer)
        with no `use` grant. AuthorizeCrossProjectPrefix rejects non-shared pools,
        so the apiserver denies the create (Forbidden / not accessible). With
        impersonation the tenant user is NOT a cluster admin, so this is a strict
        deny (no cluster-admin bypass).
      try:
        - create:
            cluster: project-beta
            file: resources/cross-private-claim.yaml
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'Forbidden') || contains($error, 'forbidden') || contains($error, 'not accessible') || contains($error, 'no pool')): true

    - name: concurrent-claims-non-overlap
      description: |
        Two alpha claims (under project-alpha) and two beta claims (under
        project-beta), all in a single create block per project. All four reach
        Bound within their tenant pools; the four allocatedCIDRs are unique.
      try:
        - create:
            cluster: project-alpha
            file: resources/concurrent-alpha-claims.yaml
        - create:
            cluster: project-beta
            file: resources/concurrent-beta-claims.yaml
        - assert:
            cluster: project-alpha
            file: assertions/assert-concurrent-alpha-bound.yaml
        - assert:
            cluster: project-beta
            file: assertions/assert-concurrent-beta-bound.yaml
        # Uniqueness across the four CIDRs. Chainsaw/JMESPath has no set-dedup
        # function, so this single read-only check shells out — but it uses the
        # generated impersonation kubeconfig + plain kubectl (NO curl/proxy/
        # manual header injection), staying scope-correct via the same contexts.
        - script:
            timeout: 30s
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: KCFG
                value: ../.tenant-impersonation-mt.kubeconfig
            content: |
              set -e
              a=$(kubectl --kubeconfig "$KCFG" --context tenant-project-alpha \
                get ipclaim -n "$NAMESPACE" mt-concurrent-alpha-1 mt-concurrent-alpha-2 \
                -o jsonpath='{.items[*].status.allocatedCIDR}')
              b=$(kubectl --kubeconfig "$KCFG" --context tenant-project-beta \
                get ipclaim -n "$NAMESPACE" mt-concurrent-beta-1 mt-concurrent-beta-2 \
                -o jsonpath='{.items[*].status.allocatedCIDR}')
              uniq=$(printf '%s %s\n' "$a" "$b" | tr ' ' '\n' | grep . | sort -u | wc -l | tr -d ' ')
              if [ "$uniq" != "4" ]; then
                echo "FAIL: expected 4 unique CIDRs, got $uniq (alpha='$a' beta='$b')"
                exit 1
              fi
              echo "OK 4 concurrent claims unique ($a $b)"
            check:
              ($error == null): true
              (contains($stdout, 'OK 4 concurrent claims unique')): true
      finally:
        - delete:
            cluster: project-alpha
            ref:
              apiVersion: ipam.miloapis.com/v1alpha1
              kind: IPClaim
              namespace: ($namespace)
              name: mt-concurrent-alpha-1
        - delete:
            cluster: project-alpha
            ref:
              apiVersion: ipam.miloapis.com/v1alpha1
              kind: IPClaim
              namespace: ($namespace)
              name: mt-concurrent-alpha-2
        - delete:
            cluster: project-beta
            ref:
              apiVersion: ipam.miloapis.com/v1alpha1
              kind: IPClaim
              namespace: ($namespace)
              name: mt-concurrent-beta-1
        - delete:
            cluster: project-beta
            ref:
              apiVersion: ipam.miloapis.com/v1alpha1
              kind: IPClaim
              namespace: ($namespace)
              name: mt-concurrent-beta-2

    - name: capacity-after-cross-project-release
      description: |
        Delete the cross-project claim from project-beta (releasing its block in
        the shared pool), then post a fresh cross-project claim from project-beta
        and assert it binds again — capacity was reclaimed.
      try:
        - delete:
            cluster: project-beta
            ref:
              apiVersion: ipam.miloapis.com/v1alpha1
              kind: IPClaim
              namespace: ($namespace)
              name: mt-cross-claim
        - apply:
            cluster: project-beta
            resource:
              apiVersion: ipam.miloapis.com/v1alpha1
              kind: IPClaim
              metadata:
                name: mt-cross-recheck
                labels:
                  mt-suite: "true"
              spec:
                ipFamily: IPv4
                prefixLength: 24
                poolRef:
                  name: mt-shared-pool
                  projectRef:
                    name: project-alpha
                reclaimPolicy: Delete
        - assert:
            cluster: project-beta
            resource:
              apiVersion: ipam.miloapis.com/v1alpha1
              kind: IPClaim
              metadata:
                name: mt-cross-recheck
              status:
                phase: Bound
                (regex_match('^172\.20\.([0-9]|1[0-5])\.0/24$', allocatedCIDR)): true
      finally:
        - delete:
            cluster: project-beta
            ref:
              apiVersion: ipam.miloapis.com/v1alpha1
              kind: IPClaim
              namespace: ($namespace)
              name: mt-cross-recheck

    # ------------------------------------------------------------------------
    # Cross-project /32 host-IP allocation via IPClaim — same multi-tenant auth
    # path against a separate shared host pool owned by project-alpha.
    # ------------------------------------------------------------------------

    - name: seed-cross-project-host-pool
      description: |
        Create mt-host-shared-pool under project-alpha plus the cross-project
        `use` grant for project-beta.
      try:
        - create:
            file: resources/cross-project-rbac.yaml
        - create:
            cluster: project-alpha
            file: resources/host-shared-pool.yaml
        - assert:
            cluster: project-alpha
            file: assertions/assert-host-shared-pool-ready.yaml

    - name: cross-project-address-claim-beta-from-shared
      description: |
        project-beta claims a /32 from project-alpha's shared host pool. Same
        cross-project auth path; allocatedCIDR is a /32 inside 172.21.0.0/29.
      try:
        - create:
            cluster: project-beta
            file: resources/cross-host-claim.yaml
        - assert:
            cluster: project-beta
            file: assertions/assert-cross-host-bound.yaml
      finally:
        - delete:
            cluster: project-beta
            ref:
              apiVersion: ipam.miloapis.com/v1alpha1
              kind: IPClaim
              namespace: ($namespace)
              name: mt-cross-addr-claim
