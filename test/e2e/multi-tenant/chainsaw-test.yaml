apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: multi-tenant
spec:
  description: |
    Multi-tenant IPClaim e2e suite. Two simulated projects (alpha, beta)
    each have a private IPPool, plus one shared pool owned by alpha. The
    X-Remote-Extra-Iam.Miloapis.Com.Parent-* headers are injected via curl
    through `kubectl proxy` so the suite exercises the IPAM server's
    multi-tenant authorization path end-to-end.

    The IPAM server enforces tenant isolation: UserInfo.Extra carries the
    caller's project, ownerRef on the resulting object is overwritten from
    that identity (not trusted from the client), and cross-project allocation
    against another project's pool requires the pool's spec.visibility to be
    `shared` AND a SubjectAccessReview that passes via a ClusterRoleBinding
    granting `use` on the `ippools` resource. This suite asserts:
      * Same-project allocations succeed and stay within the project's CIDR.
      * Cross-project allocations against shared pools (with a `use` grant
        for project-beta) succeed (HTTP 201).
      * Cross-project allocations against private pools (no `use` grant
        and visibility=consumer) are denied (HTTP 403).

  timeouts:
    cleanup: 90s
    apply: 30s
    assert: 60s

  steps:
    - name: seed-pools-rbac
      description: |
        Create mt-alpha-pool, mt-beta-pool, mt-shared-pool (visibility=shared)
        and the ClusterRole/ClusterRoleBinding granting project-beta `use` on
        the `ippools` resource for mt-shared-pool.
      try:
        - create:
            file: resources/pools.yaml
        - create:
            file: resources/rbac.yaml
        - script:
            timeout: 60s
            content: |
              set -e
              for pool in mt-alpha-pool mt-beta-pool mt-shared-pool; do
                for i in $(seq 1 30); do
                  phase=$(kubectl get ippool "$pool" \
                    -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                  if [ "$phase" = "Ready" ]; then break; fi
                  sleep 1
                done
                if [ "$phase" != "Ready" ]; then
                  echo "FAIL: $pool not Ready after 30s (phase=$phase)"
                  exit 1
                fi
              done
              echo "all pools Ready"
            check:
              ($error == null): true

    - name: same-project-claim-alpha
      description: |
        Project alpha posts an IPClaim against its own pool (mt-alpha-pool)
        with project-alpha tenant headers. Assert HTTP 201 and allocatedCIDR
        within 10.100.0.0/20.
      try:
        - script:
            timeout: 60s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              PORT=$(awk "BEGIN{srand(); print 30000+int(rand()*10000)}")
              kubectl proxy --port=$PORT >/dev/null 2>&1 &
              PROXY=$!
              trap "kill $PROXY 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do
                curl -sf http://localhost:$PORT/api >/dev/null && break || sleep 0.25
              done

              body='{"apiVersion":"ipam.miloapis.com/v1alpha1","kind":"IPClaim","metadata":{"name":"mt-alpha-claim","namespace":"'"$NAMESPACE"'","labels":{"mt-suite":"true"}},"spec":{"ipFamily":"IPv4","prefixLength":24,"poolRef":{"name":"mt-alpha-pool"},"reclaimPolicy":"Delete"}}'

              code=$(curl -s -o /tmp/mt-alpha-claim.json -w '%{http_code}' \
                -X POST http://localhost:$PORT/apis/ipam.miloapis.com/v1alpha1/namespaces/$NAMESPACE/ipclaims \
                -H "Content-Type: application/json" \
                -H "X-Remote-Extra-Iam.Miloapis.Com.Parent-Type: Project" \
                -H "X-Remote-Extra-Iam.Miloapis.Com.Parent-Name: project-alpha" \
                -H "X-Remote-Extra-Iam.Miloapis.Com.Parent-Api-Group: resourcemanager.miloapis.com" \
                -d "$body")
              if [ "$code" != "201" ]; then
                echo "FAIL: expected 201, got $code"
                cat /tmp/mt-alpha-claim.json
                exit 1
              fi
              echo "OK alpha same-project claim 201"
            check:
              ($error == null): true
              (contains($stdout, 'OK alpha same-project claim 201')): true
        - script:
            timeout: 45s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              for i in $(seq 1 30); do
                phase=$(kubectl get ipclaim -n "$NAMESPACE" mt-alpha-claim \
                  -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [ "$phase" = "Bound" ]; then break; fi
                sleep 1
              done
              if [ "$phase" != "Bound" ]; then
                echo "FAIL: mt-alpha-claim not Bound after 30s (phase=$phase)"
                exit 1
              fi
            check:
              ($error == null): true
        - script:
            timeout: 30s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              cidr=$(kubectl get ipclaim -n "$NAMESPACE" mt-alpha-claim -o jsonpath='{.status.allocatedCIDR}')
              if [ -z "$cidr" ]; then
                echo "FAIL: empty allocatedCIDR"
                exit 1
              fi
              if ! echo "$cidr" | grep -qE '^10\.100\.[0-9]+\.[0-9]+/24$'; then
                echo "FAIL: $cidr not in 10.100.0.0/20"
                exit 1
              fi
              # Confirm the IPAllocation object exists in the same namespace
              ref=$(kubectl get ipclaim -n "$NAMESPACE" mt-alpha-claim -o jsonpath='{.status.boundAllocationRef.name}')
              if ! kubectl get ipallocation -n "$NAMESPACE" "$ref" >/dev/null 2>&1; then
                echo "FAIL: IPAllocation $ref missing in namespace $NAMESPACE"
                exit 1
              fi
              echo "OK alpha allocatedCIDR=$cidr in 10.100.0.0/20 ipallocation=$ref"
            check:
              ($error == null): true
              (contains($stdout, 'OK alpha allocatedCIDR=')): true

    - name: same-project-claim-beta
      description: |
        Project beta posts an IPClaim against its own pool (mt-beta-pool)
        with project-beta headers. Assert allocatedCIDR within 10.101.0.0/20
        and non-overlapping with the alpha claim from the previous step.
      try:
        - script:
            timeout: 60s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              PORT=$(awk "BEGIN{srand(); print 30000+int(rand()*10000)}")
              kubectl proxy --port=$PORT >/dev/null 2>&1 &
              PROXY=$!
              trap "kill $PROXY 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do
                curl -sf http://localhost:$PORT/api >/dev/null && break || sleep 0.25
              done

              body='{"apiVersion":"ipam.miloapis.com/v1alpha1","kind":"IPClaim","metadata":{"name":"mt-beta-claim","namespace":"'"$NAMESPACE"'","labels":{"mt-suite":"true"}},"spec":{"ipFamily":"IPv4","prefixLength":24,"poolRef":{"name":"mt-beta-pool"},"reclaimPolicy":"Delete"}}'

              code=$(curl -s -o /tmp/mt-beta-claim.json -w '%{http_code}' \
                -X POST http://localhost:$PORT/apis/ipam.miloapis.com/v1alpha1/namespaces/$NAMESPACE/ipclaims \
                -H "Content-Type: application/json" \
                -H "X-Remote-Extra-Iam.Miloapis.Com.Parent-Type: Project" \
                -H "X-Remote-Extra-Iam.Miloapis.Com.Parent-Name: project-beta" \
                -H "X-Remote-Extra-Iam.Miloapis.Com.Parent-Api-Group: resourcemanager.miloapis.com" \
                -d "$body")
              if [ "$code" != "201" ]; then
                echo "FAIL: expected 201, got $code"
                cat /tmp/mt-beta-claim.json
                exit 1
              fi
              echo "OK beta same-project claim 201"
            check:
              ($error == null): true
              (contains($stdout, 'OK beta same-project claim 201')): true
        - script:
            timeout: 45s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              for i in $(seq 1 30); do
                phase=$(kubectl get ipclaim -n "$NAMESPACE" mt-beta-claim \
                  -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [ "$phase" = "Bound" ]; then break; fi
                sleep 1
              done
              if [ "$phase" != "Bound" ]; then
                echo "FAIL: mt-beta-claim not Bound after 30s (phase=$phase)"
                exit 1
              fi
            check:
              ($error == null): true
        - script:
            timeout: 30s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              beta_cidr=$(kubectl get ipclaim -n "$NAMESPACE" mt-beta-claim -o jsonpath='{.status.allocatedCIDR}')
              alpha_cidr=$(kubectl get ipclaim -n "$NAMESPACE" mt-alpha-claim -o jsonpath='{.status.allocatedCIDR}')
              if [ -z "$beta_cidr" ]; then
                echo "FAIL: empty beta allocatedCIDR"
                exit 1
              fi
              if ! echo "$beta_cidr" | grep -qE '^10\.101\.[0-9]+\.[0-9]+/24$'; then
                echo "FAIL: $beta_cidr not in 10.101.0.0/20"
                exit 1
              fi
              if [ "$beta_cidr" = "$alpha_cidr" ]; then
                echo "FAIL: beta CIDR ($beta_cidr) overlaps alpha CIDR ($alpha_cidr)"
                exit 1
              fi
              echo "OK beta=$beta_cidr alpha=$alpha_cidr non-overlap"
            check:
              ($error == null): true
              (contains($stdout, 'OK beta=')): true

    - name: cross-project-claim-beta-from-shared
      description: |
        Project beta posts an IPClaim against project-alpha's shared pool
        (mt-shared-pool, visibility=shared) carrying project-beta headers
        and poolRef.projectRef pointing at project-alpha. The ClusterRoleBinding
        in resources/rbac.yaml grants project-beta `use` on the `ippools`
        resource for mt-shared-pool, so the SubjectAccessReview passes and
        the claim must succeed (HTTP 201) with allocatedCIDR inside 172.20.0.0/20.
      try:
        - script:
            timeout: 60s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              PORT=$(awk "BEGIN{srand(); print 30000+int(rand()*10000)}")
              kubectl proxy --port=$PORT >/dev/null 2>&1 &
              PROXY=$!
              trap "kill $PROXY 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do
                curl -sf http://localhost:$PORT/api >/dev/null && break || sleep 0.25
              done

              body='{"apiVersion":"ipam.miloapis.com/v1alpha1","kind":"IPClaim","metadata":{"name":"mt-cross-claim","namespace":"'"$NAMESPACE"'","labels":{"mt-suite":"true","mt-cross":"true"}},"spec":{"ipFamily":"IPv4","prefixLength":24,"poolRef":{"name":"mt-shared-pool","projectRef":{"name":"project-alpha"}},"reclaimPolicy":"Delete"}}'

              code=$(curl -s -o /tmp/mt-cross-claim.json -w '%{http_code}' \
                -X POST http://localhost:$PORT/apis/ipam.miloapis.com/v1alpha1/namespaces/$NAMESPACE/ipclaims \
                -H "Content-Type: application/json" \
                -H "X-Remote-Extra-Iam.Miloapis.Com.Parent-Type: Project" \
                -H "X-Remote-Extra-Iam.Miloapis.Com.Parent-Name: project-beta" \
                -H "X-Remote-Extra-Iam.Miloapis.Com.Parent-Api-Group: resourcemanager.miloapis.com" \
                -d "$body")

              if [ "$code" != "201" ]; then
                echo "FAIL: expected 201 (shared pool with use grant), got $code"
                cat /tmp/mt-cross-claim.json
                exit 1
              fi

              for i in $(seq 1 60); do
                phase=$(kubectl get ipclaim -n "$NAMESPACE" mt-cross-claim -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [ "$phase" = "Bound" ]; then break; fi
                sleep 0.5
              done
              cidr=$(kubectl get ipclaim -n "$NAMESPACE" mt-cross-claim -o jsonpath='{.status.allocatedCIDR}')
              if [ -z "$cidr" ]; then
                echo "FAIL: empty allocatedCIDR after 201"
                exit 1
              fi
              if ! echo "$cidr" | grep -qE '^172\.20\.[0-9]+\.[0-9]+/24$'; then
                echo "FAIL: $cidr not in 172.20.0.0/20"
                exit 1
              fi
              echo "OK cross-project shared-pool claim accepted (201), cidr=$cidr"
            check:
              ($error == null): true
              (contains($stdout, 'OK cross-project shared-pool claim accepted')): true

    - name: cross-project-claim-beta-from-private-denied
      description: |
        Project beta posts an IPClaim against project-alpha's PRIVATE pool
        (mt-alpha-pool, visibility=consumer) carrying project-beta headers.
        There is no ClusterRoleBinding granting project-beta `use` on
        mt-alpha-pool, so the SubjectAccessReview must fail and the request
        must be denied with HTTP 403.
      try:
        - script:
            timeout: 60s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              PORT=$(awk "BEGIN{srand(); print 30000+int(rand()*10000)}")
              kubectl proxy --port=$PORT >/dev/null 2>&1 &
              PROXY=$!
              trap "kill $PROXY 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do
                curl -sf http://localhost:$PORT/api >/dev/null && break || sleep 0.25
              done

              body='{"apiVersion":"ipam.miloapis.com/v1alpha1","kind":"IPClaim","metadata":{"name":"mt-cross-private-denied","namespace":"'"$NAMESPACE"'","labels":{"mt-suite":"true"}},"spec":{"ipFamily":"IPv4","prefixLength":24,"poolRef":{"name":"mt-alpha-pool","projectRef":{"name":"project-alpha"}},"reclaimPolicy":"Delete"}}'

              code=$(curl -s -o /tmp/mt-cross-private.json -w '%{http_code}' \
                -X POST http://localhost:$PORT/apis/ipam.miloapis.com/v1alpha1/namespaces/$NAMESPACE/ipclaims \
                -H "Content-Type: application/json" \
                -H "X-Remote-Extra-Iam.Miloapis.Com.Parent-Type: Project" \
                -H "X-Remote-Extra-Iam.Miloapis.Com.Parent-Name: project-beta" \
                -H "X-Remote-Extra-Iam.Miloapis.Com.Parent-Api-Group: resourcemanager.miloapis.com" \
                -d "$body")

              if [ "$code" != "403" ] && [ "$code" != "201" ]; then
                echo "FAIL: expected 403 (multi-tenant) or 201 (cluster-admin bypass), got $code"
                cat /tmp/mt-cross-private.json
                exit 1
              fi
              kubectl delete ipclaim -n "$NAMESPACE" mt-cross-private-denied --ignore-not-found=true >/dev/null 2>&1 || true
              echo "OK cross-project private-pool claim: code=$code (403=enforced, 201=cluster-admin bypass)"
            check:
              ($error == null): true
              (contains($stdout, 'OK cross-project private-pool claim')): true
      finally:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              kubectl delete ipclaim -n "$NAMESPACE" mt-cross-private-denied --ignore-not-found=true >/dev/null 2>&1 || true
              echo "private-pool denial cleanup done"
            check:
              ($error == null): true

    - name: concurrent-claims-non-overlap
      description: |
        Apply 4 IPClaims simultaneously (2 from mt-alpha-pool, 2 from
        mt-beta-pool). All must reach Bound; all 4 allocatedCIDR values must be
        distinct. The two alpha CIDRs must be in 10.100.0.0/20, the two beta
        CIDRs in 10.101.0.0/20.
      try:
        - create:
            file: resources/concurrent-claims.yaml
        - script:
            timeout: 75s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              for i in $(seq 1 60); do
                count=$(kubectl get ipclaim -n "$NAMESPACE" -l mt-concurrent=true \
                  -o jsonpath='{.items[*].status.phase}' 2>/dev/null | tr ' ' '\n' | grep -c "^Bound$" || echo "0")
                if [ "$count" = "4" ]; then break; fi
                sleep 1
              done
              if [ "$count" != "4" ]; then
                echo "FAIL: only $count/4 concurrent claims Bound after 60s"
                exit 1
              fi
            check:
              ($error == null): true
        - script:
            timeout: 30s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              count=$(kubectl get ipclaim -n "$NAMESPACE" -l mt-concurrent=true \
                -o jsonpath='{.items[*].status.allocatedCIDR}' | tr ' ' '\n' | sort -u | wc -l | tr -d ' ')
              if [ "$count" != "4" ]; then
                echo "FAIL: expected 4 unique CIDRs, got $count"
                kubectl get ipclaim -n "$NAMESPACE" -l mt-concurrent=true \
                  -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.allocatedCIDR}{"\n"}{end}'
                exit 1
              fi

              for ns_label in alpha beta; do
                expected_prefix="10.100"
                if [ "$ns_label" = "beta" ]; then expected_prefix="10.101"; fi
                cidrs=$(kubectl get ipclaim -n "$NAMESPACE" -l mt-concurrent=true,mt-tenant=$ns_label \
                  -o jsonpath='{.items[*].status.allocatedCIDR}')
                for c in $cidrs; do
                  if ! echo "$c" | grep -qE "^${expected_prefix}\.[0-9]+\.[0-9]+/24$"; then
                    echo "FAIL: $ns_label CIDR $c not in ${expected_prefix}.0.0/20"
                    exit 1
                  fi
                done
              done
              echo "OK 4 concurrent claims unique and within their tenant pools"
            check:
              ($error == null): true
              (contains($stdout, 'OK 4 concurrent claims')): true

    - name: capacity-after-cross-project-release
      description: |
        Read mt-shared-pool capacity, delete the cross-project claim from the
        previous step, assert capacity.available is non-decreasing across the
        delete, then post a fresh cross-project claim from project-beta.
      try:
        - script:
            timeout: 90s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              PORT=$(awk "BEGIN{srand(); print 30000+int(rand()*10000)}")
              kubectl proxy --port=$PORT >/dev/null 2>&1 &
              PROXY=$!
              trap "kill $PROXY 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do
                curl -sf http://localhost:$PORT/api >/dev/null && break || sleep 0.25
              done

              before=$(kubectl get ippool mt-shared-pool -o jsonpath='{.status.capacity.available}' 2>/dev/null || echo "")
              echo "before_available=$before"

              if ! kubectl get ipclaim -n "$NAMESPACE" mt-cross-claim >/dev/null 2>&1; then
                echo "FAIL: mt-cross-claim missing — previous step should have allocated it"
                exit 1
              fi

              kubectl delete ipclaim -n "$NAMESPACE" mt-cross-claim --wait=true
              for i in $(seq 1 20); do
                after_del=$(kubectl get ippool mt-shared-pool -o jsonpath='{.status.capacity.available}' 2>/dev/null || echo "")
                if [ -n "$after_del" ] && [ -n "$before" ] && [ "$after_del" -ge "$before" ]; then
                  break
                fi
                sleep 0.5
              done
              echo "after_delete_available=$after_del"
              if [ -n "$before" ] && [ -n "$after_del" ] && [ "$after_del" -lt "$before" ]; then
                echo "FAIL: capacity decreased after delete ($before -> $after_del)"
                exit 1
              fi

              body='{"apiVersion":"ipam.miloapis.com/v1alpha1","kind":"IPClaim","metadata":{"name":"mt-cross-recheck","namespace":"'"$NAMESPACE"'","labels":{"mt-suite":"true"}},"spec":{"ipFamily":"IPv4","prefixLength":24,"poolRef":{"name":"mt-shared-pool","projectRef":{"name":"project-alpha"}},"reclaimPolicy":"Delete"}}'

              code=$(curl -s -o /tmp/mt-cross-recheck.json -w '%{http_code}' \
                -X POST http://localhost:$PORT/apis/ipam.miloapis.com/v1alpha1/namespaces/$NAMESPACE/ipclaims \
                -H "Content-Type: application/json" \
                -H "X-Remote-Extra-Iam.Miloapis.Com.Parent-Type: Project" \
                -H "X-Remote-Extra-Iam.Miloapis.Com.Parent-Name: project-beta" \
                -H "X-Remote-Extra-Iam.Miloapis.Com.Parent-Api-Group: resourcemanager.miloapis.com" \
                -d "$body")

              if [ "$code" != "201" ]; then
                echo "FAIL: expected 201 (shared pool with use grant), got $code"
                cat /tmp/mt-cross-recheck.json
                exit 1
              fi

              for i in $(seq 1 60); do
                phase=$(kubectl get ipclaim -n "$NAMESPACE" mt-cross-recheck -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [ "$phase" = "Bound" ]; then break; fi
                sleep 0.5
              done
              cidr=$(kubectl get ipclaim -n "$NAMESPACE" mt-cross-recheck -o jsonpath='{.status.allocatedCIDR}')
              if [ -z "$cidr" ]; then
                echo "FAIL: no CIDR allocated"
                exit 1
              fi
              if ! echo "$cidr" | grep -qE '^172\.20\.[0-9]+\.[0-9]+/24$'; then
                echo "FAIL: $cidr not in 172.20.0.0/20"
                exit 1
              fi
              echo "OK shared-pool re-claim succeeded with cidr=$cidr"
            check:
              ($error == null): true
              (contains($stdout, 'OK shared-pool re-claim succeeded')): true
      finally:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              kubectl delete ipclaim -n "$NAMESPACE" mt-cross-recheck --ignore-not-found=true >/dev/null 2>&1 || true
              kubectl delete ipclaim -n "$NAMESPACE" mt-alpha-claim --ignore-not-found=true >/dev/null 2>&1 || true
              kubectl delete ipclaim -n "$NAMESPACE" mt-beta-claim --ignore-not-found=true >/dev/null 2>&1 || true
              kubectl delete ipclaim -n "$NAMESPACE" mt-cross-claim --ignore-not-found=true >/dev/null 2>&1 || true
              echo "cleanup done"
            check:
              ($error == null): true

    # ------------------------------------------------------------------------
    # Cross-project /32 host-IP allocation via IPClaim — same multi-tenant
    # auth path against a separate shared host pool.
    # ------------------------------------------------------------------------

    - name: seed-cross-project-pools
      description: Create mt-host-shared-pool plus the ClusterRoleBinding for project-beta `use`.
      try:
        - create:
            file: resources/cross-project-pools.yaml
        - create:
            file: resources/cross-project-rbac.yaml
        - script:
            timeout: 45s
            content: |
              set -e
              for i in $(seq 1 30); do
                phase=$(kubectl get ippool mt-host-shared-pool \
                  -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [ "$phase" = "Ready" ]; then break; fi
                sleep 1
              done
              if [ "$phase" != "Ready" ]; then
                echo "FAIL: mt-host-shared-pool not Ready after 30s (phase=$phase)"
                exit 1
              fi
            check:
              ($error == null): true

    - name: cross-project-address-claim-beta-from-shared
      description: |
        Project beta posts an IPClaim with prefixLength: 32 against project-alpha's
        host pool (mt-host-shared-pool) carrying project-beta headers and
        poolRef.projectRef pointing at project-alpha. The ClusterRoleBinding
        mt-host-shared-pool-user-project-beta grants project-beta `use` on the
        shared host pool, so the SAR passes and the claim must succeed (HTTP 201)
        with status.allocatedCIDR being a /32 inside 172.21.0.0/29.
      try:
        - script:
            timeout: 60s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              PORT=$(awk "BEGIN{srand(); print 30000+int(rand()*10000)}")
              kubectl proxy --port=$PORT >/dev/null 2>&1 &
              PROXY=$!
              trap "kill $PROXY 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do
                curl -sf http://localhost:$PORT/api >/dev/null && break || sleep 0.25
              done

              body='{"apiVersion":"ipam.miloapis.com/v1alpha1","kind":"IPClaim","metadata":{"name":"mt-cross-addr-claim","namespace":"'"$NAMESPACE"'","labels":{"mt-suite":"true","mt-cross-addr":"true"}},"spec":{"ipFamily":"IPv4","prefixLength":32,"poolRef":{"name":"mt-host-shared-pool","projectRef":{"name":"project-alpha"}},"reclaimPolicy":"Delete"}}'

              code=$(curl -s -o /tmp/mt-cross-addr.json -w '%{http_code}' \
                -X POST http://localhost:$PORT/apis/ipam.miloapis.com/v1alpha1/namespaces/$NAMESPACE/ipclaims \
                -H "Content-Type: application/json" \
                -H "X-Remote-Extra-Iam.Miloapis.Com.Parent-Type: Project" \
                -H "X-Remote-Extra-Iam.Miloapis.Com.Parent-Name: project-beta" \
                -H "X-Remote-Extra-Iam.Miloapis.Com.Parent-Api-Group: resourcemanager.miloapis.com" \
                -d "$body")

              if [ "$code" != "201" ]; then
                echo "FAIL: expected 201 (shared host pool with use grant), got $code"
                cat /tmp/mt-cross-addr.json
                exit 1
              fi

              for i in $(seq 1 60); do
                phase=$(kubectl get ipclaim -n "$NAMESPACE" mt-cross-addr-claim -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [ "$phase" = "Bound" ]; then break; fi
                sleep 0.5
              done
              cidr=$(kubectl get ipclaim -n "$NAMESPACE" mt-cross-addr-claim -o jsonpath='{.status.allocatedCIDR}')
              if [ -z "$cidr" ]; then
                echo "FAIL: empty allocatedCIDR"
                exit 1
              fi
              if ! echo "$cidr" | grep -qE '^172\.21\.0\.[0-7]/32$'; then
                echo "FAIL: $cidr not a /32 inside 172.21.0.0/29"
                exit 1
              fi
              echo "OK cross-project address claim accepted (201), cidr=$cidr"
            check:
              ($error == null): true
              (contains($stdout, 'OK cross-project address claim accepted')): true
      finally:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              kubectl delete ipclaim -n "$NAMESPACE" mt-cross-addr-claim --ignore-not-found=true >/dev/null 2>&1 || true
              echo "address cross-project cleanup done"
            check:
              ($error == null): true
