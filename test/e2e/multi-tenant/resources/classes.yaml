apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPrefixClass
metadata:
  name: mt-consumer-private
spec:
  requiresVerification: false
  visibility: consumer
  defaultAllocation:
    minPrefixLength: 24
    maxPrefixLength: 28
    strategy: BestFit
---
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPrefixClass
metadata:
  name: mt-consumer-shared
spec:
  requiresVerification: false
  # Future value: 'shared'. Until the server validates that enum, use 'platform'
  # which is the closest existing semantic for a cross-project pool.
  # TODO: requires multi-tenant server implementation — flip to 'shared'.
  visibility: platform
  defaultAllocation:
    minPrefixLength: 24
    maxPrefixLength: 28
    strategy: BestFit
