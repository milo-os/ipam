apiVersion: ipam.miloapis.com/v1alpha1
kind: IPClaim
metadata:
  name: mt-concurrent-alpha-1
  namespace: ($namespace)
  labels:
    mt-suite: "true"
    mt-concurrent: "true"
spec:
  ipFamily: IPv4
  prefixLength: 24
  poolRef:
    name: mt-alpha-pool
  reclaimPolicy: Delete
---
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPClaim
metadata:
  name: mt-concurrent-alpha-2
  namespace: ($namespace)
  labels:
    mt-suite: "true"
    mt-concurrent: "true"
spec:
  ipFamily: IPv4
  prefixLength: 24
  poolRef:
    name: mt-alpha-pool
  reclaimPolicy: Delete
