# RBAC: lets project-beta `use` the cross-project IP host pool owned by project-alpha.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mt-host-shared-pool-user
rules:
  - apiGroups:
      - ipam.miloapis.com
    resources:
      - ipprefixes
    resourceNames:
      - mt-host-shared-pool
    verbs:
      - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mt-host-shared-pool-user-project-beta
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mt-host-shared-pool-user
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:project:project-beta
