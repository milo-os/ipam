# project-beta claims against project-alpha's SHARED pool. poolRef.projectRef
# points at the owning project; the `use` ClusterRoleBinding (rbac.yaml) lets
# the impersonated project-beta identity pass the cross-project SAR.
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPClaim
metadata:
  name: mt-cross-claim
  namespace: ($namespace)
  labels:
    mt-suite: "true"
    mt-cross: "true"
spec:
  ipFamily: IPv4
  prefixLength: 24
  poolRef:
    name: mt-shared-pool
    projectRef:
      name: project-alpha
  reclaimPolicy: Delete
