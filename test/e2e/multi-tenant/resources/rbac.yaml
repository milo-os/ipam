# Cross-project `use` grant for the shared-pool flow. The suite drives requests
# under Kubernetes impersonation: the impersonated project-beta identity carries
# the group system:project:project-beta, which this ClusterRoleBinding grants
# `use` on mt-shared-pool (owned by project-alpha). IPAM's cross-project claim
# path (internal/access.AuthorizeCrossProjectPrefix) runs a real `use`
# SubjectAccessReview, so this binding is what makes the cross-project shared
# claim succeed — and its absence for private pools is what makes the
# private-pool claim fail. resourceNames scopes the grant to mt-shared-pool only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mt-shared-pool-user
rules:
  - apiGroups:
      - ipam.miloapis.com
    resources:
      - ippools
    resourceNames:
      - mt-shared-pool
    verbs:
      - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mt-shared-pool-user-project-beta
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mt-shared-pool-user
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:project:project-beta
