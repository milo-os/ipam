apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pool-exhaustion
spec:
  description: |
    Pool exhaustion path:
    - Two IPClaims (prefixLength: 32) fill the /31 IPPool (2 host addresses)
    - Third claim returns HTTP 507 (Insufficient Storage)
    - Releasing one claim re-opens the slot

  steps:
    - name: setup-tiny-pool
      description: Create IPPool 192.168.0.0/31 (/32 only) — 2 addresses, exhausted after 2 claims
      try:
        - create:
            file: test-data/pool.yaml
        - script:
            timeout: 45s
            content: |
              set -e
              for i in $(seq 1 30); do
                phase=$(kubectl get ippool exhaust-pool \
                  -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [ "$phase" = "Ready" ]; then break; fi
                sleep 1
              done
              if [ "$phase" != "Ready" ]; then
                echo "FAIL: exhaust-pool not Ready after 30s (phase=$phase)"
                exit 1
              fi
            check:
              ($error == null): true

    - name: fill-pool
      description: Create two IPClaims (prefixLength 32); both must reach Bound
      try:
        - create:
            file: test-data/claim-1.yaml
        - create:
            file: test-data/claim-2.yaml
        - script:
            timeout: 45s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              for name in exhaust-claim-1 exhaust-claim-2; do
                for i in $(seq 1 30); do
                  phase=$(kubectl get ipclaim -n "$NAMESPACE" "$name" \
                    -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                  if [ "$phase" = "Bound" ]; then break; fi
                  sleep 1
                done
                if [ "$phase" != "Bound" ]; then
                  echo "FAIL: $name not Bound after 30s (phase=$phase)"
                  exit 1
                fi
              done
            check:
              ($error == null): true

    - name: third-claim-rejected-507
      description: |
        Third claim cannot be satisfied from the exhausted pool. Apply the
        claim and assert it reaches a non-Bound terminal condition with
        reason=PoolExhausted (works for both sync 507 and async reconciler).
      try:
        - apply:
            file: test-data/claim-3.yaml
        - script:
            timeout: 45s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              for i in $(seq 1 30); do
                reason=$(kubectl get ipclaim -n "$NAMESPACE" exhaust-claim-3 \
                  -o jsonpath='{.status.conditions[?(@.type=="Allocated")].reason}' 2>/dev/null || echo "")
                phase=$(kubectl get ipclaim -n "$NAMESPACE" exhaust-claim-3 \
                  -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [ "$reason" = "PoolExhausted" ]; then break; fi
                if [ "$phase" = "Bound" ]; then
                  echo "FAIL: exhaust-claim-3 became Bound against an exhausted pool"
                  exit 1
                fi
                sleep 1
              done
              if [ "$reason" != "PoolExhausted" ]; then
                echo "FAIL: exhaust-claim-3 Allocated condition reason=$reason (expected PoolExhausted) after 30s"
                exit 1
              fi
              echo "OK exhaust-claim-3 rejected with reason=PoolExhausted"
            check:
              ($error == null): true
      finally:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              kubectl delete ipclaim -n "$NAMESPACE" exhaust-claim-3 --ignore-not-found >/dev/null 2>&1 || true
            check:
              ($error == null): true

    - name: release-and-reallocate
      description: Delete first claim, then create third claim — succeeds
      try:
        - delete:
            ref:
              apiVersion: ipam.miloapis.com/v1alpha1
              kind: IPClaim
              name: exhaust-claim-1
              namespace: ($namespace)
        - error:
            file: assertions/assert-claim-1-deleted.yaml
        - create:
            file: test-data/claim-3.yaml
        - script:
            timeout: 45s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              for i in $(seq 1 30); do
                phase=$(kubectl get ipclaim -n "$NAMESPACE" exhaust-claim-3 \
                  -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [ "$phase" = "Bound" ]; then break; fi
                sleep 1
              done
              if [ "$phase" != "Bound" ]; then
                echo "FAIL: exhaust-claim-3 not Bound after 30s (phase=$phase)"
                exit 1
              fi
            check:
              ($error == null): true

      finally:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              kubectl delete ipclaim -n "$NAMESPACE" \
                exhaust-claim-1 exhaust-claim-2 exhaust-claim-3 --ignore-not-found >/dev/null 2>&1 || true
              kubectl delete ippool exhaust-pool --ignore-not-found >/dev/null 2>&1 || true
              echo "pool-exhaustion cleanup done"
            check:
              ($error == null): true
