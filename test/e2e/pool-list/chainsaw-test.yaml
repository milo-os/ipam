apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pool-list
spec:
  description: |
    LIST coverage for IPPool — regression guard for issue #54, where
    `kubectl get ippools` returned an empty list even though the pools existed
    and were fetchable by name.

    The underlying bug only manifests on a long-lived database whose changelog
    has been pruned past its retention window (the steady state on staging), so
    a fresh cluster cannot reproduce the empty-list failure. The deterministic
    detector is the Go integration test in internal/storage/postgres
    (TestGetList_ResourceVersionAfterChangelogPruned), which prunes the
    changelog explicitly and asserts the list resourceVersion — something a
    resource-level chainsaw assertion can't express. This suite is the
    end-to-end guard that the LIST path returns the pools that exist.
  steps:
    - name: create-pools
      description: Create three IPPools carrying the suite label.
      try:
        - create:
            file: test-data/pool-a.yaml
        - create:
            file: test-data/pool-b.yaml
        - create:
            file: test-data/pool-c.yaml

    - name: pools-ready-by-name
      description: |
        Each pool reaches Ready. A named assert is served by Get — the symptom
        was that by-name reads worked while the list was empty, so this is the
        baseline the list step is compared against. Chainsaw polls until Ready.
      try:
        - assert:
            file: assertions/pool-a-ready.yaml
        - assert:
            file: assertions/pool-b-ready.yaml
        - assert:
            file: assertions/pool-c-ready.yaml

    - name: pools-returned-by-list
      description: |
        Core #54 assertion. The assertion has no metadata.name, so chainsaw
        uses List — an empty list (the bug) fails here even though the Get-based
        step above passed.
      try:
        - assert:
            file: assertions/listed-by-label.yaml
