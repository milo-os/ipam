apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pool-overlap
spec:
  description: |
    Uniqueness test for IPClaim allocation:
    - 10 claims applied in a single apply block against the same IPPool
    - All must succeed with unique, non-overlapping /24 CIDRs

    NOTE: This suite validates UNIQUENESS of allocated CIDRs across a batch of
    claims posted via a single Chainsaw `create:` step. Chainsaw applies the
    manifests sequentially within that step, so this is not a true concurrency
    stress test of the `SELECT ... FOR UPDATE` lock — it confirms the
    allocator returns distinct, non-overlapping blocks across back-to-back
    requests. True concurrent contention (many parallel CREATEs hitting the
    same parent row) is covered by `test/load/concurrent-claims.js`.

  steps:
    - name: setup-pool
      description: Create IPPool 10.64.0.0/16, /24 only (256 possible /24s)
      try:
        - create:
            file: test-data/parent.yaml
        - script:
            timeout: 45s
            content: |
              set -e
              for i in $(seq 1 30); do
                phase=$(kubectl get ippool overlap-parent \
                  -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [ "$phase" = "Ready" ]; then break; fi
                sleep 1
              done
              if [ "$phase" != "Ready" ]; then
                echo "FAIL: overlap-parent not Ready after 30s (phase=$phase)"
                exit 1
              fi
            check:
              ($error == null): true

    - name: apply-10-claims-simultaneously
      description: Create 10 claims in a single apply block; all must reach Bound
      try:
        - create:
            file: test-data/claims-10.yaml
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            timeout: 120s
            content: |
              set -e
              for name in overlap-claim-1 overlap-claim-2 overlap-claim-3 overlap-claim-4 overlap-claim-5 \
                          overlap-claim-6 overlap-claim-7 overlap-claim-8 overlap-claim-9 overlap-claim-10; do
                for i in $(seq 1 60); do
                  phase=$(kubectl get ipclaim -n "$NAMESPACE" "$name" \
                    -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                  if [ "$phase" = "Bound" ]; then break; fi
                  sleep 1
                done
                if [ "$phase" != "Bound" ]; then
                  echo "FAIL: $name not Bound after 60s (phase=$phase)"
                  exit 1
                fi
              done
              echo "all 10 claims Bound"
            check:
              ($error == null): true
              (contains($stdout, 'all 10 claims Bound')): true

    - name: assert-unique-non-overlapping
      description: All 10 allocatedCIDR values must be unique /24s in 10.64.0.0/16; assert 10 IPAllocations
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              kubectl get ipclaim -n "$NAMESPACE" -l overlap-test=true \
                -o jsonpath='{.items[*].status.allocatedCIDR}' | tr ' ' '\n' | sort -u | awk 'END{print NR}'
            check:
              ($stdout): "10\n"
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              cidrs=$(kubectl get ipclaim -n "$NAMESPACE" -l overlap-test=true \
                -o jsonpath='{.items[*].status.allocatedCIDR}')
              for c in $cidrs; do
                if ! echo "$c" | grep -qE '^10\.64\.[0-9]+\.0/24$'; then
                  echo "FAIL: CIDR $c is not a /24 in 10.64.0.0/16"
                  exit 1
                fi
              done
              echo "OK: all 10 CIDRs are /24 within 10.64.0.0/16"
            check:
              ($stdout): "OK: all 10 CIDRs are /24 within 10.64.0.0/16\n"
        - script:
            timeout: 30s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              # Verify exactly 10 IPAllocation objects exist in the same namespace,
              # each pointing at overlap-parent.
              count=$(kubectl get ipallocation -n "$NAMESPACE" \
                -o jsonpath='{range .items[?(@.spec.poolRef.name=="overlap-parent")]}{.metadata.name}{"\n"}{end}' \
                | sort -u | grep -c . || true)
              if [ "$count" -ne 10 ]; then
                echo "FAIL: expected 10 IPAllocations for overlap-parent, got $count"
                exit 1
              fi
              echo "OK 10 IPAllocations found in namespace $NAMESPACE"
            check:
              ($error == null): true
              (contains($stdout, 'OK 10 IPAllocations found')): true

      finally:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              kubectl delete ipclaim -n "$NAMESPACE" -l overlap-test=true --ignore-not-found >/dev/null 2>&1 || true
              kubectl delete ippool overlap-parent --ignore-not-found >/dev/null 2>&1 || true
              echo "pool-overlap cleanup done"
            check:
              ($error == null): true
