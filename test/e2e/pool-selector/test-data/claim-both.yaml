---
# Negative-path: setting both poolRef and poolSelector must be rejected.
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPClaim
metadata:
  name: selector-claim-both
  namespace: ($namespace)
spec:
  ipFamily: IPv4
  prefixLength: 24
  poolRef:
    name: selector-pool-consumer-a
  poolSelector:
    matchLabels:
      environment: consumer
