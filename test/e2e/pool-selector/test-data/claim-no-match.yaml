---
# Negative-path claim: no pool carries environment=production, so this
# claim must be rejected with HTTP 400.
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPClaim
metadata:
  name: selector-claim-no-match
  namespace: ($namespace)
spec:
  ipFamily: IPv4
  prefixLength: 24
  poolSelector:
    matchLabels:
      environment: production
