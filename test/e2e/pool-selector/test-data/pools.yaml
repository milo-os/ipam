---
# Two pools share the consumer label so they're both candidates for a
# bare environment=consumer selector. The non-matching `environment=infra`
# pool exercises the negative path: a selector that names `consumer` must
# never resolve onto it even though it has plenty of free space.
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPool
metadata:
  name: selector-pool-consumer-a
  labels:
    environment: consumer
    region: us-west
spec:
  cidr: 10.200.0.0/20
  ipFamily: IPv4
  visibility: consumer
  allocation:
    minPrefixLength: 24
    maxPrefixLength: 28
    strategy: FirstFit
---
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPool
metadata:
  name: selector-pool-consumer-b
  labels:
    environment: consumer
    region: us-east
spec:
  cidr: 10.201.0.0/20
  ipFamily: IPv4
  visibility: consumer
  allocation:
    minPrefixLength: 24
    maxPrefixLength: 28
    strategy: FirstFit
---
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPool
metadata:
  name: selector-pool-infra
  labels:
    environment: infra
    region: us-west
spec:
  cidr: 10.202.0.0/20
  ipFamily: IPv4
  visibility: platform
  allocation:
    minPrefixLength: 24
    maxPrefixLength: 28
    strategy: FirstFit
