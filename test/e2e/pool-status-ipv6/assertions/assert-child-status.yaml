apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPool
metadata:
  name: ipv6-status-child
status:
  phase: Ready
  # FirstFit carves the first aligned /48 out of the parent /44.
  allocatedCIDR: 2001:db8:e2e0::/48
  # Child pools inherit no spec.ipFamily; the family is derived from the
  # carved CIDR and surfaced in status.
  ipFamily: IPv6
  # A freshly carved, empty /48 has its largest free block at the pool size.
  largestFreePrefix: 48
  utilizationPercent: 0
