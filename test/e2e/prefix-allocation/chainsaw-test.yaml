apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: prefix-allocation
spec:
  description: |
    Happy-path allocation tests for IPPrefixClaim:
    - Synchronous CIDR in status on Bound
    - Non-overlapping concurrent allocations
    - childPrefixTemplate atomic delegation
    - Release on delete and re-allocation

  steps:
    - name: setup-pool
      description: Create IPPrefixClass + parent IPPrefix (10.128.0.0/20, allow /24-/28)
      try:
        - create:
            file: test-data/class.yaml
        - create:
            file: test-data/parent-prefix.yaml
        - script:
            timeout: 45s
            content: |
              set -e
              for i in $(seq 1 30); do
                ready=$(kubectl get ipprefix alloc-parent \
                  -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "")
                if [ "$ready" = "True" ]; then break; fi
                sleep 1
              done
              if [ "$ready" != "True" ]; then
                echo "FAIL: alloc-parent not Ready after 30s"
                exit 1
              fi
            check:
              ($error == null): true

    - name: allocate-first-claim
      description: |
        Create IPPrefixClaim (prefixLength=24); assert /24 within parent and
        boundPrefixRef set. The shell follow-up additionally verifies — using
        Python's ipaddress module — that status.allocatedCIDR is actually a
        subnet of the parent pool CIDR, catching cases where the server might
        return a syntactically valid CIDR that lies outside the parent.
      try:
        - create:
            file: test-data/claim-first.yaml
        - script:
            timeout: 45s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              for i in $(seq 1 30); do
                phase=$(kubectl get ipprefixclaim -n "$NAMESPACE" alloc-claim-1 \
                  -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [ "$phase" = "Bound" ]; then break; fi
                sleep 1
              done
              if [ "$phase" != "Bound" ]; then
                echo "FAIL: alloc-claim-1 not Bound after 30s (phase=$phase)"
                exit 1
              fi
            check:
              ($error == null): true
        - assert:
            file: assertions/assert-claim-1-bound.yaml
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              allocated=$(kubectl get ipprefixclaim -n "$NAMESPACE" alloc-claim-1 -o jsonpath='{.status.allocatedCIDR}')
              pool=$(kubectl get ipprefix alloc-parent -o jsonpath='{.spec.cidr}')
              if [ -z "$allocated" ] || [ -z "$pool" ]; then
                echo "FAIL: missing allocated=$allocated pool=$pool"
                exit 1
              fi
              python3 -c "
              import ipaddress, sys
              child = ipaddress.ip_network('$allocated')
              parent = ipaddress.ip_network('$pool')
              if not child.subnet_of(parent):
                  print(f'FAIL: {child} not a subnet of {parent}')
                  sys.exit(1)
              print(f'OK {child} is a subnet of {parent}')
              "
            check:
              ($error == null): true
              (contains($stdout, 'OK ')): true

    - name: allocate-second-claim-non-overlap
      description: Second IPPrefixClaim (prefixLength=24) gets a non-overlapping /24
      try:
        - create:
            file: test-data/claim-second.yaml
        - script:
            timeout: 45s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              for i in $(seq 1 30); do
                phase=$(kubectl get ipprefixclaim -n "$NAMESPACE" alloc-claim-2 \
                  -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [ "$phase" = "Bound" ]; then break; fi
                sleep 1
              done
              if [ "$phase" != "Bound" ]; then
                echo "FAIL: alloc-claim-2 not Bound after 30s (phase=$phase)"
                exit 1
              fi
            check:
              ($error == null): true
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              kubectl get ipprefixclaim -n "$NAMESPACE" alloc-claim-1 alloc-claim-2 \
                -o jsonpath='{.items[*].status.allocatedCIDR}' | tr ' ' '\n' | sort -u | awk 'END{print NR}'
            check:
              ($stdout): "2\n"

    - name: allocate-with-create-child-prefix
      description: |
        Claim with childPrefixTemplate creates child IPPrefix atomically
        with parentRef. The shell follow-up additionally verifies the child
        IPPrefix's spec.cidr exactly matches the parent claim's
        status.allocatedCIDR — they must be the same CIDR, since the child
        is a delegation of the slot the claim allocated.
      try:
        - create:
            file: test-data/claim-with-child.yaml
        - script:
            timeout: 45s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              for i in $(seq 1 30); do
                phase=$(kubectl get ipprefixclaim -n "$NAMESPACE" alloc-claim-child \
                  -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [ "$phase" = "Bound" ]; then break; fi
                sleep 1
              done
              if [ "$phase" != "Bound" ]; then
                echo "FAIL: alloc-claim-child not Bound after 30s (phase=$phase)"
                exit 1
              fi
            check:
              ($error == null): true
        - script:
            timeout: 45s
            content: |
              set -e
              for i in $(seq 1 30); do
                ready=$(kubectl get ipprefix alloc-child-prefix \
                  -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "")
                if [ "$ready" = "True" ]; then break; fi
                sleep 1
              done
              if [ "$ready" != "True" ]; then
                echo "FAIL: alloc-child-prefix not Ready after 30s"
                exit 1
              fi
            check:
              ($error == null): true
        - assert:
            file: assertions/assert-child-prefix.yaml
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              claim_cidr=$(kubectl get ipprefixclaim -n "$NAMESPACE" alloc-claim-child -o jsonpath='{.status.allocatedCIDR}')
              child_cidr=$(kubectl get ipprefix alloc-child-prefix -o jsonpath='{.spec.cidr}')
              if [ -z "$claim_cidr" ] || [ -z "$child_cidr" ]; then
                echo "FAIL: missing claim_cidr=$claim_cidr child_cidr=$child_cidr"
                exit 1
              fi
              if [ "$claim_cidr" != "$child_cidr" ]; then
                echo "FAIL: child.spec.cidr ($child_cidr) != parent_claim.status.allocatedCIDR ($claim_cidr)"
                exit 1
              fi
              echo "OK child cidr matches parent claim allocatedCIDR=$child_cidr"
            check:
              ($error == null): true
              (contains($stdout, 'OK child cidr matches')): true

    - name: release-first-claim
      description: |
        Delete the first claim and verify the full lifecycle:
        1. Snapshot parent pool's status.capacity.available BEFORE delete.
        2. Delete the claim.
        3. Confirm the claim is gone.
        4. Assert parent pool's status.capacity.available has INCREASED by
           the claim's /24 worth of addresses (= 256), proving the released
           CIDR is no longer counted against the pool.
      try:
        - script:
            content: |
              set -e
              before=$(kubectl get ipprefix alloc-parent -o jsonpath='{.status.capacity.available}' 2>/dev/null || echo "")
              if [ -z "$before" ]; then
                echo "FAIL: parent pool has no status.capacity.available"
                exit 1
              fi
              echo "$before" > /tmp/alloc-parent-available-before
              echo "before_available=$before"
            check:
              ($error == null): true
        - delete:
            ref:
              apiVersion: ipam.miloapis.com/v1alpha1
              kind: IPPrefixClaim
              name: alloc-claim-1
              namespace: ($namespace)
        - error:
            file: assertions/assert-claim-1-deleted.yaml
        - script:
            content: |
              set -e
              before=$(cat /tmp/alloc-parent-available-before)
              # Allow the controller a moment to update pool capacity after
              # the release row is dropped from ipam_prefix_allocations.
              for i in $(seq 1 30); do
                after=$(kubectl get ipprefix alloc-parent -o jsonpath='{.status.capacity.available}' 2>/dev/null || echo "")
                if [ -n "$after" ] && [ "$after" -gt "$before" ]; then
                  break
                fi
                sleep 0.5
              done
              echo "after_available=$after (before=$before)"
              if [ -z "$after" ]; then
                echo "FAIL: parent pool capacity unreadable after release"
                exit 1
              fi
              if [ "$after" -le "$before" ]; then
                echo "FAIL: capacity.available did not increase after release ($before -> $after)"
                exit 1
              fi
              # The released claim was a /24 (256 addresses).
              expected=$(( before + 256 ))
              if [ "$after" -ne "$expected" ]; then
                echo "FAIL: capacity.available expected $expected after releasing /24 ($before + 256), got $after"
                exit 1
              fi
              echo "OK capacity available incremented from $before to $after after releasing /24"
            check:
              ($error == null): true
              (contains($stdout, 'OK capacity available incremented')): true

    - name: reallocate-after-release
      description: New claim succeeds; pool not exhausted
      try:
        - create:
            file: test-data/claim-reallocate.yaml
        - script:
            timeout: 45s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              for i in $(seq 1 30); do
                phase=$(kubectl get ipprefixclaim -n "$NAMESPACE" alloc-claim-reuse \
                  -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [ "$phase" = "Bound" ]; then break; fi
                sleep 1
              done
              if [ "$phase" != "Bound" ]; then
                echo "FAIL: alloc-claim-reuse not Bound after 30s (phase=$phase)"
                exit 1
              fi
            check:
              ($error == null): true
      finally:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              kubectl delete ipprefixclaim -n "$NAMESPACE" \
                alloc-claim-1 alloc-claim-2 alloc-claim-child alloc-claim-reuse --ignore-not-found >/dev/null 2>&1 || true
              kubectl delete ipprefix alloc-child-prefix alloc-parent --ignore-not-found >/dev/null 2>&1 || true
              kubectl delete ipprefixclass consumer-private --ignore-not-found >/dev/null 2>&1 || true
              echo "prefix-allocation cleanup done"
            check:
              ($error == null): true
