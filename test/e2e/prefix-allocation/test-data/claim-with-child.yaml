apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPrefixClaim
metadata:
  name: alloc-claim-child
  namespace: ($namespace)
spec:
  ipFamily: IPv4
  prefixLength: 24
  prefixRef:
    name: alloc-parent
  createChildPrefix: true
  childPrefixTemplate:
    metadata:
      name: alloc-child-prefix
    spec:
      classRef:
        name: consumer-private
      allocation:
        minPrefixLength: 28
        maxPrefixLength: 28
        strategy: FirstFit
  reclaimPolicy: Delete
