apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: prefix-exhaustion
spec:
  description: |
    Pool exhaustion path:
    - Two IPPrefixClaims (prefixLength: 32) fill the /31 pool (2 host addresses)
    - Third claim returns HTTP 507 (Insufficient Storage)
    - Releasing one claim re-opens the slot

  steps:
    - name: setup-tiny-pool
      description: Create class + IPPrefix (192.168.0.0/31, /32 only) — 2 addresses, pool exhausted after 2 claims
      try:
        - create:
            file: test-data/class.yaml
        - create:
            file: test-data/tiny-prefix.yaml
        - script:
            timeout: 45s
            content: |
              set -e
              for i in $(seq 1 30); do
                ready=$(kubectl get ipprefix exhaust-pool \
                  -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "")
                if [ "$ready" = "True" ]; then break; fi
                sleep 1
              done
              if [ "$ready" != "True" ]; then
                echo "FAIL: exhaust-pool not Ready after 30s"
                exit 1
              fi
            check:
              ($error == null): true

    - name: fill-pool
      description: Create two IPPrefixClaims (prefixLength 32); both must reach Bound
      try:
        - create:
            file: test-data/claim-1.yaml
        - create:
            file: test-data/claim-2.yaml
        - script:
            timeout: 45s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              for name in exhaust-claim-1 exhaust-claim-2; do
                for i in $(seq 1 30); do
                  phase=$(kubectl get ipprefixclaim -n "$NAMESPACE" "$name" \
                    -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                  if [ "$phase" = "Bound" ]; then break; fi
                  sleep 1
                done
                if [ "$phase" != "Bound" ]; then
                  echo "FAIL: $name not Bound after 30s (phase=$phase)"
                  exit 1
                fi
              done
            check:
              ($error == null): true

    - name: third-claim-rejected-507
      description: Third claim must fail with HTTP 507 (Insufficient Storage)
      try:
        - create:
            file: test-data/claim-3.yaml
            expect:
              - check:
                  ($error != null): true
                  (contains($error, '507') || contains($error, 'Insufficient Storage') || contains($error, 'pool exhausted')): true

    - name: release-and-reallocate
      description: Delete first claim, then create third claim — succeeds
      try:
        - delete:
            ref:
              apiVersion: ipam.miloapis.com/v1alpha1
              kind: IPPrefixClaim
              name: exhaust-claim-1
              namespace: ($namespace)
        - error:
            file: assertions/assert-claim-1-deleted.yaml
        - create:
            file: test-data/claim-3.yaml
        - script:
            timeout: 45s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              for i in $(seq 1 30); do
                phase=$(kubectl get ipprefixclaim -n "$NAMESPACE" exhaust-claim-3 \
                  -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [ "$phase" = "Bound" ]; then break; fi
                sleep 1
              done
              if [ "$phase" != "Bound" ]; then
                echo "FAIL: exhaust-claim-3 not Bound after 30s (phase=$phase)"
                exit 1
              fi
            check:
              ($error == null): true

      finally:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              kubectl delete ipprefixclaim -n "$NAMESPACE" \
                exhaust-claim-1 exhaust-claim-2 exhaust-claim-3 --ignore-not-found >/dev/null 2>&1 || true
              kubectl delete ipprefix exhaust-pool --ignore-not-found >/dev/null 2>&1 || true
              kubectl delete ipprefixclass exhaust-class --ignore-not-found >/dev/null 2>&1 || true
              echo "prefix-exhaustion cleanup done"
            check:
              ($error == null): true
