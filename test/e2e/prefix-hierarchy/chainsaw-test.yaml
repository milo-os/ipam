apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: prefix-hierarchy
spec:
  description: |
    Hierarchical delegation: environment -> region -> leaf.
    - childPrefixTemplate builds nested IPPrefix tree
    - Concurrent regional claims get non-overlapping blocks
    - Leaf claim against child resolves within child range
    - DELETE of regional IPPrefix is rejected with HTTP 409 while the
      leaf still has an active allocation against it.

    NOTE: This suite verifies DELETION-PROTECTION semantics, NOT cascade
    delete. An earlier draft of the spec described cascade-delete behavior
    (deleting a parent prefix terminates child allocations); the actual
    requirements doc
    (infra/docs/enhancements/ipam/README.md) does NOT call for cascade
    delete. The implemented and intentional design is deletion protection:
    a parent IPPrefix with active leaf claims is rejected on DELETE with
    HTTP 409 so operators must release child claims first. This avoids
    orphaning child allocations and matches the spec.

  steps:
    - name: create-environment-prefix
      description: Top-of-tree environment IPPrefix (10.128.0.0/9, allow /12-/16)
      try:
        - create:
            file: test-data/class.yaml
        - create:
            file: test-data/env-prefix.yaml
        - script:
            timeout: 45s
            content: |
              set -e
              for i in $(seq 1 30); do
                ready=$(kubectl get ipprefix hier-env \
                  -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "")
                if [ "$ready" = "True" ]; then break; fi
                sleep 1
              done
              if [ "$ready" != "True" ]; then
                echo "FAIL: hier-env not Ready after 30s"
                exit 1
              fi
            check:
              ($error == null): true

    - name: claim-region-1
      description: Claim regional block /12 with childPrefixTemplate; assert child IPPrefix exists
      try:
        - create:
            file: test-data/region-1-claim.yaml
        - script:
            timeout: 45s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              for i in $(seq 1 30); do
                phase=$(kubectl get ipprefixclaim -n "$NAMESPACE" hier-region-1-claim \
                  -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [ "$phase" = "Bound" ]; then break; fi
                sleep 1
              done
              if [ "$phase" != "Bound" ]; then
                echo "FAIL: hier-region-1-claim not Bound after 30s (phase=$phase)"
                exit 1
              fi
            check:
              ($error == null): true
        - script:
            timeout: 45s
            content: |
              set -e
              for i in $(seq 1 30); do
                ready=$(kubectl get ipprefix hier-region-1 \
                  -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "")
                if [ "$ready" = "True" ]; then break; fi
                sleep 1
              done
              if [ "$ready" != "True" ]; then
                echo "FAIL: hier-region-1 not Ready after 30s"
                exit 1
              fi
            check:
              ($error == null): true

    - name: claim-region-2-non-overlap
      description: Second regional /12 must be non-overlapping with first
      try:
        - create:
            file: test-data/region-2-claim.yaml
        - script:
            timeout: 45s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              for i in $(seq 1 30); do
                phase=$(kubectl get ipprefixclaim -n "$NAMESPACE" hier-region-2-claim \
                  -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [ "$phase" = "Bound" ]; then break; fi
                sleep 1
              done
              if [ "$phase" != "Bound" ]; then
                echo "FAIL: hier-region-2-claim not Bound after 30s (phase=$phase)"
                exit 1
              fi
            check:
              ($error == null): true
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              kubectl get ipprefixclaim -n "$NAMESPACE" hier-region-1-claim hier-region-2-claim \
                -o jsonpath='{.items[*].status.allocatedCIDR}' | tr ' ' '\n' | sort -u | awk 'END{print NR}'
            check:
              ($stdout): "2\n"

    - name: claim-leaf-against-child
      description: /24 claim against the child regional IPPrefix; CIDR within regional block
      try:
        - create:
            file: test-data/leaf-claim.yaml
        - script:
            timeout: 45s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              for i in $(seq 1 30); do
                phase=$(kubectl get ipprefixclaim -n "$NAMESPACE" hier-leaf-claim \
                  -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [ "$phase" = "Bound" ]; then break; fi
                sleep 1
              done
              if [ "$phase" != "Bound" ]; then
                echo "FAIL: hier-leaf-claim not Bound after 30s (phase=$phase)"
                exit 1
              fi
            check:
              ($error == null): true
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              # Verify the leaf claim's allocated CIDR is inside the regional
              # block (hier-region-1.spec.cidr). The plain-grep check used
              # elsewhere only confirms the address family / textual prefix;
              # this uses Python's ipaddress.subnet_of() for a strict
              # mathematical containment check.
              leaf_cidr=$(kubectl get ipprefixclaim -n "$NAMESPACE" hier-leaf-claim -o jsonpath='{.status.allocatedCIDR}')
              region_cidr=$(kubectl get ipprefix hier-region-1 -o jsonpath='{.spec.cidr}')
              if [ -z "$leaf_cidr" ] || [ -z "$region_cidr" ]; then
                echo "FAIL: missing CIDR (leaf=$leaf_cidr region=$region_cidr)"
                exit 1
              fi
              python3 -c "
              import ipaddress, sys
              leaf = ipaddress.ip_network('$leaf_cidr', strict=False)
              region = ipaddress.ip_network('$region_cidr', strict=False)
              if not leaf.subnet_of(region):
                  print(f'FAIL: leaf {leaf} is NOT a subnet of region {region}', file=sys.stderr)
                  sys.exit(1)
              print(f'OK leaf {leaf} ⊂ region {region}')
              "
            check:
              ($error == null): true
              (contains($stdout, 'OK leaf')): true

    - name: deletion-protected-while-leaf-bound
      description: |
        Deleting the regional IPPrefix while the leaf claim still holds an
        allocation against it must fail with HTTP 409 ("active allocation").

        Rationale: Deletion protection prevents orphaned child allocations;
        operators must release child claims before deleting a parent
        prefix. This is intentional design (not cascade delete).
      try:
        - script:
            content: |
              out=$(kubectl delete ipprefix hier-region-1 2>&1) && status=0 || status=$?
              echo "$out"
              if [ "$status" -eq 0 ]; then
                echo "expected delete to fail, but it succeeded" >&2
                exit 1
              fi
              echo "$out" | grep -qi 'active allocation'
            check:
              ($error == null): true
      finally:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              # Release the leaf allocation first, then delete child prefixes.
              # Without this, hier-region-1 is deletion-protected by the leaf claim.
              kubectl delete ipprefixclaim -n "$NAMESPACE" hier-leaf-claim --ignore-not-found=true
              kubectl delete ipprefix hier-region-1 --ignore-not-found=true
              kubectl delete ipprefix hier-region-2 --ignore-not-found=true
              # Cluster-scoped top-of-tree prefix and class created in
              # create-environment-prefix are not cleaned up anywhere else.
              kubectl delete ipprefix hier-env --ignore-not-found=true
              kubectl delete ipprefixclass platform-shared --ignore-not-found=true
              echo "hierarchy child prefix cleanup done"
            check:
              ($error == null): true
