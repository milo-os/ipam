---
# Negative-path: setting both prefixRef and prefixSelector must be rejected.
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPPrefixClaim
metadata:
  name: selector-claim-both
  namespace: ($namespace)
spec:
  ipFamily: IPv4
  prefixLength: 24
  prefixRef:
    name: selector-pool-consumer-a
  prefixSelector:
    matchLabels:
      environment: consumer
