apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: prefix-validation
spec:
  description: |
    End-to-end tests for IPPrefix and IPPrefixClaim validation:
    - Required field validation (cidr)
    - CIDR format validation
    - prefixLength bounds (min/max from parent)
    - Immutability of spec.cidr and spec.ipFamily
    - Mutability of spec.allocation.strategy

  steps:
    - name: create-valid-prefix
      description: Create a valid IPPrefixClass + IPPrefix; assert Ready condition and canonical CIDR
      try:
        - create:
            file: test-data/valid-class.yaml
        - create:
            file: test-data/valid-prefix.yaml
        - script:
            timeout: 45s
            content: |
              set -e
              for i in $(seq 1 30); do
                ready=$(kubectl get ipprefix test-valid-prefix \
                  -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "")
                if [ "$ready" = "True" ]; then break; fi
                sleep 1
              done
              if [ "$ready" != "True" ]; then
                echo "FAIL: test-valid-prefix not Ready after 30s"
                exit 1
              fi
            check:
              ($error == null): true
        - assert:
            file: assertions/assert-valid-prefix.yaml

    - name: missing-cidr-field
      description: IPPrefix missing spec.cidr is rejected at admission
      try:
        - create:
            file: test-data/missing-cidr.yaml
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'cidr')): true

    - name: invalid-cidr-format
      description: IPPrefix with malformed CIDR string is rejected
      try:
        - create:
            file: test-data/invalid-cidr.yaml
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'invalid CIDR')): true

    - name: claim-prefix-length-out-of-bounds
      description: |
        IPPrefixClaim asks for prefixLength=16 against a /20 parent. The
        allocator's FindFirstAvailableBlock skips parents where
        prefixLen < parent_ones, so no candidate fits and the request is
        rejected with HTTP 507 "prefix pool exhausted". Match the actual
        server error string so this assertion fails loudly if the message
        ever changes (rather than silently passing on any error).
      try:
        - create:
            file: test-data/claim-out-of-bounds.yaml
            expect:
              - check:
                  ($error != null): true
                  (contains($error, '507') || contains($error, 'Insufficient Storage') || contains($error, 'pool exhausted')): true

    - name: claim-prefix-length-zero
      description: IPPrefixClaim with prefixLength=0 is rejected
      try:
        - create:
            file: test-data/claim-zero-length.yaml
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'prefixLength')): true

    - name: immutable-cidr
      description: Patching IPPrefix.spec.cidr is rejected (immutable)
      try:
        - patch:
            file: test-data/patch-cidr.yaml
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'spec.cidr is immutable')): true

    - name: immutable-ip-family
      description: Patching IPPrefix.spec.ipFamily is rejected (immutable)
      try:
        - patch:
            file: test-data/patch-ip-family.yaml
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'spec.ipFamily is immutable')): true

    - name: update-mutable-strategy
      description: Patching spec.allocation.strategy succeeds; assert updated value
      try:
        - patch:
            file: test-data/patch-strategy.yaml
        - assert:
            file: assertions/assert-updated-strategy.yaml

      finally:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              # Negative-path test-data targets (claims/prefixes that should
              # have been rejected) are also cleaned up best-effort in case
              # the server unexpectedly accepted them.
              kubectl delete ipprefixclaim -n "$NAMESPACE" \
                claim-out-of-bounds claim-zero-length --ignore-not-found >/dev/null 2>&1 || true
              kubectl delete ipprefix \
                test-valid-prefix test-missing-cidr test-invalid-cidr --ignore-not-found >/dev/null 2>&1 || true
              kubectl delete ipprefixclass validation-class --ignore-not-found >/dev/null 2>&1 || true
              echo "prefix-validation cleanup done"
            check:
              ($error == null): true
