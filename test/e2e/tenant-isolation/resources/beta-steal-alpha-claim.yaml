# project-beta tries to claim iso-pool-alpha by name (no projectRef), i.e. beta
# looking for the pool in its OWN scope. The pool does not exist in beta's
# tenant prefix, so the create must be rejected.
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPClaim
metadata:
  name: iso-beta-steal-alpha
  namespace: ($namespace)
  labels:
    iso-suite: "true"
spec:
  ipFamily: IPv4
  prefixLength: 24
  poolRef:
    name: iso-pool-alpha
  reclaimPolicy: Delete
