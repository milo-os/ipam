apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tracing
spec:
  description: |
    End-to-end trace export assertion. Drives a single platform-scope IPClaim
    allocation through the IPAM apiserver and proves the OpenTelemetry export
    pipeline works: the apiserver's OTLP exporter ships the ipam.claim.allocate
    span (and its children) to the cluster's existing collector, Grafana Tempo
    (telemetry-system namespace). The suite then queries Tempo's TraceQL search
    API and asserts a trace carrying the ipam.claim.allocate span exists.

    Requires the test-infra overlay, which enables the `tracing` component
    (--tracing-config-file, 100% sampling, endpoint -> Tempo on :4317) and opens
    egress from the apiserver to telemetry-system on :4317.

    Tempo must already be running before the IPAM apiserver starts, so the
    apiserver's OTLP exporter connects to a live collector. In CI the e2e job
    deploys Tempo (telemetry-system) ahead of the IPAM service; without a
    running Tempo this suite will fail.

  steps:
    - name: setup-pool
      description: Create a platform-scope root IPPool and wait for Ready.
      try:
        - create:
            file: test-data/pool.yaml
        - script:
            timeout: 45s
            content: |
              set -e
              for i in $(seq 1 30); do
                phase=$(kubectl get ippool trace-parent \
                  -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [ "$phase" = "Ready" ]; then break; fi
                sleep 1
              done
              if [ "$phase" != "Ready" ]; then
                echo "FAIL: trace-parent not Ready after 30s (phase=$phase)"
                exit 1
              fi
              echo "OK trace-parent Ready"
            check:
              ($error == null): true
              (contains($stdout, 'OK trace-parent Ready')): true

    - name: allocate-claim
      description: Create an IPClaim and assert it binds (allocatedCIDR set).
      try:
        - create:
            file: test-data/claim.yaml
        - script:
            timeout: 45s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -e
              for i in $(seq 1 30); do
                phase=$(kubectl get ipclaim -n "$NAMESPACE" trace-claim \
                  -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [ "$phase" = "Bound" ]; then break; fi
                sleep 1
              done
              cidr=$(kubectl get ipclaim -n "$NAMESPACE" trace-claim \
                -o jsonpath='{.status.allocatedCIDR}' 2>/dev/null || echo "")
              if [ "$phase" != "Bound" ] || [ -z "$cidr" ]; then
                echo "FAIL: trace-claim not Bound with a CIDR (phase=$phase cidr=$cidr)"
                exit 1
              fi
              echo "OK trace-claim Bound cidr=$cidr"
            check:
              ($error == null): true
              (contains($stdout, 'OK trace-claim Bound')): true

    - name: assert-span-in-tempo
      description: |
        Query Tempo's TraceQL search API for a trace carrying the
        ipam.claim.allocate span and assert the returned `traces` array is
        non-empty. The query runs from inside the cluster (an ephemeral
        curl pod) so it can reach the in-cluster Tempo Service.

        OTLP export is async (batched/scheduled) and Tempo ingestion lags
        (spans must flush from the WAL into a searchable block), so we poll
        generously — up to ~90s — before failing.
      try:
        - script:
            timeout: 120s
            content: |
              set -e
              # {name="ipam.claim.allocate"} urlencoded.
              QUERY='%7Bname%3D%22ipam.claim.allocate%22%7D'
              URL="http://telemetry-system-tempo.telemetry-system.svc.cluster.local:3100/api/search?q=${QUERY}&limit=20"
              for i in $(seq 1 30); do
                body=$(kubectl run tempo-search-${RANDOM} \
                  --rm -i --restart=Never --quiet \
                  --image=curlimages/curl:8.10.1 \
                  -n telemetry-system -- \
                  curl -s "$URL" 2>/dev/null || echo "")
                # Strip any kubectl run noise; keep the JSON line(s).
                echo "attempt $i: $body"
                # Tempo returns {"traces":[...]} on a hit, {"traces":[]} or
                # {} when nothing is indexed yet. A hit contains a traceID.
                if echo "$body" | grep -q '"traceID"'; then
                  echo "OK Tempo returned a trace for ipam.claim.allocate"
                  exit 0
                fi
                sleep 3
              done
              echo "FAIL: no ipam.claim.allocate trace in Tempo after ~90s"
              exit 1
            check:
              ($error == null): true
              (contains($stdout, 'OK Tempo returned a trace for ipam.claim.allocate')): true
      finally:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              kubectl delete ipclaim -n "$NAMESPACE" trace-claim --ignore-not-found >/dev/null 2>&1 || true
              kubectl delete ippool trace-parent --ignore-not-found >/dev/null 2>&1 || true
              echo "tracing cleanup done"
            check:
              ($error == null): true
