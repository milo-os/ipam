version: '3'

# k6 load tests. The interface other jobs depend on (target names, variables,
# exit codes) is documented in test/load/README.md; keep the two in step.
#
# Every script reads its configuration from environment variables. Variables
# given to task (`task throughput VUS=50`) or exported in the shell
# (`VUS=50 task throughput`) both reach k6: the env block below forwards the
# task vars, and k6 sees the rest of the process environment as well.

vars:
  ROOT_DIR: '{{.TASKFILE_DIR}}/../..'
  K6_SRC_DIR: '{{.ROOT_DIR}}/test/load/src'
  RESULTS_DIR: '{{.RESULTS_DIR | default (print .ROOT_DIR "/test/load/results")}}'
  KUBECONFIG: '{{.KUBECONFIG | default (print .ROOT_DIR "/.test-infra/kubeconfig")}}'
  PROXY_PORT: '{{.PROXY_PORT | default "8001"}}'
  COMPONENT_DIR: '{{.ROOT_DIR}}/config/components/k6-performance-tests'
  # What `task ci` runs, in order, between setup and cleanup.
  CI_SUITE: '{{.CI_SUITE | default "throughput class-chain exhaustion reads"}}'

env:
  IPAM_API_URL: '{{.IPAM_API_URL}}'
  IPAM_TENANCY: '{{.IPAM_TENANCY}}'
  IPAM_TOKEN: '{{.IPAM_TOKEN}}'
  IPAM_TOKEN_FILE: '{{.IPAM_TOKEN_FILE}}'
  IPAM_IMPERSONATE_USER: '{{.IPAM_IMPERSONATE_USER}}'
  IPAM_IMPERSONATE_GROUP: '{{.IPAM_IMPERSONATE_GROUP}}'
  PROJECTS: '{{.PROJECTS}}'
  PROJECT_PREFIX: '{{.PROJECT_PREFIX}}'
  PROJECT_COUNT: '{{.PROJECT_COUNT}}'
  NAMESPACE_PREFIX: '{{.NAMESPACE_PREFIX}}'
  NAMESPACE_COUNT: '{{.NAMESPACE_COUNT}}'
  CREATE_NAMESPACES: '{{.CREATE_NAMESPACES}}'
  DELETE_NAMESPACES: '{{.DELETE_NAMESPACES}}'
  VUS: '{{.VUS}}'
  DURATION: '{{.DURATION}}'
  CASES: '{{.CASES}}'
  K6_INSECURE_SKIP_TLS_VERIFY: '{{.K6_INSECURE_SKIP_TLS_VERIFY}}'
  QUOTA_ON: '{{.QUOTA_ON}}'
  # Per-script knobs (see each script's header).
  CLAIM_PREFIX_LENGTH: '{{.CLAIM_PREFIX_LENGTH}}'
  FLAT_CIDR: '{{.FLAT_CIDR}}'
  CHAIN_CIDR: '{{.CHAIN_CIDR}}'
  STEADY_NETWORKS: '{{.STEADY_NETWORKS}}'
  LOCATIONS: '{{.LOCATIONS}}'
  PRUNE_POOLS: '{{.PRUNE_POOLS}}'
  CHAIN_STEADY_P95_MS: '{{.CHAIN_STEADY_P95_MS}}'
  CHAIN_FIRST_P95_MS: '{{.CHAIN_FIRST_P95_MS}}'
  EXHAUST_CIDR: '{{.EXHAUST_CIDR}}'
  READ_VUS: '{{.READ_VUS}}'
  SPIKE_DURATION: '{{.SPIKE_DURATION}}'
  READ_CLAIMS: '{{.READ_CLAIMS}}'
  PREFIX_STEPS: '{{.PREFIX_STEPS}}'
  FILL_PCT: '{{.FILL_PCT}}'
  SAMPLES: '{{.SAMPLES}}'
  MAX_DEPTH_RATIO: '{{.MAX_DEPTH_RATIO}}'
  SCALE_CIDR: '{{.SCALE_CIDR}}'
  SCALE_PROJECT: '{{.SCALE_PROJECT}}'
  FILL_BATCH: '{{.FILL_BATCH}}'
  SETUP_TIMEOUT: '{{.SETUP_TIMEOUT}}'
  TEARDOWN_TIMEOUT: '{{.TEARDOWN_TIMEOUT}}'
  MAX_DURATION: '{{.MAX_DURATION}}'

tasks:
  default:
    desc: List load test tasks
    cmds:
      - task --list
    silent: true

  validate:
    desc: Lint all k6 scripts with k6 inspect
    silent: true
    cmds:
      - |
        set -e
        if ! command -v k6 >/dev/null 2>&1; then
          echo "ERROR: k6 not installed. brew install k6 (macOS) or see https://k6.io/docs/get-started/installation/" >&2
          exit 1
        fi
        for f in {{.K6_SRC_DIR}}/*.js; do
          name=$(basename "$f")
          if k6 inspect "$f" >/dev/null 2>&1; then
            echo "  ok  $name"
          else
            echo "  FAIL $name"
            k6 inspect "$f"
            exit 1
          fi
        done

  verify-generated:
    desc: Fail if config/components/k6-performance-tests/generated/ is stale against test/load/
    silent: true
    cmds:
      - |
        set -e
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        ROOT_DIR={{.ROOT_DIR}} DEST_DIR="$tmp" {{.ROOT_DIR}}/hack/bundle-k6.sh >/dev/null
        if ! diff -r "$tmp" {{.COMPONENT_DIR}}/generated >/dev/null; then
          diff -r "$tmp" {{.COMPONENT_DIR}}/generated | head -40
          echo "generated k6 bundles are stale: run task test/load:generate" >&2
          exit 1
        fi
        echo "generated k6 bundles are current"

  generate:
    desc: Bundle k6 scripts and refresh the kustomize component
    silent: true
    cmds:
      - ROOT_DIR={{.ROOT_DIR}} {{.ROOT_DIR}}/hack/bundle-k6.sh
      - |
        echo ""
        echo "Validating bundled scripts..."
        for f in {{.COMPONENT_DIR}}/generated/*.js; do
          name=$(basename "$f")
          if k6 inspect "$f" >/dev/null 2>&1; then
            echo "  ok  $name"
          else
            echo "  FAIL $name"
            k6 inspect "$f"
            exit 1
          fi
        done

  # ----- Running from a workstation or CI runner -----

  rbac:
    desc: Grant the impersonated load-test user (ipam-perf-tester) its IPAM RBAC
    silent: true
    cmds:
      - KUBECONFIG={{.KUBECONFIG}} kubectl apply -f {{.COMPONENT_DIR}}/tenant-rbac.yaml

  proxy:
    desc: Run kubectl proxy in foreground (IPAM_API_URL defaults to it)
    cmds:
      - KUBECONFIG={{.KUBECONFIG}} kubectl proxy --port={{.PROXY_PORT}}

  setup:
    desc: 'Provision classes, root pools and namespaces in every project. Vars: PROJECT_COUNT|PROJECTS, NAMESPACE_COUNT'
    silent: true
    cmds:
      - mkdir -p {{.RESULTS_DIR}}
      - k6 run --summary-export={{.RESULTS_DIR}}/setup.json {{.K6_SRC_DIR}}/setup-pools.js

  throughput:
    desc: 'Flat IPv4 claim throughput (p95 < 500ms, success > 0.95). Vars: VUS, DURATION'
    silent: true
    cmds:
      - mkdir -p {{.RESULTS_DIR}}
      - k6 run --summary-export={{.RESULTS_DIR}}/throughput.json {{.K6_SRC_DIR}}/prefix-claim-throughput.js

  class-chain:
    desc: 'Claim throughput through the vpc -> subnet -> endpoint chain, steady and first-claim cases. Vars: VUS, DURATION (per case), CASES'
    silent: true
    cmds:
      - mkdir -p {{.RESULTS_DIR}}
      - k6 run --summary-export={{.RESULTS_DIR}}/class-chain.json {{.K6_SRC_DIR}}/class-chain-claim-throughput.js

  exhaustion:
    desc: 'Deny-path latency against a full pool (507 p95 < 200ms). Vars: VUS, DURATION'
    silent: true
    cmds:
      - mkdir -p {{.RESULTS_DIR}}
      - k6 run --summary-export={{.RESULTS_DIR}}/exhaustion.json {{.K6_SRC_DIR}}/pool-exhaustion.js

  reads:
    desc: 'Read-path latency, steady + ramp + spike (prefix list p95 < 200ms). Vars: DURATION'
    silent: true
    cmds:
      - mkdir -p {{.RESULTS_DIR}}
      - k6 run --summary-export={{.RESULTS_DIR}}/reads.json {{.K6_SRC_DIR}}/read-latency.js

  scale:
    desc: 'Create latency against pool density, /20 to /28. Vars: PREFIX_STEPS, SCALE_CIDR, SAMPLES'
    silent: true
    cmds:
      - mkdir -p {{.RESULTS_DIR}}
      - k6 run --summary-export={{.RESULTS_DIR}}/scale.json {{.K6_SRC_DIR}}/pool-scale.js

  cleanup:
    desc: 'Delete every load-test claim, pool, class and namespace in every project'
    silent: true
    cmds:
      - k6 run {{.K6_SRC_DIR}}/cleanup.js

  ci:
    desc: 'setup, then each test in CI_SUITE, then cleanup. Runs every test even if one fails; exits non-zero if any did'
    silent: true
    cmds:
      - |
        failed=""
        if ! task -x -t {{.TASKFILE}} setup RESULTS_DIR={{.RESULTS_DIR}}; then
          echo "setup failed; not running the suite" >&2
          task -t {{.TASKFILE}} cleanup || true
          exit 1
        fi
        for t in {{.CI_SUITE}}; do
          echo "=== $t"
          task -x -t {{.TASKFILE}} "$t" RESULTS_DIR={{.RESULTS_DIR}} || failed="$failed $t(exit $?)"
        done
        task -t {{.TASKFILE}} cleanup || echo "cleanup failed (not counted as a test failure)" >&2
        if [ -n "$failed" ]; then
          echo "FAILED:$failed" >&2
          exit 1
        fi
        echo "all passed: {{.CI_SUITE}}"

  # ----- In-cluster k6 operator workflow -----

  k6:install-operator:
    desc: Install the k6 operator into the cluster (one-time setup)
    silent: true
    cmds:
      - |
        set -e
        echo "Installing k6 operator..."
        KUBECONFIG={{.KUBECONFIG}} kubectl apply --server-side -f https://raw.githubusercontent.com/grafana/k6-operator/main/bundle.yaml
        KUBECONFIG={{.KUBECONFIG}} kubectl wait --for=condition=Available deployment/k6-operator-controller-manager -n k6-operator-system --timeout=120s

  k6:apply:
    desc: Apply the k6 performance tests component (scripts ConfigMap + RBAC) to the running cluster
    silent: true
    cmds:
      - |
        kustomize build {{.COMPONENT_DIR}}/ \
          | KUBECONFIG={{.KUBECONFIG}} kubectl apply -n ipam-system -f -

  k6:run:
    desc: 'Trigger a single TestRun. Var: TEST=setup|throughput|class-chain|exhaustion|reads|scale|cleanup'
    silent: true
    cmds:
      - |
        set -e
        TEST="{{.TEST | default "throughput"}}"
        case "$TEST" in
          setup|throughput|class-chain|exhaustion|reads|scale|cleanup) ;;
          *) echo "ERROR: TEST must be one of: setup, throughput, class-chain, exhaustion, reads, scale, cleanup" >&2; exit 1 ;;
        esac
        KUBECONFIG={{.KUBECONFIG}} kubectl delete testrun.k6.io/ipam-perf-${TEST} -n ipam-system --ignore-not-found
        KUBECONFIG={{.KUBECONFIG}} kubectl apply -f {{.COMPONENT_DIR}}/testruns/${TEST}.yaml
        echo ""
        echo "TestRun ipam-perf-${TEST} created. Watch progress with:"
        echo "  kubectl get testrun -n ipam-system -w"
        echo "  kubectl logs -n ipam-system -l k6_cr=ipam-perf-${TEST} -f"

  k6:logs:
    desc: 'Tail logs from a TestRun. Var: TEST=setup|throughput|class-chain|exhaustion|reads|scale|cleanup'
    silent: true
    cmds:
      - |
        TEST="{{.TEST | default "throughput"}}"
        KUBECONFIG={{.KUBECONFIG}} kubectl logs -n ipam-system -l k6_cr=ipam-perf-${TEST} -f --tail=200
