  cleanup:
    desc: 'Remove the flat class fixtures, their claims, and the perf namespaces. Var: PROJECT_COUNT'
    silent: true
    cmds:
      - |
        set -euo pipefail

        # KUBECONFIG exported once, every command a plain `kubectl`, no eval.
        # See the long note in cascade-cleanup: building a command string and
        # running it through `xargs eval` silently deletes nothing, because
        # eval is a shell builtin and xargs execs a binary.
        export KUBECONFIG="{{.KUBECONFIG}}"

        # Prove the cluster is reachable BEFORE claiming to have cleaned it.
        if ! kubectl version --request-timeout=10s >/dev/null 2>&1; then
          echo "ERROR: cannot reach the cluster (KUBECONFIG=${KUBECONFIG})." >&2
          echo "  Nothing was deleted. Refusing to report success for work that" >&2
          echo "  did not happen." >&2
          exit 1
        fi

        # THE CATALOG IS IN THE PLATFORM PROJECT, AND A PLAIN KUBECONFIG CANNOT
        # SEE IT (#65, #84).
        #
        # Since platform-as-a-project there is no unprefixed keyspace. The
        # IPClass catalog and the pools backing it live in the project named by
        # --platform-project, and a caller is the platform only if it carries
        # iam.miloapis.com/parent-name. An ordinary kubeconfig carries no
        # parent, so it has no keyspace and lists ZERO classes and ZERO pools.
        #
        # That is exactly what this task did after #65 landed: it derived the
        # right names, issued deletes that matched nothing, counted zero
        # survivors through the same blind client, and printed "cleanup
        # complete". Measured: 9 classes and 8 pools in the database, 0 and 0
        # through the API, success reported. A cleanup that cannot see what it
        # is deleting reports the same thing whether it worked or did nothing.
        #
        # gen-platform-kubeconfig.sh emits a kubeconfig whose context
        # impersonates the platform project. e2e-platform-operator is bound to
        # cluster-admin, so the same context also does the ordinary Kubernetes
        # work below (namespaces, RBAC).
        PLATFORM_KUBECONFIG="$(mktemp -t ipam-platform-kubeconfig.XXXXXX)"
        trap 'rm -f "${PLATFORM_KUBECONFIG}"' EXIT
        if ! sh "{{.ROOT_DIR}}/test/e2e/lib/gen-platform-kubeconfig.sh" "${PLATFORM_KUBECONFIG}" >/dev/null 2>&1; then
          echo "ERROR: could not generate a platform-impersonating kubeconfig." >&2
          echo "  Nothing was deleted. Without it this task is blind to the" >&2
          echo "  catalog and would report success having deleted nothing." >&2
          exit 1
        fi
        # Verify the instrument before trusting it: the generated config must
        # actually carry the parent-name extra. A kubeconfig that silently lost
        # it looks identical to one that works, right up to the empty result.
        if ! grep -q 'iam.miloapis.com/parent-name' "${PLATFORM_KUBECONFIG}"; then
          echo "ERROR: the generated kubeconfig carries no parent-name extra," >&2
          echo "  so it is not the platform and cannot see the catalog." >&2
          exit 1
        fi
        export KUBECONFIG="${PLATFORM_KUBECONFIG}"

        # The fixture names come from lib/fixtures.js and are listed ONCE here.
        # Keep the two in step: a pool missing from this list survives cleanup,
        # holds its allocations, and quietly changes what the next run measures.
        # DERIVED from lib/fixtures.js via `task load:fixture-names`, never typed
        # here. The catalog's header has always said the list was derived; for a
        # while that was false and the list was hand-maintained, which is worse
        # than saying nothing because it stopped the next person checking. It
        # stayed in sync only because whoever added perf-shared-v4 read this file
        # anyway. A fixture added without touching this task would have survived
        # cleanup and silently changed the next run's numbers.
        #
        # A container class contributes a class and no pool — it has no poolName
        # in the catalog, so that falls out of the derivation rather than needing
        # a special case here.
        CLASSES=$(task -t "{{.ROOT_DIR}}/test/load/Taskfile.yaml" fixture-names WHAT=classes)
        POOLS=$(task -t "{{.ROOT_DIR}}/test/load/Taskfile.yaml" fixture-names WHAT=pools)
        if [ -z "$CLASSES" ] || [ -z "$POOLS" ]; then
          echo "ERROR: could not derive fixture names from lib/fixtures.js." >&2
          echo "  Nothing was deleted. Refusing to run a cleanup over an empty" >&2
          echo "  list — it would delete nothing and report success." >&2
          exit 1
        fi
        echo "==> deriving from lib/fixtures.js: $(echo $CLASSES | wc -w | tr -d ' ') class(es), $(echo $POOLS | wc -w | tr -d ' ') pool(s)"

        # Count what is VISIBLE before deleting anything. "Deleted nothing
        # because it was already clean" and "deleted nothing because I cannot
        # see it" produce identical output otherwise, and the second is the bug
        # this task shipped with.
        # COUNT THE THING YOU ARE ABOUT TO ASSERT ABOUT. This counter decides
        # whether the run reports "nothing was visible to delete", and the task
        # deletes CLAIMS as well as classes and pools — so omitting claims makes
        # the control blind to exactly one of the three kinds it acts on. That
        # is #84 in miniature, inside #84's own fix. Not theoretical: an
        # unimpersonated `kubectl get ipclaim -A` returned 0 while 3,436 claims
        # were mid-deletion, and was read as the phase having finished.
        visible_before=0
        for c in $CLASSES; do kubectl get ipclass.ipam.miloapis.com "$c" >/dev/null 2>&1 && visible_before=$((visible_before + 1)); done
        for p in $POOLS;   do kubectl get ippool.ipam.miloapis.com  "$p" >/dev/null 2>&1 && visible_before=$((visible_before + 1)); done
        claims_before=$(kubectl get ipclaim.ipam.miloapis.com -A -o name 2>/dev/null | grep -c . || true)
        visible_before=$((visible_before + claims_before))
        echo "==> visible before deleting: ${visible_before} fixture object(s) (${claims_before} claim(s))"

        # ORDER IS FORCED BY THE SCHEMA: claims hold allocations, and a pool
        # with allocations against it refuses to delete
        # (ipam_cidr_allocations.pool_key is ON DELETE RESTRICT). Claims first,
        # then pools, then the classes the pools name.
        echo "==> claims in the perf namespaces"
        for ns in $(kubectl get ns -o name 2>/dev/null | grep '^namespace/ipam-perf-' | sed 's|^namespace/||' || true); do
          kubectl delete ipclaim.ipam.miloapis.com --all -n "$ns" --ignore-not-found --wait=false || true
        done

        # Wait for the claims to actually go before deleting pools. Without
        # this the pool deletes race the claim finalisation and come back 409
        # naming an allocation that is on its way out.
        echo "==> waiting for claims to drain"
        deadline=$(( $(date +%s) + ${DRAIN_TIMEOUT:-180} ))
        while :; do
          # Counted through the SAME client that issued the deletes, which is
          # the platform identity here — so it sees platform-owned claims and
          # not tenant-owned ones. That is the right instrument for what this
          # task deletes, but it means "0 remaining" means "none that I can
          # see". CLEANUP-INCOMPLETE.md carries the database query for the rest.
          remaining=$(kubectl get ipclaim.ipam.miloapis.com -A -o name 2>/dev/null | grep -c . || true)
          if [ "$remaining" -eq 0 ]; then break; fi
          if [ "$(date +%s)" -ge "$deadline" ]; then
            echo "    WARNING: ${remaining} claim(s) still terminating; expect 409s below." >&2
            break
          fi
          sleep 2
        done

        # POOLS ARE DELETED IN REVERSE, AND SINCE #101 THAT IS LOAD-BEARING.
        #
        # The catalog lists a parent before the pool carved out of it, because
        # setup must create them in that order. Deletion is the other way round:
        # a parent with a live carve refuses to delete (the carve is a row
        # against it, and ipam_cidr_allocations.pool_key is ON DELETE RESTRICT),
        # so a forward pass leaves the parent behind and the survivor check
        # below fails the run.
        #
        # The second pass exists because reverse order is only guaranteed
        # correct for the pairs this file declares adjacently. A retry costs one
        # round trip per surviving pool and covers any nesting the catalog grows
        # later; without it, a deeper chain would fail in a way that reads as a
        # cluster problem rather than an ordering one.
        echo "==> pools"
        REVERSED=$(printf '%s\n' $POOLS | tail -r 2>/dev/null || printf '%s\n' $POOLS | tac)
        for p in $REVERSED; do
          kubectl delete ippool.ipam.miloapis.com "$p" --ignore-not-found || true
        done
        for p in $REVERSED; do
          if kubectl get ippool.ipam.miloapis.com "$p" >/dev/null 2>&1; then
            echo "    retrying $p (it held a carve when first attempted)"
            kubectl delete ippool.ipam.miloapis.com "$p" --ignore-not-found || true
          fi
        done

        echo "==> classes"
        for c in $CLASSES; do
          kubectl delete ipclass.ipam.miloapis.com "$c" --ignore-not-found || true
        done

        echo "==> perf namespaces"
        kubectl get ns -o name 2>/dev/null | grep '^namespace/ipam-perf-' \
          | xargs -r kubectl delete --wait=false || true

        # Report what actually survived. A cleanup that cannot tell you it left
        # something behind is worse than one that fails.
        pools_left=$(for p in $POOLS; do kubectl get ippool.ipam.miloapis.com "$p" -o name 2>/dev/null || true; done | grep -c . || true)
        classes_left=$(for c in $CLASSES; do kubectl get ipclass.ipam.miloapis.com "$c" -o name 2>/dev/null || true; done | grep -c . || true)
        if [ "$pools_left" -gt 0 ] || [ "$classes_left" -gt 0 ]; then
          echo "" >&2
          echo "INCOMPLETE: ${pools_left} pool(s) and ${classes_left} class(es) remain." >&2
          cat "{{.ROOT_DIR}}/test/load/CLEANUP-INCOMPLETE.md" >&2
          exit 1
        fi

        # RBAC goes LAST, and only once the fixtures are actually gone.
        #
        # It used to be deleted before this check, which quietly removed the
        # ability to finish the job: the recovery for a surviving pool is to
        # delete its tenant claims by IMPERSONATING their owner, and the
        # impersonated user gets its ipclaims verbs from perf-tenant-claimer.
        # Deleting that first made the documented recovery return 403 — found by
        # following CLEANUP-INCOMPLETE.md and watching step 2 fail.
        echo "==> class-consumption RBAC"
        kubectl get clusterrolebinding -o name 2>/dev/null \
          | grep '^clusterrolebinding.rbac.authorization.k8s.io/perf-class-user-' \
          | xargs -r kubectl delete --ignore-not-found || true
        kubectl delete clusterrole perf-class-user --ignore-not-found || true

        echo "==> impersonated-tenant RBAC"
        kubectl delete clusterrolebinding perf-tenant-claimer --ignore-not-found || true
        kubectl delete clusterrole perf-tenant-claimer --ignore-not-found || true

        if [ "${visible_before}" -eq 0 ]; then
          echo "cleanup finished, but NOTHING WAS VISIBLE TO DELETE."
          echo "  That is either an already-clean cluster or an identity problem,"
          echo "  and this task cannot tell the two apart. Check the database,"
          echo "  which is the only instrument that does not depend on who is asking:"
          echo "    select kind, count(*) from ipam_objects where key like '%perf-%' group by kind;"
        else
          echo "cleanup complete (${visible_before} fixture object(s) removed, 0 remain)."
        fi
